<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Half-Day Plan — Weekend Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --cream: #FFF8EE;
    --cream-card: #FFFFFF;
    --ink: #2B2640;
    --ink-soft: #6B6485;
    --coral: #FF6B6B;
    --coral-bg: #FFE3E3;
    --sunshine: #FFC857;
    --sunshine-bg: #FFF3D6;
    --grape: #8E7CC3;
    --grape-bg: #EDE8F7;
    --leaf: #4CAF6D;
    --leaf-bg: #DFF4E6;
    --sky: #2BA9A1;
    --sky-bg: #DAF3F1;
    --slate: #8B849F;
    --slate-bg: #EAE7F0;
    --line: #EDE6D9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 90px;
  }

  .back-link {
    display: inline-block;
    margin-top: 28px;
    color: var(--ink-soft);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .back-link:hover { color: var(--ink); }

  header.masthead {
    padding: 14px 0 6px;
    text-align: center;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(1.7rem, 5vw, 2.3rem);
    margin: 0 0 4px;
  }

  .masthead .sub {
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 0.9rem;
  }

  /* ---------- Timeline ---------- */

  .timeline {
    margin-top: 30px;
  }

  .travel-connector {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 6px 26px;
    position: relative;
  }

  .travel-connector::before {
    content: "";
    position: absolute;
    left: 10px;
    top: -10px;
    bottom: -10px;
    width: 3px;
    background: repeating-linear-gradient(
      to bottom, var(--line), var(--line) 6px, transparent 6px, transparent 12px
    );
  }

  .travel-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--cream-card);
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
    z-index: 1;
  }

  .travel-detail {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .travel-legs {
    font-size: 0.74rem;
    color: var(--ink-soft);
    margin-top: 2px;
    font-weight: 600;
  }

  /* ---------- Stop cards ---------- */

  .stop-card {
    background: var(--cream-card);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: 0 8px 0 rgba(43, 38, 64, 0.06);
    position: relative;
    margin-bottom: 4px;
  }

  .stop-card.is-missing {
    box-shadow: none;
    border: 2px dashed var(--line);
    text-align: center;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 24px 20px;
  }

  .stop-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .stop-number {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stop-time-badge {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    background: var(--sunshine-bg);
    color: #B8860B;
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .stop-body { display: flex; gap: 12px; align-items: flex-start; }

  .type-pill {
    display: inline-block;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 6px;
  }

  .type-pill.cafe { background: var(--coral-bg); color: var(--coral); }
  .type-pill.restaurant { background: var(--sunshine-bg); color: #B8860B; }
  .type-pill.bar { background: var(--grape-bg); color: var(--grape); }
  .type-pill.activity { background: var(--leaf-bg); color: var(--leaf); }
  .type-pill.view { background: var(--sky-bg); color: var(--sky); }
  .type-pill.other { background: var(--slate-bg); color: var(--slate); }

  .stop-card h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
    margin: 0 0 2px;
    font-weight: 600;
  }

  .stop-suburb {
    color: var(--ink-soft);
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .stop-duration {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .stop-why {
    font-size: 0.9rem;
    font-style: italic;
    margin: 0 0 8px;
  }

  .stop-link {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--sky);
    text-decoration: none;
  }

  .car-toggle {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 24px 0 4px;
  }

  .toggle-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--cream-card);
    color: var(--ink-soft);
    cursor: pointer;
  }

  .toggle-btn.is-active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--cream);
  }

  .export-section {
    margin-top: 32px;
    text-align: center;
  }

  .export-label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 12px;
  }

  .export-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .export-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.88rem;
    padding: 12px 20px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: var(--cream);
    background: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .export-btn:hover { background: var(--coral); }

  .export-btn:disabled {
    background: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  .export-note {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .state-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="weekend-watchlist.html">← Back to Weekend Watchlist</a>

  <header class="masthead">
    <h1>Your Half-Day Plan 🗓️</h1>
    <p class="sub" id="plan-sub"></p>
  </header>

  <div class="car-toggle" id="car-toggle" style="display:none;">
    <button class="toggle-btn is-active" id="toggle-car">🚗 I have a car today</button>
    <button class="toggle-btn" id="toggle-no-car">🚌 No car today</button>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="export-section" id="export-section" style="display:none;">
    <div class="export-label">📅 Add this plan to your calendar</div>
    <div class="export-buttons">
      <button class="export-btn" id="export-car">🚗 Leave by car</button>
      <button class="export-btn" id="export-transit">🚌 Leave by transit</button>
      <button class="export-btn" id="export-walk">🚶 Leave by foot</button>
    </div>
    <div class="export-note">Downloads one file with all stops and travel legs — import it into Apple Calendar, Google Calendar, or Outlook.</div>
  </div>

</div>

<script>
// Replace with the published CSV link for the "Itinerary" tab once it's live
const ITINERARY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLtrsHemEsiBjBhmJKsyMxwxtUO9Vn2SMWOO4xt5MGhNsqzIVQjoSaf8yBTHlXpxb2AqJBnCieGBoS/pub?gid=207826843&single=true&output=csv";

const TYPE_ICON = {
  cafe: '☕', restaurant: '🍝', bar: '🍹', activity: '🎨', view: '🌅', other: '⭐'
};

const TRAVEL_ICON = {
  car: '🚗', walk: '🚶', public: '🚌'
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? "";
  return div.innerHTML;
}

function isUnclear(val) {
  if (!val) return true;
  const v = val.trim().toLowerCase();
  return ['unclear', 'n/a', 'na', 'none', '-', 'not applicable'].includes(v);
}

function typeSlug(type) {
  const slug = (type || 'other').trim().toLowerCase();
  return TYPE_ICON[slug] ? slug : 'other';
}

function travelSlug(mode) {
  const m = (mode || '').toLowerCase();
  if (m.includes('car') || m.includes('drive')) return 'car';
  if (m.includes('walk')) return 'walk';
  return 'public';
}

let hasCar = true;

function travelFieldSuffix() {
  return hasCar ? ' (Car Day)' : ' (No Car Day)';
}

function renderTravelConnector(stop) {
  const suffix = travelFieldSuffix();
  const mode = stop['Travel Mode From Previous' + suffix];
  const time = stop['Travel Time From Previous' + suffix];
  const legs = stop['Travel Legs From Previous' + suffix];

  if (isUnclear(mode) && isUnclear(time)) return '';

  const slug = travelSlug(mode);
  const legsMarkup = (slug === 'public' && !isUnclear(legs))
    ? `<div class="travel-legs">${escapeHtml(legs)}</div>`
    : '';

  return `
    <div class="travel-connector">
      <div class="travel-icon">${TRAVEL_ICON[slug]}</div>
      <div>
        <div class="travel-detail">${!isUnclear(mode) ? escapeHtml(mode) : 'Travel'}${!isUnclear(time) ? ' · ' + escapeHtml(time) : ''}</div>
        ${legsMarkup}
      </div>
    </div>
  `;
}

function renderStop(stop) {
  const placeName = stop['Place Name'] || '';
  if (isUnclear(placeName) || /no suitable option/i.test(placeName)) {
    return `
      <div class="stop-card is-missing">
        Stop ${escapeHtml(stop['Stop Number'] || '')}: no suitable option found this week
        ${stop['Why This Stop'] && !isUnclear(stop['Why This Stop']) ? `<br><span style="font-weight:400;">${escapeHtml(stop['Why This Stop'])}</span>` : ''}
      </div>
    `;
  }

  const slug = typeSlug(stop['Type']);
  const sourceLink = stop['Source Link'];

  return `
    <div class="stop-card">
      <div class="stop-top">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="stop-number">${escapeHtml(stop['Stop Number'] || '')}</div>
        </div>
        ${!isUnclear(stop['Suggested Time']) ? `<span class="stop-time-badge">${escapeHtml(stop['Suggested Time'])}</span>` : ''}
      </div>
      <span class="type-pill ${slug}">${TYPE_ICON[slug]} ${escapeHtml(stop['Type'] || 'Other')}</span>
      <h2>${escapeHtml(placeName)}</h2>
      <div class="stop-suburb">${escapeHtml(stop['Suburb'] || '')}</div>
      ${!isUnclear(stop['Suggested Duration']) ? `<div class="stop-duration">⏱️ ${escapeHtml(stop['Suggested Duration'])}</div>` : ''}
      ${!isUnclear(stop['Why This Stop']) ? `<p class="stop-why">${escapeHtml(stop['Why This Stop'])}</p>` : ''}
      ${sourceLink && !isUnclear(sourceLink) ? `<a class="stop-link" href="${escapeHtml(sourceLink)}" target="_blank" rel="noopener">View source →</a>` : ''}
    </div>
  `;
}

function render(stops) {
  if (!stops || stops.length === 0 || isUnclear(stops[0]['Place Name'])) {
    document.getElementById('plan-sub').textContent = '';
    document.getElementById('timeline').innerHTML = `
      <div class="state-empty">No itinerary built yet — this fills in after the next scheduled run.</div>
    `;
    document.getElementById('export-section').style.display = 'none';
    document.getElementById('car-toggle').style.display = 'none';
    return;
  }

  currentStops = stops;
  document.getElementById('car-toggle').style.display = 'flex';
  document.getElementById('plan-sub').textContent = `${stops.length}-stop plan, starting with ${stops[0]['Place Name']}`;

  const sorted = [...stops].sort((a, b) => Number(a['Stop Number']) - Number(b['Stop Number']));
  const html = sorted.map(stop => renderTravelConnector(stop) + renderStop(stop)).join('');
  document.getElementById('timeline').innerHTML = html;
  document.getElementById('export-section').style.display = 'block';
}

/* ---------- Calendar export ---------- */

let currentStops = null;

// Parses "6:12 AM" + "2026-10-04" into a Date object (local time)
function parseDateTime(dateStr, timeStr) {
  if (isUnclear(dateStr) || isUnclear(timeStr)) return null;
  const match = timeStr.trim().match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!match) return null;
  let [, h, m, ampm] = match;
  h = parseInt(h, 10);
  m = parseInt(m, 10);
  if (ampm.toUpperCase() === 'PM' && h !== 12) h += 12;
  if (ampm.toUpperCase() === 'AM' && h === 12) h = 0;
  const [year, month, day] = dateStr.split('-').map(Number);
  return new Date(year, month - 1, day, h, m, 0);
}

function addMinutes(date, minutes) {
  return new Date(date.getTime() + minutes * 60000);
}

function formatICSDate(date) {
  const pad = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}T${pad(date.getHours())}${pad(date.getMinutes())}00`;
}

function escapeICS(str) {
  return (str || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
}

function buildEvent(summary, start, end, location, description) {
  if (!start || !end) return '';
  return [
    'BEGIN:VEVENT',
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@weekendwatchlist`,
    `DTSTART:${formatICSDate(start)}`,
    `DTEND:${formatICSDate(end)}`,
    `SUMMARY:${escapeICS(summary)}`,
    location ? `LOCATION:${escapeICS(location)}` : '',
    description ? `DESCRIPTION:${escapeICS(description)}` : '',
    'END:VEVENT'
  ].filter(Boolean).join('\r\n');
}

function buildItineraryICS(mode) {
  const stops = currentStops;
  if (!stops || stops.length === 0) return null;

  const events = [];
  const stop1 = stops.find(s => Number(s['Stop Number']) === 1);
  if (!stop1) return null;

  const date = stop1['Suggested Date'];
  const arrival1 = parseDateTime(date, stop1['Suggested Time']);

  const leaveByField = mode === 'car' ? 'Leave By Car' : mode === 'walk' ? 'Leave By Walk' : 'Leave By Public Transport';
  const leaveBy = parseDateTime(date, stop1[leaveByField]);
  const modeLabel = mode === 'car' ? 'Drive' : mode === 'walk' ? 'Walk' : 'Public transport';

  if (leaveBy && arrival1) {
    const desc = mode === 'transit' ? stop1['Public Transport Legs To Stop 1'] : `${modeLabel} to ${stop1['Place Name']}`;
    events.push(buildEvent(`${modeLabel} to ${stop1['Place Name']}`, leaveBy, arrival1, stop1['Address'], desc));
  }

  const sorted = [...stops].sort((a, b) => Number(a['Stop Number']) - Number(b['Stop Number']));

  sorted.forEach((stop, i) => {
    if (isUnclear(stop['Place Name']) || /no suitable option/i.test(stop['Place Name'])) return;
    const arrival = parseDateTime(stop['Suggested Date'], stop['Suggested Time']);
    const durationMin = parseInt(stop['Suggested Duration Minutes'], 10);
    const end = arrival && !isNaN(durationMin) ? addMinutes(arrival, durationMin) : null;

    if (arrival && end) {
      events.push(buildEvent(stop['Place Name'], arrival, end, stop['Address'], stop['Why This Stop']));
    }

    // Travel to the NEXT stop (stops 2 and 3 only, using the previous stop's end time)
    const next = sorted[i + 1];
    const suffix = travelFieldSuffix();
    const nextMode = next ? next['Travel Mode From Previous' + suffix] : null;
    if (next && !isUnclear(nextMode) && end) {
      const travelMin = parseInt(next['Travel Time From Previous Minutes' + suffix], 10);
      const nextArrival = parseDateTime(next['Suggested Date'], next['Suggested Time']);
      const travelStart = !isNaN(travelMin) ? addMinutes(nextArrival || end, -travelMin) : end;
      if (nextArrival) {
        events.push(buildEvent(
          `${nextMode} to ${next['Place Name']}`,
          travelStart, nextArrival, stop['Address'],
          next['Travel Legs From Previous' + suffix]
        ));
      }
    }
  });

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Weekend Watchlist//EN',
    ...events,
    'END:VCALENDAR'
  ].join('\r\n');

  return ics;
}

function downloadICS(mode) {
  const ics = buildItineraryICS(mode);
  if (!ics) {
    alert("Couldn't build a calendar file — some required times are missing for this plan.");
    return;
  }
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `weekend-plan-${mode}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('export-car').addEventListener('click', () => downloadICS('car'));
document.getElementById('export-transit').addEventListener('click', () => downloadICS('transit'));
document.getElementById('export-walk').addEventListener('click', () => downloadICS('walk'));

function setCarToggle(state) {
  hasCar = state;
  document.getElementById('toggle-car').classList.toggle('is-active', hasCar);
  document.getElementById('toggle-no-car').classList.toggle('is-active', !hasCar);
  document.getElementById('export-car').style.display = hasCar ? 'flex' : 'none';
  if (currentStops) render(currentStops);
}

document.getElementById('toggle-car').addEventListener('click', () => setCarToggle(true));
document.getElementById('toggle-no-car').addEventListener('click', () => setCarToggle(false));

Papa.parse(ITINERARY_CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    render(results.data);
  },
  error: function() {
    document.getElementById('timeline').innerHTML = '<div class="state-empty">Couldn\'t load the itinerary right now.</div>';
  }
});
</script>
</body>
</html>
