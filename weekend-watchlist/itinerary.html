<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Half-Day Plan — Weekend Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --cream: #FFF8EE;
    --cream-card: #FFFFFF;
    --ink: #2B2640;
    --ink-soft: #6B6485;
    --coral: #FF6B6B;
    --coral-bg: #FFE3E3;
    --sunshine: #FFC857;
    --sunshine-bg: #FFF3D6;
    --grape: #8E7CC3;
    --grape-bg: #EDE8F7;
    --leaf: #4CAF6D;
    --leaf-bg: #DFF4E6;
    --sky: #2BA9A1;
    --sky-bg: #DAF3F1;
    --slate: #8B849F;
    --slate-bg: #EAE7F0;
    --line: #EDE6D9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 90px;
  }

  .back-link {
    display: inline-block;
    margin-top: 28px;
    color: var(--ink-soft);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .back-link:hover { color: var(--ink); }

  header.masthead {
    padding: 14px 0 6px;
    text-align: center;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(1.7rem, 5vw, 2.3rem);
    margin: 0 0 4px;
  }

  .masthead .sub {
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 0.9rem;
  }

  /* ---------- Timeline ---------- */

  .timeline {
    margin-top: 30px;
  }

  .travel-connector {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 6px 26px;
    position: relative;
  }

  .travel-connector::before {
    content: "";
    position: absolute;
    left: 10px;
    top: -10px;
    bottom: -10px;
    width: 3px;
    background: repeating-linear-gradient(
      to bottom, var(--line), var(--line) 6px, transparent 6px, transparent 12px
    );
  }

  .travel-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--cream-card);
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
    z-index: 1;
  }

  .travel-detail {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .travel-legs {
    font-size: 0.74rem;
    color: var(--ink-soft);
    margin-top: 2px;
    font-weight: 600;
  }

  /* ---------- Stop cards ---------- */

  .stop-card {
    background: var(--cream-card);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: 0 8px 0 rgba(43, 38, 64, 0.06);
    position: relative;
    margin-bottom: 4px;
  }

  .stop-card.is-missing {
    box-shadow: none;
    border: 2px dashed var(--line);
    text-align: center;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 24px 20px;
  }

  .stop-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .stop-number {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stop-time-badge {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    background: var(--sunshine-bg);
    color: #B8860B;
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .stop-body { display: flex; gap: 12px; align-items: flex-start; }

  .type-pill {
    display: inline-block;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 6px;
  }

  .type-pill.cafe { background: var(--coral-bg); color: var(--coral); }
  .type-pill.restaurant { background: var(--sunshine-bg); color: #B8860B; }
  .type-pill.bar { background: var(--grape-bg); color: var(--grape); }
  .type-pill.activity { background: var(--leaf-bg); color: var(--leaf); }
  .type-pill.view { background: var(--sky-bg); color: var(--sky); }
  .type-pill.other { background: var(--slate-bg); color: var(--slate); }

  .stop-card h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
    margin: 0 0 2px;
    font-weight: 600;
  }

  .stop-suburb {
    color: var(--ink-soft);
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .stop-duration {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .stop-why {
    font-size: 0.9rem;
    font-style: italic;
    margin: 0 0 8px;
  }

  .stop-link {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--sky);
    text-decoration: none;
  }

  .state-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="weekend-watchlist.html">← Back to Weekend Watchlist</a>

  <header class="masthead">
    <h1>Your Half-Day Plan 🗓️</h1>
    <p class="sub" id="plan-sub"></p>
  </header>

  <div class="timeline" id="timeline"></div>

</div>

<script>
// Replace with the published CSV link for the "Itinerary" tab once it's live
const ITINERARY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLtrsHemEsiBjBhmJKsyMxwxtUO9Vn2SMWOO4xt5MGhNsqzIVQjoSaf8yBTHlXpxb2AqJBnCieGBoS/pub?gid=207826843&single=true&output=csv";

const TYPE_ICON = {
  cafe: '☕', restaurant: '🍝', bar: '🍹', activity: '🎨', view: '🌅', other: '⭐'
};

const TRAVEL_ICON = {
  car: '🚗', walk: '🚶', public: '🚌'
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? "";
  return div.innerHTML;
}

function isUnclear(val) {
  if (!val) return true;
  return val.trim().toLowerCase() === 'unclear';
}

function typeSlug(type) {
  const slug = (type || 'other').trim().toLowerCase();
  return TYPE_ICON[slug] ? slug : 'other';
}

function travelSlug(mode) {
  const m = (mode || '').toLowerCase();
  if (m.includes('car') || m.includes('drive')) return 'car';
  if (m.includes('walk')) return 'walk';
  return 'public';
}

function renderTravelConnector(stop) {
  const mode = stop['Travel Mode From Previous'];
  const time = stop['Travel Time From Previous'];
  const legs = stop['Travel Legs From Previous'];

  if (isUnclear(mode) && isUnclear(time)) return '';

  const slug = travelSlug(mode);
  const legsMarkup = (slug === 'public' && !isUnclear(legs))
    ? `<div class="travel-legs">${escapeHtml(legs)}</div>`
    : '';

  return `
    <div class="travel-connector">
      <div class="travel-icon">${TRAVEL_ICON[slug]}</div>
      <div>
        <div class="travel-detail">${!isUnclear(mode) ? escapeHtml(mode) : 'Travel'}${!isUnclear(time) ? ' · ' + escapeHtml(time) : ''}</div>
        ${legsMarkup}
      </div>
    </div>
  `;
}

function renderStop(stop) {
  const placeName = stop['Place Name'] || '';
  if (isUnclear(placeName) || /no suitable option/i.test(placeName)) {
    return `
      <div class="stop-card is-missing">
        Stop ${escapeHtml(stop['Stop Number'] || '')}: no suitable option found this week
        ${stop['Why This Stop'] && !isUnclear(stop['Why This Stop']) ? `<br><span style="font-weight:400;">${escapeHtml(stop['Why This Stop'])}</span>` : ''}
      </div>
    `;
  }

  const slug = typeSlug(stop['Type']);
  const sourceLink = stop['Source Link'];

  return `
    <div class="stop-card">
      <div class="stop-top">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="stop-number">${escapeHtml(stop['Stop Number'] || '')}</div>
        </div>
        ${!isUnclear(stop['Suggested Time']) ? `<span class="stop-time-badge">${escapeHtml(stop['Suggested Time'])}</span>` : ''}
      </div>
      <span class="type-pill ${slug}">${TYPE_ICON[slug]} ${escapeHtml(stop['Type'] || 'Other')}</span>
      <h2>${escapeHtml(placeName)}</h2>
      <div class="stop-suburb">${escapeHtml(stop['Suburb'] || '')}</div>
      ${!isUnclear(stop['Suggested Duration']) ? `<div class="stop-duration">⏱️ ${escapeHtml(stop['Suggested Duration'])}</div>` : ''}
      ${!isUnclear(stop['Why This Stop']) ? `<p class="stop-why">${escapeHtml(stop['Why This Stop'])}</p>` : ''}
      ${sourceLink && !isUnclear(sourceLink) ? `<a class="stop-link" href="${escapeHtml(sourceLink)}" target="_blank" rel="noopener">View source →</a>` : ''}
    </div>
  `;
}

function render(stops) {
  if (!stops || stops.length === 0 || isUnclear(stops[0]['Place Name'])) {
    document.getElementById('plan-sub').textContent = '';
    document.getElementById('timeline').innerHTML = `
      <div class="state-empty">No itinerary built yet — this fills in after the next scheduled run.</div>
    `;
    return;
  }

  document.getElementById('plan-sub').textContent = `${stops.length}-stop plan, starting with ${stops[0]['Place Name']}`;

  const sorted = [...stops].sort((a, b) => Number(a['Stop Number']) - Number(b['Stop Number']));
  const html = sorted.map(stop => renderTravelConnector(stop) + renderStop(stop)).join('');
  document.getElementById('timeline').innerHTML = html;
}

Papa.parse(ITINERARY_CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    render(results.data);
  },
  error: function() {
    document.getElementById('timeline').innerHTML = '<div class="state-empty">Couldn\'t load the itinerary right now.</div>';
  }
});
</script>
</body>
</html>
