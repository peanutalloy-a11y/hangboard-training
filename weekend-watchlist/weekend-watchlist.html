<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekend Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --cream: #FFF8EE;
    --cream-card: #FFFFFF;
    --ink: #2B2640;
    --ink-soft: #6B6485;
    --coral: #FF6B6B;
    --coral-bg: #FFE3E3;
    --sunshine: #FFC857;
    --sunshine-bg: #FFF3D6;
    --grape: #8E7CC3;
    --grape-bg: #EDE8F7;
    --leaf: #4CAF6D;
    --leaf-bg: #DFF4E6;
    --sky: #2BA9A1;
    --sky-bg: #DAF3F1;
    --slate: #8B849F;
    --slate-bg: #EAE7F0;
    --line: #EDE6D9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 90px;
  }

  header.masthead {
    padding: 44px 0 10px;
    text-align: center;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    margin: 0;
    color: var(--ink);
  }

  .tagline {
    margin: 8px auto 0;
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: 1.05rem;
    font-weight: 600;
  }

  /* ---------- Ticket banner ---------- */

  .ticket {
    background: var(--sunshine);
    border-radius: 24px;
    margin: 32px 0 44px;
    padding: 26px 30px;
    position: relative;
    box-shadow: 0 10px 0 rgba(43, 38, 64, 0.08);
  }

  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    background: var(--cream);
    border-radius: 50%;
  }

  .ticket::before { left: -14px; }
  .ticket::after { right: -14px; }

  .ticket-row {
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .ticket-stub {
    text-align: center;
    padding-right: 24px;
    border-right: 3px dashed rgba(43, 38, 64, 0.25);
    flex-shrink: 0;
  }

  .ticket-stub .stub-label {
    font-family: 'Fredoka', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(43, 38, 64, 0.65);
  }

  .ticket-stub .stub-day {
    font-family: 'Fredoka', sans-serif;
    font-size: 2.1rem;
    font-weight: 700;
    line-height: 1.1;
  }

  .ticket-main { flex: 1; min-width: 220px; }

  .ticket-eyebrow {
    font-family: 'Fredoka', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(43, 38, 64, 0.7);
    margin: 0 0 2px;
  }

  .ticket-main h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.8rem;
    margin: 0 0 4px;
    font-weight: 600;
  }

  .ticket-suburb {
    margin: 0;
    font-weight: 700;
    color: rgba(43, 38, 64, 0.7);
    font-size: 0.88rem;
  }

  .ticket-forecasts {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 16px 0 14px;
  }

  .fc-pill {
    background: rgba(255,255,255,0.55);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink);
  }

  .fc-pill.is-best {
    border-color: var(--coral);
    background: #fff;
  }

  .ticket-stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.82rem;
    font-weight: 700;
    color: rgba(43, 38, 64, 0.8);
    border-top: 2px dashed rgba(43,38,64,0.2);
    padding-top: 12px;
  }

  .ticket-why {
    margin: 10px 0 0;
    font-weight: 700;
    font-style: italic;
    color: rgba(43,38,64,0.75);
    font-size: 0.9rem;
  }

  .ticket-empty {
    font-weight: 700;
    color: rgba(43,38,64,0.75);
  }

  /* ---------- Controls ---------- */

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
    justify-content: center;
  }

  .search-field input {
    padding: 11px 18px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--cream-card);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
    min-width: 220px;
  }

  .search-field input:focus-visible {
    outline: none;
    border-color: var(--grape);
  }

  select#suburb-filter {
    padding: 10px 16px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--cream-card);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ink);
  }

  .type-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chip {
    border: 2px solid var(--line);
    background: var(--cream-card);
    color: var(--ink-soft);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
  }

  .chip:hover { border-color: var(--grape); }

  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--cream);
  }

  .chip:focus-visible { outline: 2px solid var(--grape); outline-offset: 2px; }

  .count-line {
    text-align: center;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 0.85rem;
    margin: 18px 0 24px;
  }

  /* ---------- Grid ---------- */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 30px;
  }

  .card {
    background: var(--cream-card);
    border-radius: 20px;
    padding: 14px 14px 18px;
    box-shadow: 0 8px 0 rgba(43, 38, 64, 0.06);
    position: relative;
    transition: transform 0.15s ease;
  }

  .card:nth-child(3n+1) { transform: rotate(-1.4deg); }
  .card:nth-child(3n+2) { transform: rotate(1deg); }
  .card:nth-child(3n+3) { transform: rotate(-0.5deg); }
  .card:hover { transform: rotate(0deg) translateY(-3px); }
  .card.is-closed { opacity: 0.55; }

  .card-photo-frame {
    background: #fff;
    border-radius: 14px;
    padding: 8px 8px 0;
    position: relative;
  }

  .card-photo, .card-photo-empty {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    border-radius: 10px 10px 0 0;
    display: block;
  }

  .card-photo-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--line);
    color: var(--ink-soft);
    font-family: 'Fredoka', sans-serif;
    font-size: 0.85rem;
    text-align: center;
    padding: 10px;
  }

  .stamp {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.4rem;
    border: 3px solid var(--cream-card);
    box-shadow: 0 3px 0 rgba(43,38,64,0.1);
  }

  .stamp.cafe { background: var(--coral-bg); color: var(--coral); }
  .stamp.restaurant { background: var(--sunshine-bg); color: #B8860B; }
  .stamp.bar { background: var(--grape-bg); color: var(--grape); }
  .stamp.activity { background: var(--leaf-bg); color: var(--leaf); }
  .stamp.view { background: var(--sky-bg); color: var(--sky); }
  .stamp.other { background: var(--slate-bg); color: var(--slate); }

  .card-body { padding: 14px 6px 0; }

  .card-body h3 {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.2rem;
    margin: 0 0 2px;
    font-weight: 600;
  }

  .suburb-line {
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .type-pill {
    display: inline-block;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 11px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .type-pill.cafe { background: var(--coral-bg); color: var(--coral); }
  .type-pill.restaurant { background: var(--sunshine-bg); color: #B8860B; }
  .type-pill.bar { background: var(--grape-bg); color: var(--grape); }
  .type-pill.activity { background: var(--leaf-bg); color: var(--leaf); }
  .type-pill.view { background: var(--sky-bg); color: var(--sky); }
  .type-pill.other { background: var(--slate-bg); color: var(--slate); }

  .closed-pill {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--coral);
    border: 2px dashed var(--coral);
    padding: 2px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .why {
    font-size: 0.9rem;
    margin: 0 0 10px;
    color: var(--ink);
  }

  .detail-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .detail-chip {
    font-size: 0.75rem;
    font-weight: 700;
    background: var(--cream);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--ink-soft);
  }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-soft);
    border-top: 2px dashed var(--line);
    padding-top: 10px;
    margin-top: 4px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .rating-pill {
    background: var(--sunshine-bg);
    color: #B8860B;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .visited-pill {
    background: var(--leaf-bg);
    color: var(--leaf);
    padding: 2px 10px;
    border-radius: 999px;
  }

  .source-link {
    color: var(--sky);
    text-decoration: none;
    font-weight: 800;
  }

  .state-block {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
    background: var(--cream-card);
    border-radius: 20px;
    font-weight: 700;
  }

  .state-block h2 {
    font-family: 'Fredoka', sans-serif;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 8px;
  }

  @media (max-width: 480px) {
    .card { transform: none !important; }
    .ticket-row { flex-direction: column; align-items: stretch; text-align: center; }
    .ticket-stub { border-right: none; border-bottom: 3px dashed rgba(43,38,64,0.25); padding: 0 0 14px; }
    .ticket-stats, .ticket-forecasts { justify-content: center; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Weekend Watchlist 🎟️</h1>
    <p class="tagline">Every cafe, view and outing you've screenshotted and almost forgot about — saved, sorted, and ready to go.</p>
  </header>

  <section class="ticket" id="pick-section">
    <div id="pick-content">
      <p class="ticket-empty">Loading this week's pick...</p>
    </div>
  </section>

  <div class="controls">
    <div class="search-field">
      <input type="text" id="search" placeholder="🔍 Search by name or vibe..." aria-label="Search outings">
    </div>
    <select id="suburb-filter" aria-label="Filter by suburb">
      <option value="">All suburbs</option>
    </select>
  </div>
  <div class="controls">
    <div class="type-chips" id="type-chips" role="group" aria-label="Filter by type"></div>
  </div>

  <p class="count-line" id="count-line"></p>

  <div id="content">
    <div class="state-block"><h2>Loading your list...</h2></div>
  </div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLtrsHemEsiBjBhmJKsyMxwxtUO9Vn2SMWOO4xt5MGhNsqzIVQjoSaf8yBTHlXpxb2AqJBnCieGBoS/pub?gid=0&single=true&output=csv";
const PICK_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLtrsHemEsiBjBhmJKsyMxwxtUO9Vn2SMWOO4xt5MGhNsqzIVQjoSaf8yBTHlXpxb2AqJBnCieGBoS/pub?gid=662357100&single=true&output=csv";

const TYPE_ICON = {
  cafe: '☕', restaurant: '🍝', bar: '🍹', activity: '🎨', view: '🌅', other: '⭐'
};
const FIXED_TYPES = ['Cafe', 'Restaurant', 'Bar', 'Activity', 'View', 'Other'];

let allRows = [];
let activeType = "";

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? "";
  return div.innerHTML;
}

function isUnclear(val) {
  if (!val) return true;
  const v = val.trim().toLowerCase();
  return ['unclear', 'n/a', 'na', 'none', '-', 'not applicable'].includes(v);
}

function typeSlug(type) {
  const slug = (type || 'other').trim().toLowerCase();
  return TYPE_ICON[slug] ? slug : 'other';
}

/* ---------- Weekend pick ---------- */

function renderPick(pick) {
  const container = document.getElementById('pick-content');

  if (!pick || !pick['Place Name'] || isUnclear(pick['Place Name'])) {
    const reason = (pick && pick['Why This One'] && !isUnclear(pick['Why This One']))
      ? pick['Why This One']
      : "No pick has been generated yet — this fills in after the next scheduled run.";
    container.innerHTML = `<p class="ticket-empty">🎟️ ${escapeHtml(reason)}</p>`;
    return;
  }

  const days = [
    { label: 'Fri', key: 'Friday Forecast' },
    { label: 'Sat', key: 'Saturday Forecast' },
    { label: 'Sun', key: 'Sunday Forecast' },
  ];
  const bestDay = (pick['Best Day To Go'] || '').trim().toLowerCase();
  const bestDayShort = bestDay.slice(0, 3);

  const forecastMarkup = days.map(d => {
    const isBest = bestDay && d.label.toLowerCase() === bestDayShort;
    const forecast = isUnclear(pick[d.key]) ? '—' : pick[d.key];
    return `<span class="fc-pill ${isBest ? 'is-best' : ''}">${d.label}: ${escapeHtml(forecast)}</span>`;
  }).join('');

  const statsMarkup = [
    ['🚗', pick['Drive Time From Home']],
    ['🚶', pick['Walk Time (Approx)']],
    ['🚌', pick['Public Transport Suggestion']],
  ].filter(([, v]) => !isUnclear(v)).map(([icon, v]) => `<span>${icon} ${escapeHtml(v)}</span>`).join('');

  const itineraryLink = `<a href="itinerary.html" style="font-weight:800;color:var(--ink);text-decoration:underline;white-space:nowrap;">🗓️ See the full plan →</a>`;

  container.innerHTML = `
    <div class="ticket-row">
      <div class="ticket-stub">
        <div class="stub-label">Best day</div>
        <div class="stub-day">${escapeHtml((pick['Best Day To Go'] || '—').slice(0, 3).toUpperCase())}</div>
      </div>
      <div class="ticket-main">
        <div class="ticket-eyebrow">🏆 This weekend's pick</div>
        <h2>${escapeHtml(pick['Place Name'])}</h2>
        <p class="ticket-suburb">${escapeHtml(pick['Suburb'] || '')}</p>
      </div>
    </div>
    <div class="ticket-forecasts">${forecastMarkup}</div>
    ${statsMarkup ? `<div class="ticket-stats">${statsMarkup}<span>${itineraryLink}</span></div>` : `<div class="ticket-stats">${itineraryLink}</div>`}
    ${pick['Why This One'] && !isUnclear(pick['Why This One']) ? `<p class="ticket-why">${escapeHtml(pick['Why This One'])}</p>` : ''}
  `;
}

function loadPick() {
  Papa.parse(PICK_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      renderPick(results.data[0]);
    },
    error: function() {
      document.getElementById('pick-content').innerHTML =
        '<p class="ticket-empty">Couldn\'t load this week\'s pick right now.</p>';
    }
  });
}

/* ---------- Hours and event dates ---------- */

function dayHours(row, day) {
  const open = (row['Open (' + day + ')'] || '').trim();
  const close = (row['Close (' + day + ')'] || '').trim();
  if (open.toLowerCase() === 'closed') return 'Closed';
  if (isUnclear(open) || isUnclear(close)) return null;
  if (open === '12:00 AM' && close === '11:59 PM') return 'Open 24 hours';
  return open + '–' + close;
}

function weekendHours(row) {
  const sat = dayHours(row, 'Saturday');
  const sun = dayHours(row, 'Sunday');
  if (!sat && !sun) return '';
  if (sat && sun && sat === sun) return 'Sat–Sun ' + sat;
  const parts = [];
  if (sat) parts.push('Sat ' + sat);
  if (sun) parts.push('Sun ' + sun);
  return parts.join(' · ');
}

function parseISODate(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((str || '').trim());
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

function shortDate(str) {
  const d = parseISODate(str);
  return d ? d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
}

function eventDates(row) {
  const start = shortDate(row['Event Start Date']);
  const end = shortDate(row['Event End Date']);
  if (start && end) return start + ' – ' + end;
  if (end) return 'Until ' + end;
  if (start) return 'From ' + start;
  return '';
}

function eventHasEnded(row) {
  const end = parseISODate(row['Event End Date']);
  if (!end) return false;
  end.setHours(23, 59, 59);
  return end < new Date();
}

/* ---------- Cards ---------- */

function detailChip(icon, value) {
  if (isUnclear(value)) return '';
  return `<span class="detail-chip">${icon} ${escapeHtml(value)}</span>`;
}

function buildCard(row) {
  const name = row['Place Name'] || 'Untitled spot';
  const suburb = row['Suburb'] || '';
  const slug = typeSlug(row['Type']);
  const typeLabel = row['Type'] || 'Other';
  const why = row["Why It's Worth Visiting"] || '';
  const stillOperating = (row['Still Operating?'] || '').trim().toLowerCase();
  const closed = stillOperating === 'no';
  const visited = (row['Visited?'] || '').trim().toLowerCase();
  const isVisited = visited === 'yes' || visited === 'y';
  const sourceLink = row['Source Link'] || '';
  const photoUrl = row['Photo URL'] || '';
  const hasPhoto = photoUrl && !isUnclear(photoUrl);

  const photoMarkup = hasPhoto
    ? `<img class="card-photo" src="${escapeHtml(photoUrl)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;card-photo-empty&quot;>No photo yet</div>';">`
    : `<div class="card-photo-empty">No photo yet</div>`;

  const dryWeather = (row['Weather Dependent?'] || '').trim().toLowerCase() === 'yes'
    ? '<span class="detail-chip">☀️ Best in dry weather</span>' : '';
  const hours = weekendHours(row);
  const dates = eventDates(row);

  const chips = [
    detailChip('🎉', row['Good For']),
    detailChip('✨', row['Signature Dish/Drink']),
    dryWeather,
    hours ? detailChip('🕒', hours) : '',
    dates ? detailChip('📅', dates) : '',
  ].join('');

  return `
    <article class="card ${closed ? 'is-closed' : ''}">
      <div class="card-photo-frame">
        ${photoMarkup}
        <div class="stamp ${slug}">${TYPE_ICON[slug]}</div>
      </div>
      <div class="card-body">
        <span class="type-pill ${slug}">${escapeHtml(typeLabel)}</span>
        <h3>${escapeHtml(name)}</h3>
        <div class="suburb-line">${escapeHtml(suburb)}</div>
        ${closed ? '<span class="closed-pill">Might be closed — check first</span>' : ''}
        ${why ? `<p class="why">${escapeHtml(why)}</p>` : ''}
        ${chips ? `<div class="detail-chips">${chips}</div>` : ''}
        <div class="card-foot">
          <span></span>
          ${isVisited ? '<span class="visited-pill">✅ Been here</span>' : ''}
          ${sourceLink && !isUnclear(sourceLink) ? `<a class="source-link" href="${escapeHtml(sourceLink)}" target="_blank" rel="noopener">View source →</a>` : ''}
        </div>
      </div>
    </article>
  `;
}

function populateFilters(rows) {
  const suburbs = [...new Set(rows.map(r => r['Suburb']).filter(s => s && s.trim()))].sort();
  const select = document.getElementById('suburb-filter');
  suburbs.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    select.appendChild(opt);
  });

  const presentTypes = new Set(rows.map(r => (r['Type'] || '').trim()));
  const types = FIXED_TYPES.filter(t => presentTypes.has(t));
  const chipWrap = document.getElementById('type-chips');

  const allBtn = document.createElement('button');
  allBtn.className = 'chip';
  allBtn.textContent = 'All';
  allBtn.setAttribute('aria-pressed', 'true');
  allBtn.addEventListener('click', () => {
    activeType = '';
    chipWrap.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    allBtn.setAttribute('aria-pressed', 'true');
    render();
  });
  chipWrap.appendChild(allBtn);

  types.forEach(t => {
    const slug = typeSlug(t);
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = `${TYPE_ICON[slug]} ${t}`;
    btn.setAttribute('aria-pressed', 'false');
    btn.addEventListener('click', () => {
      chipWrap.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
      activeType = t;
      btn.setAttribute('aria-pressed', 'true');
      render();
    });
    chipWrap.appendChild(btn);
  });
}

function render() {
  const searchTerm = document.getElementById('search').value.trim().toLowerCase();
  const suburb = document.getElementById('suburb-filter').value;

  const filtered = allRows.filter(row => {
    const name = (row['Place Name'] || '').toLowerCase();
    const why = (row["Why It's Worth Visiting"] || '').toLowerCase();
    const matchesSearch = !searchTerm || name.includes(searchTerm) || why.includes(searchTerm);
    const matchesSuburb = !suburb || row['Suburb'] === suburb;
    const matchesType = !activeType || row['Type'] === activeType;
    return matchesSearch && matchesSuburb && matchesType;
  });

  const content = document.getElementById('content');
  const countLine = document.getElementById('count-line');

  if (allRows.length === 0) {
    countLine.textContent = '';
    content.innerHTML = `
      <div class="state-block">
        <h2>Nothing catalogued yet 🗒️</h2>
        <p>Drop a screenshot into your Outings Screenshots folder, then ask Claude to check for new outings. It'll land here once the sheet picks it up.</p>
      </div>
    `;
    return;
  }

  if (filtered.length === 0) {
    countLine.textContent = `0 of ${allRows.length} spots match`;
    content.innerHTML = `
      <div class="state-block">
        <h2>No matches 🔍</h2>
        <p>Try a different search term, suburb, or clear the type filter.</p>
      </div>
    `;
    return;
  }

  countLine.textContent = `${filtered.length} of ${allRows.length} spots`;
  content.innerHTML = `<div class="grid">${filtered.map(buildCard).join('')}</div>`;
}

function loadData() {
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allRows = results.data.filter(r => r['Place Name'] && r['Place Name'].trim() && !eventHasEnded(r));
      populateFilters(allRows);
      render();
    },
    error: function(err) {
      document.getElementById('content').innerHTML = `
        <div class="state-block">
          <h2>Couldn't load the sheet</h2>
          <p>Check the published CSV link is still live, or try refreshing.<br>${escapeHtml(err.message || '')}</p>
        </div>
      `;
    }
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('suburb-filter').addEventListener('change', render);

loadData();
loadPick();
</script>
</body>
</html>
