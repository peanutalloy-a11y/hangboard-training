<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarful">
<meta name="theme-color" content="#FBF3E7">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="manifest" href="manifest.json">
<title>Jarful</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2440;
    --ink-soft: #857BA0;
    --paper: #FBF3E7;
    --paper-raised: #FFFFFF;
    --brass: #F5A93E;
    --brass-soft: #FDE5B8;
    --green: #3F9D6F;
    --green-soft: #DCF2E4;
    --rust: #EF6F53;
    --rust-soft: #FCE1D9;
    --sky: #4F97D6;
    --sky-soft: #DDEDFB;
    --lilac: #A480CE;
    --lilac-soft: #EBE1F7;
    --line: #EEE1CB;
    --radius: 18px;
  }
  :root[data-theme="dark"] {
    --ink: #F3EEFB;
    --ink-soft: #B7AAD4;
    --paper: #211A33;
    --paper-raised: #2C2447;
    --brass: #F7BA5C;
    --brass-soft: #4A3A24;
    --green: #6FCB9B;
    --green-soft: #223B30;
    --rust: #F0917A;
    --rust-soft: #422A25;
    --sky: #7DB8EA;
    --sky-soft: #223347;
    --lilac: #C4A6E8;
    --lilac-soft: #34274E;
    --line: #3A3158;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, h3 { font-family: "Fredoka", sans-serif; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-weight: 700; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* Header */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    padding: env(safe-area-inset-top, 0px) 18px 0 18px;
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 10px; }
  .wordmark { font-family: "Fredoka", sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .wordmark svg { width: 24px; height: 24px; flex-shrink: 0; }
  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: none; background: var(--paper-raised);
    color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 2px 0 var(--line);
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:active { transform: translateY(1px); box-shadow: none; }

  /* Main / views */
  main { flex: 1; padding: 6px 18px 108px; }
  section.view { display: none; }
  section.view.active { display: block; }

  .section-title {
    font-family: "Fredoka", sans-serif; font-size: 15px; font-weight: 600;
    color: var(--ink); margin: 28px 0 10px; display: flex; justify-content: space-between; align-items: center;
  }
  .section-title:first-child { margin-top: 0; }
  .section-title .link-btn {
    font-family: "Nunito Sans", sans-serif; color: var(--brass); background: var(--brass-soft);
    border: none; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 6px 12px; border-radius: 20px;
  }

  /* Balance hero */
  .balance-card {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--brass-soft), var(--paper-raised) 85%);
    border-radius: var(--radius);
    padding: 22px 20px 20px;
    margin-top: 8px;
  }
  .balance-card::before, .balance-card::after {
    content: ''; position: absolute; border-radius: 50%; opacity: 0.55; pointer-events: none;
  }
  .balance-card::before { width: 70px; height: 70px; background: var(--lilac-soft); top: -20px; right: -10px; animation: coinDrift1 5.5s ease-in-out infinite; }
  .balance-card::after { width: 46px; height: 46px; background: var(--sky-soft); bottom: -14px; right: 60px; animation: coinDrift2 6.5s ease-in-out infinite; }
  .coin-dot { position: absolute; border-radius: 50%; opacity: 0.7; pointer-events: none; animation: coinDrift3 4.4s ease-in-out infinite; }
  .balance-label { color: var(--ink-soft); font-size: 13px; font-weight: 700; position: relative; }
  .balance-amount { font-family: "Fredoka", serif; font-size: 44px; font-weight: 700; margin-top: 2px; position: relative; }
  .balance-amount.negative { color: var(--rust); }
  .balance-empty-note { font-size: 13px; color: var(--ink-soft); margin-top: 10px; position: relative; font-weight: 600; }
  .balance-empty-note button { color: var(--brass); background: none; border: none; font: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 0; }

  .horizon-tabs { display: flex; gap: 4px; margin: 18px 0 12px; position: relative; background: var(--paper-raised); border-radius: 20px; padding: 4px; }
  .horizon-pill {
    position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 16px; background: var(--brass);
    transition: transform .32s cubic-bezier(.22,.61,.36,1), width .32s cubic-bezier(.22,.61,.36,1);
    z-index: 0; pointer-events: none;
  }
  .horizon-tabs button {
    flex: 1; padding: 9px 0; border-radius: 20px; border: none; position: relative; z-index: 1;
    background: transparent; color: var(--ink-soft); font: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
    transition: color .2s ease;
  }
  .horizon-tabs button.active { color: #fff; }

  canvas#forecast-canvas { width: 100%; display: block; }

  .forecast-summary { font-size: 13.5px; color: var(--ink-soft); margin: 10px 0 4px; font-weight: 600; }
  .forecast-summary .num { color: var(--ink); }
  .warning-banner {
    background: var(--rust-soft); border: none; color: var(--rust);
    padding: 12px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; margin: 10px 0;
    animation: bannerPulse .5s cubic-bezier(.34,1.56,.64,1) both;
  }

  /* Rows / lists */
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px; border-bottom: none; gap: 10px;
    background: var(--paper-raised); border-radius: 14px; margin-bottom: 8px;
    overflow: hidden;
  }
  .row.row-enter { animation: rowFadeSlideIn .32s cubic-bezier(.22,.61,.36,1) both; }
  .row.row-exiting {
    transition: opacity .22s ease, max-height .28s ease, margin-bottom .28s ease, padding .28s ease, transform .22s ease;
    opacity: 0; transform: scale(.97); padding-top: 0; padding-bottom: 0; margin-bottom: 0;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 14.5px; font-weight: 700; }
  .row-sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; font-weight: 600; }
  .row-amount { font-size: 15px; white-space: nowrap; }
  .row-amount.income { color: var(--green); }
  .row-amount.expense { color: var(--rust); }
  .row-actions { display: flex; gap: 2px; margin-left: 4px; }
  .row-actions button {
    border: none; background: none; color: var(--ink-soft); cursor: pointer; padding: 5px; border-radius: 8px;
  }
  .row-actions svg { width: 16px; height: 16px; }

  .chip {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    background: var(--sky-soft); color: var(--sky); margin-right: 4px;
  }

  /* Bill category groups */
  .bill-group { margin-bottom: 8px; }
  .bill-group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    background: var(--paper-raised); border: none; border-radius: 14px; cursor: pointer;
    font: inherit; color: var(--ink); text-align: left;
  }
  .bill-group-head:active { background: var(--brass-soft); }
  .bill-group-chevron { display: flex; color: var(--ink-soft); transition: transform .25s ease; flex-shrink: 0; }
  .bill-group-chevron svg { width: 16px; height: 16px; }
  .bill-group-chevron.open { transform: rotate(90deg); }
  .bill-group-name { flex: 1; font-weight: 700; font-size: 14px; }
  .bill-group-count {
    font-size: 11.5px; font-weight: 700; color: var(--ink-soft); background: var(--paper);
    padding: 2px 9px; border-radius: 20px; flex-shrink: 0;
  }
  .bill-group-body { overflow: hidden; max-height: 0; transition: max-height .32s cubic-bezier(.22,.61,.36,1); }
  .bill-group-body.open { max-height: none; }
  .bill-group-body .row { margin: 8px 0 0; }

  .empty-state {
    color: var(--ink-soft); font-size: 13.5px; padding: 22px 0; text-align: center;
    background: var(--paper-raised); border-radius: 14px; font-weight: 600;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 18px; border-radius: 20px; border: none;
    background: var(--paper-raised); color: var(--ink); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 0 var(--line);
  }
  .btn-primary { background: var(--brass); color: #fff; box-shadow: 0 3px 0 #C9862A; }
  .btn-danger { color: var(--rust); background: var(--rust-soft); box-shadow: none; }
  .btn-block { width: 100%; }
  .btn:active { transform: translateY(1px); box-shadow: none; }

  /* Forms */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 700; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--paper); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--brass); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .segmented { display: flex; background: var(--paper); border-radius: 20px; overflow: hidden; padding: 4px; position: relative; }
  .segment-pill {
    position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 16px; background: var(--brass);
    transition: transform .3s cubic-bezier(.22,.61,.36,1), width .3s cubic-bezier(.22,.61,.36,1);
    z-index: 0; pointer-events: none;
  }
  .segmented button {
    flex: 1; padding: 9px 0; border: none; background: transparent; color: var(--ink-soft); font: inherit; font-weight: 700; cursor: pointer; font-size: 13.5px; border-radius: 16px;
    position: relative; z-index: 1; transition: color .2s ease;
  }
  .segmented button.active { color: #fff; }

  /* Progress bars */
  .progress-track { height: 10px; background: var(--paper); border-radius: 20px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 20px; width: 0; transition: width .7s cubic-bezier(.22,.61,.36,1), background-color .4s ease; }
  .progress-fill.over { background: var(--rust); }
  .progress-fill.bar-pulse { animation: barPulse .6s ease-out; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(43,36,64,0.45); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--paper); width: 100%; max-width: 480px; border-radius: 26px 26px 0 0;
    max-height: 88vh; overflow-y: auto; padding: 6px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 12px; position: sticky; top: 0; background: var(--paper); }
  .modal-head h3 { font-size: 19px; }
  .modal-head button { border: none; background: var(--paper-raised); color: var(--ink-soft); font-size: 16px; cursor: pointer; line-height: 1; padding: 8px; border-radius: 50%; }

  /* Tabbar */
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--paper-raised);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
    box-shadow: 0 -2px 10px rgba(43,36,64,0.06);
  }
  .tabbar-inner { display: flex; width: 100%; max-width: 480px; gap: 4px; position: relative; }
  .tab-pill {
    position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 16px; background: var(--brass-soft);
    transition: transform .38s cubic-bezier(.22,.61,.36,1), width .38s cubic-bezier(.22,.61,.36,1);
    z-index: 0; pointer-events: none;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: var(--ink-soft); font: inherit; font-weight: 700; font-size: 10.5px; padding: 7px 0; cursor: pointer;
    border-radius: 16px; position: relative; z-index: 1; transition: color .2s ease;
  }
  .tab-btn svg { width: 21px; height: 21px; }
  .tab-btn.active { color: var(--brass); }

  a { color: var(--brass); }
  ::selection { background: var(--brass-soft); }

  /* ---- Dark mode crossfade ---- */
  body, .balance-card, .row, .icon-btn, .btn, .chip, .empty-state,
  .field input, .field select, .modal, nav.tabbar, header.topbar,
  .progress-track, .segmented, .horizon-tabs, .tab-pill, .horizon-pill, .segment-pill,
  .bill-group-head, .bill-group-count {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  /* ---- View switching ---- */
  @keyframes viewSlideInRight { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
  @keyframes viewSlideInLeft { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
  @keyframes viewFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---- Rows ---- */
  @keyframes rowFadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---- Warning banner ---- */
  @keyframes bannerPulse { 0% { opacity: 0; transform: scale(.96); } 60% { opacity: 1; transform: scale(1.02); } 100% { opacity: 1; transform: scale(1); } }

  /* ---- Progress bar pulse (goal top-up) ---- */
  @keyframes barPulse {
    0% { box-shadow: 0 0 0 0 rgba(245,169,62,0.55); }
    70% { box-shadow: 0 0 0 9px rgba(245,169,62,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,169,62,0); }
  }

  /* ---- Ambient coin drift on the hero ---- */
  @keyframes coinDrift1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes coinDrift2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  @keyframes coinDrift3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* ---- Coin-drop flourish (goal top-up) ---- */
  .coin-flourish {
    position: fixed; width: 16px; height: 16px; border-radius: 50%; background: var(--brass);
    z-index: 60; pointer-events: none;
    animation: coinFlourish .6s cubic-bezier(.4,0,.6,1) both;
  }
  @keyframes coinFlourish {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--fx,0px), var(--fy,40px)) scale(.4); }
  }

  /* ---- Launch splash ---- */
  #splash {
    position: fixed; inset: 0; z-index: 100; background: var(--brass);
    display: flex; align-items: center; justify-content: center; opacity: 1;
  }
  #splash svg { width: 40vw; max-width: 160px; height: auto; overflow: visible; }
  #splash-coin { transform-box: fill-box; transform-origin: center; animation: splashCoinDrop 900ms cubic-bezier(.34,1.56,.64,1) 150ms both; }
  @keyframes splashCoinDrop {
    0% { transform: translateY(-170px) scale(.6); opacity: 0; }
    55% { transform: translateY(0) scale(1); opacity: 1; }
    72% { transform: translateY(-12px) scale(1); }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 200 200">
    <path d="M46 76h108l-9 96a18 18 0 0 1-18 16H73a18 18 0 0 1-18-16L46 76z" fill="var(--paper)"/>
    <path d="M70 76V56a30 30 0 0 1 60 0v20" fill="none" stroke="var(--paper)" stroke-width="14" stroke-linecap="round"/>
    <circle id="splash-coin" cx="100" cy="122" r="16" fill="var(--brass-soft)"/>
  </svg>
</div>
<div id="app">

  <header class="topbar">
    <div class="topbar-row">
      <div class="wordmark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 8.5h12l-.9 11.2a2 2 0 0 1-2 1.8H8.9a2 2 0 0 1-2-1.8L6 8.5z" fill="var(--brass-soft)" stroke="var(--brass)" stroke-width="1.6"/><path d="M8.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5" stroke="var(--brass)" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="13.5" r="1.6" fill="var(--brass)"/></svg>
        Jarful
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        </button>
        <button class="icon-btn" id="open-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.5a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H4.5a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H10a1.7 1.7 0 0 0 1-1.55V4.5a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.55 1h.09a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>

    <!-- DASHBOARD -->
    <section class="view active" id="view-dashboard">
      <div class="balance-card">
        <span class="coin-dot" style="width:16px;height:16px;background:var(--green-soft);top:18px;left:60%;"></span>
        <span class="coin-dot" style="width:10px;height:10px;background:var(--brass);top:52px;left:72%;"></span>
        <span class="coin-dot" style="width:22px;height:22px;background:var(--rust-soft);bottom:34px;left:10px;"></span>
        <div class="balance-label">Current balance</div>
        <div class="balance-amount num" id="balance-amount">—</div>
        <div class="balance-empty-note" id="balance-empty-note" style="display:none;">
          Add your starting balance to begin forecasting. <button id="balance-empty-cta">Add it now</button>
        </div>
      </div>

      <div id="forecast-block">
        <div class="horizon-tabs" id="horizon-tabs">
          <div class="horizon-pill" id="horizon-pill"></div>
          <button data-horizon="30" class="active">30 days</button>
          <button data-horizon="60">60 days</button>
          <button data-horizon="90">90 days</button>
        </div>
        <canvas id="forecast-canvas" height="200"></canvas>
        <div class="forecast-summary" id="forecast-summary"></div>
        <div id="warning-banner"></div>
      </div>

      <div class="section-title">Next 14 days</div>
      <div id="upcoming-list"></div>
    </section>

    <!-- PLAN (income & bills) -->
    <section class="view" id="view-plan">
      <div class="section-title">Income<button class="link-btn" id="add-income">+ Add income</button></div>
      <div id="income-list"></div>

      <div class="section-title">Bills<button class="link-btn" id="add-bill">+ Add bill</button></div>
      <div id="bills-list"></div>
    </section>

    <!-- BUDGETS -->
    <section class="view" id="view-budgets">
      <div class="section-title">This month's spending<button class="link-btn" id="add-category">+ Add category</button></div>
      <div id="budgets-list"></div>
    </section>

    <!-- GOALS -->
    <section class="view" id="view-goals">
      <div class="section-title">Savings goals<button class="link-btn" id="add-goal">+ Add goal</button></div>

<script>
(function(){
  "use strict";

  /* ---------- Date helpers ---------- */
  function pad(n){ return String(n).padStart(2,'0'); }
  function toISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseISODate(s){
    if(!s) return startOfDay(new Date());
    var parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function addDays(date, n){ var d = new Date(date); d.setDate(d.getDate()+n); return d; }
  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function daysInMonth(year, monthIndex){ return new Date(year, monthIndex+1, 0).getDate(); }
  function formatShortDate(d){ return d.toLocaleDateString('en-AU', {day:'numeric', month:'short'}); }
  function formatFullDate(d){ return d.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'}); }
  function formatCurrency(v){
    if(v === null || v === undefined || isNaN(v)) v = 0;
    return new Intl.NumberFormat('en-AU', {style:'currency', currency:'AUD'}).format(v);
  }
  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  /* ---------- Recurrence engine ---------- */
  // Returns an array of Date objects for all occurrences of a recurring
  // item between rangeStart and rangeEnd (inclusive), based at anchorDate.
  function getOccurrences(anchorDate, frequency, intervalDays, rangeStart, rangeEnd){
    var results = [];
    if(frequency === 'monthly'){
      var day = anchorDate.getDate();
      var cursor = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
      cursor.setMonth(cursor.getMonth() - 1); // check one month back too, in case of month-length spillover
      var endCursor = new Date(rangeEnd.getFullYear(), rangeEnd.getMonth(), 1);
      var guard = 0;
      while(cursor <= endCursor && guard < 2000){
        guard++;
        var afterAnchor = (cursor.getFullYear() > anchorDate.getFullYear()) ||
          (cursor.getFullYear() === anchorDate.getFullYear() && cursor.getMonth() >= anchorDate.getMonth());
        if(afterAnchor){
          var dim = daysInMonth(cursor.getFullYear(), cursor.getMonth());
          var occDate = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(day, dim));
          if(occDate >= rangeStart && occDate <= rangeEnd) results.push(occDate);
        }
        cursor.setMonth(cursor.getMonth()+1);
      }
    } else {
      var step = frequency === 'weekly' ? 7 : frequency === 'fortnightly' ? 14 : Math.max(1, parseInt(intervalDays,10) || 1);
      var diffDays = Math.floor((startOfDay(rangeStart) - startOfDay(anchorDate)) / 86400000);
      var stepsToAdd = Math.floor(diffDays / step);
      if(stepsToAdd < 0) stepsToAdd = 0;
      var occ = addDays(anchorDate, stepsToAdd * step);
      var guard2 = 0;
      while(occ < rangeStart && guard2 < 5000){ occ = addDays(occ, step); guard2++; }
      guard2 = 0;
      while(occ <= rangeEnd && guard2 < 5000){
        if(occ >= rangeStart) results.push(new Date(occ));
        occ = addDays(occ, step);
        guard2++;
      }
    }
    return results;
  }
  function nextOccurrence(anchorDateStr, frequency, intervalDays){
    var today = startOfDay(new Date());
    var occ = getOccurrences(parseISODate(anchorDateStr), frequency, intervalDays, today, addDays(today, 370));
    return occ.length ? occ[0] : null;
  }

  /* ---------- State ---------- */
  var STORAGE_KEY = 'ledgerAppData_v1';

  function defaultState(){
    var today = new Date();
    return {
      settings: { startingBalance: null, darkMode: false },
      incomes: [
        { id: uid(), name: 'Jacob — salary', amount: 0, frequency: 'monthly', anchorDate: toISODate(new Date(today.getFullYear(), today.getMonth(), 25)) },
        { id: uid(), name: 'Partner — salary', amount: 0, frequency: 'fortnightly', anchorDate: toISODate(today) }
      ],
      bills: [],
      categories: [
        { id: uid(), name: 'Groceries', budget: 0 },
        { id: uid(), name: 'Transport', budget: 0 },
        { id: uid(), name: 'Utilities', budget: 0 },
        { id: uid(), name: 'Subscriptions', budget: 0 },
        { id: uid(), name: 'Dining & takeaway', budget: 0 },
        { id: uid(), name: 'Household', budget: 0 },
        { id: uid(), name: 'Personal', budget: 0 },
        { id: uid(), name: 'Miscellaneous', budget: 0 }
      ],
      goals: [],
      transactions: []
    };
  }

  var state;
  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    } catch(e){ console.error('Failed to load saved data', e); }
    return defaultState();
  }
  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Failed to save data', e); alert('Could not save your data — your browser storage may be full or blocked in this mode.'); }
  }
  state = loadState();
  // Guard against older/partial saves missing a field
  state.settings = state.settings || { startingBalance: null, darkMode: false };
  state.incomes = state.incomes || [];
  state.bills = state.bills || [];
  state.categories = state.categories || [];
  state.goals = state.goals || [];
  state.transactions = state.transactions || [];

  /* ---------- Theme ---------- */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', state.settings.darkMode ? 'dark' : 'light');
  }
  applyTheme();

  /* ---------- CSV backup ---------- */
  var CSV_HEADER = ['RecordType','ID','Name','Amount','Frequency','IntervalDays','AnchorDate','Category','TargetAmount','TargetDate','CurrentSaved','Date','Notes'];
  function csvValue(v){
    if(v === null || v === undefined) return '';
    var s = String(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function row(obj){
    return CSV_HEADER.map(function(h){ return obj[h] !== undefined ? obj[h] : ''; });
  }
  function exportCSV(){
    var rows = [CSV_HEADER];
    rows.push(row({RecordType:'SETTING', Name:'StartingBalance', Amount: state.settings.startingBalance === null ? '' : state.settings.startingBalance}));
    rows.push(row({RecordType:'SETTING', Name:'DarkMode', Amount: state.settings.darkMode ? 1 : 0}));
    state.incomes.forEach(function(i){ rows.push(row({RecordType:'INCOME', ID:i.id, Name:i.name, Amount:i.amount, Frequency:i.frequency, AnchorDate:i.anchorDate})); });
    state.bills.forEach(function(b){ rows.push(row({RecordType:'BILL', ID:b.id, Name:b.name, Amount:b.amount, Frequency:b.frequency, IntervalDays:b.intervalDays||'', AnchorDate:b.anchorDate, Category:b.category||'', Notes:(b.paidDates||[]).join('|')})); });
    state.categories.forEach(function(c){ rows.push(row({RecordType:'CATEGORY', ID:c.id, Name:c.name, Amount:c.budget})); });
    state.goals.forEach(function(g){ rows.push(row({RecordType:'GOAL', ID:g.id, Name:g.name, TargetAmount:g.targetAmount, TargetDate:g.targetDate, CurrentSaved:g.currentSaved})); });
    state.transactions.forEach(function(t){ rows.push(row({RecordType:'TRANSACTION', ID:t.id, Name:t.name, Amount:t.amount, Category:t.category||'', Date:t.date})); });
    var csv = rows.map(function(r){ return r.map(csvValue).join(','); }).join('\r\n');
    var blob = new Blob([csv], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ledger-backup-' + toISODate(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function parseCSV(text){
    var rows = [], row = [], field = '', inQuotes = false;
    for(var i=0; i<text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\r'){ /* skip */ }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length > 1 || r[0] !== ''; });
  }
  function objFromRow(header, arr){
    var o = {};
    header.forEach(function(h, i){ o[h] = arr[i] !== undefined ? arr[i] : ''; });
    return o;
  }
  function importCSVText(text){
    var rows = parseCSV(text);
    if(!rows.length) throw new Error('That file looks empty.');
    var header = rows[0];
    var dataRows = rows.slice(1);
    var next = defaultState();
    next.incomes = []; next.bills = []; next.categories = []; next.goals = []; next.transactions = [];
    dataRows.forEach(function(r){
      var o = objFromRow(header, r);
      switch(o.RecordType){
        case 'SETTING':
          if(o.Name === 'StartingBalance') next.settings.startingBalance = o.Amount === '' ? null : parseFloat(o.Amount);
          if(o.Name === 'DarkMode') next.settings.darkMode = o.Amount === '1';
          break;
        case 'INCOME':
          next.incomes.push({ id:o.ID||uid(), name:o.Name, amount:parseFloat(o.Amount)||0, frequency:o.Frequency||'monthly', anchorDate:o.AnchorDate });
          break;
        case 'BILL':
          next.bills.push({ id:o.ID||uid(), name:o.Name, amount:parseFloat(o.Amount)||0, frequency:o.Frequency||'monthly', intervalDays:o.IntervalDays?parseInt(o.IntervalDays,10):null, anchorDate:o.AnchorDate, category:o.Category||'', paidDates:o.Notes?o.Notes.split('|').filter(Boolean):[] });
          break;
        case 'CATEGORY':
          next.categories.push({ id:o.ID||uid(), name:o.Name, budget:parseFloat(o.Amount)||0 });
          break;
        case 'GOAL':
          next.goals.push({ id:o.ID||uid(), name:o.Name, targetAmount:parseFloat(o.TargetAmount)||0, targetDate:o.TargetDate, currentSaved:parseFloat(o.CurrentSaved)||0 });
          break;
        case 'TRANSACTION':
          next.transactions.push({ id:o.ID||uid(), name:o.Name, amount:parseFloat(o.Amount)||0, category:o.Category||'', date:o.Date });
          break;
      }
    });
    state = next;
    saveState();
    applyTheme();
    expandedBillGroups = {};
    renderAll();
  }

  /* ---------- Forecast ---------- */
  function collectForecastEvents(days){
    var today = startOfDay(new Date());
    var rangeEnd = addDays(today, days);
    var events = [];
    state.incomes.forEach(function(inc){
      getOccurrences(parseISODate(inc.anchorDate), inc.frequency, null, today, rangeEnd).forEach(function(d){
        events.push({date:d, amount: Number(inc.amount)||0, label:inc.name, type:'income'});
      });
    });
    state.bills.forEach(function(b){
      getOccurrences(parseISODate(b.anchorDate), b.frequency, b.intervalDays, today, rangeEnd).forEach(function(d){
        events.push({date:d, amount: -Math.abs(Number(b.amount)||0), label:b.name, type:'bill', category:b.category});
      });
    });
    state.transactions.forEach(function(t){
      var d = parseISODate(t.date);
      if(d >= today && d <= rangeEnd) events.push({date:d, amount:Number(t.amount)||0, label:t.name, type:'transaction'});
    });
    events.sort(function(a,b){ return a.date - b.date; });
    return events;
  }

  function buildForecast(days){
    var today = startOfDay(new Date());
    var events = collectForecastEvents(days);
    var balance = Number(state.settings.startingBalance) || 0;
    var points = [{date:today, balance:balance}];
    events.forEach(function(e){
      balance += e.amount;
      points.push({date:e.date, balance:balance, event:e});
    });
    return {events:events, points:points, endBalance:balance};
  }

  // Resamples the forecast onto `count` evenly-spaced points across the
  // full horizon (by elapsed time, not by event index) so the chart can be
  // smoothly morphed between two different horizons.
  function computeSamples(days, count){
    var today = startOfDay(new Date());
    var events = collectForecastEvents(days);
    var startBal = Number(state.settings.startingBalance) || 0;
    var samples = [];
    for(var i=0;i<count;i++){
      var t = i/(count-1);
      var targetDate = addDays(today, Math.round(t*days));
      var bal = startBal;
      for(var j=0;j<events.length;j++){
        if(events[j].date <= targetDate) bal += events[j].amount; else break;
      }
      samples.push({t:t, balance:bal});
    }
    return samples;
  }

  function getUpcomingEvents(days){
    var today = startOfDay(new Date());
    var end = addDays(today, days);
    var events = [];
    state.incomes.forEach(function(inc){
      getOccurrences(parseISODate(inc.anchorDate), inc.frequency, null, today, end).forEach(function(d){
        events.push({date:d, label:inc.name, amount:Number(inc.amount)||0, type:'income'});
      });
    });
    state.bills.forEach(function(b){
      getOccurrences(parseISODate(b.anchorDate), b.frequency, b.intervalDays, today, end).forEach(function(d){
        events.push({date:d, label:b.name, amount:-Math.abs(Number(b.amount)||0), type:'bill', category:b.category});
      });
    });
    state.transactions.forEach(function(t){
      var d = parseISODate(t.date);
      if(d >= today && d <= end) events.push({date:d, label:t.name, amount:Number(t.amount)||0, type:'transaction'});
    });
    events.sort(function(a,b){ return a.date - b.date; });
    return events;
  }

  function categorySpend(categoryName){
    var now = new Date(), y = now.getFullYear(), m = now.getMonth();
    return state.transactions.filter(function(t){
      var d = parseISODate(t.date);
      return t.category === categoryName && d.getFullYear() === y && d.getMonth() === m && Number(t.amount) < 0;
    }).reduce(function(sum, t){ return sum + Math.abs(Number(t.amount)); }, 0);
  }

  function goalContribution(goal){
    var remaining = Math.max(0, Number(goal.targetAmount) - (Number(goal.currentSaved)||0));
    var today = startOfDay(new Date());
    var target = parseISODate(goal.targetDate);
    var daysLeft = Math.max(1, Math.round((target - today) / 86400000));
    var perFortnight = remaining / Math.max(1, daysLeft/14);
    var perMonth = remaining / Math.max(1, daysLeft/30.44);
    return {remaining:remaining, daysLeft:daysLeft, perFortnight:perFortnight, perMonth:perMonth};
  }

  /* ---------- Chart ---------- */
  var SAMPLE_COUNT = 48;
  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  // Draws from an array of {t, balance} samples (t in 0..1 across the shown
  // horizon) plus the calendar dates that t=0 and t=1 correspond to, so the
  // same drawing routine works for a static render and for each frame of an
  // in-flight morph between two horizons.
  function drawForecastChart(samples, startDate, endDate){
    var canvas = document.getElementById('forecast-canvas');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var cssWidth = canvas.clientWidth || 300;
    var cssHeight = 200;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    canvas.style.height = cssHeight + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    ctx.clearRect(0,0,cssWidth,cssHeight);

    var padL = 54, padR = 10, padT = 14, padB = 22;
    var values = samples.map(function(p){ return p.balance; });
    var minV = Math.min.apply(null, values.concat([0]));
    var maxV = Math.max.apply(null, values.concat([minV+1]));
    if(maxV === minV) maxV = minV + 1;

    function xFor(t){ return padL + t * (cssWidth-padL-padR); }
    function yFor(v){ return cssHeight - padB - ((v-minV)/(maxV-minV)) * (cssHeight-padT-padB); }

    // zero line
    ctx.strokeStyle = cssVar('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, yFor(0));
    ctx.lineTo(cssWidth-padR, yFor(0));
    ctx.stroke();

    // area fill
    ctx.beginPath();
    ctx.moveTo(xFor(samples[0].t), yFor(samples[0].balance));
    samples.forEach(function(p){ ctx.lineTo(xFor(p.t), yFor(p.balance)); });
    ctx.lineTo(xFor(samples[samples.length-1].t), yFor(minV));
    ctx.lineTo(xFor(samples[0].t), yFor(minV));
    ctx.closePath();
    ctx.fillStyle = cssVar('--brass-soft');
    ctx.globalAlpha = 0.35;
    ctx.fill();
    ctx.globalAlpha = 1;

    // line
    ctx.strokeStyle = cssVar('--brass');
    ctx.lineWidth = 2;
    ctx.beginPath();
    samples.forEach(function(p,i){
      var x = xFor(p.t), y = yFor(p.balance);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // labels
    ctx.fillStyle = cssVar('--ink-soft');
    ctx.font = '11px "Public Sans", sans-serif';
    ctx.fillText(formatCurrency(maxV), 2, yFor(maxV)+4);
    ctx.fillText(formatCurrency(minV), 2, yFor(minV)+4);
    ctx.fillText(formatShortDate(startDate), padL, cssHeight-6);
    var lastLabel = formatShortDate(endDate);
    ctx.fillText(lastLabel, cssWidth-padR-ctx.measureText(lastLabel).width, cssHeight-6);
  }

  // Animates the chart from its current horizon to a new one by blending
  // the two sample sets frame-by-frame, rather than snapping instantly.
  var forecastAnimFrame = null;
  function animateForecastTo(newHorizon){
    if(newHorizon === currentHorizon) return;
    var today = startOfDay(new Date());
    var oldHorizon = currentHorizon;
    var oldSamples = computeSamples(oldHorizon, SAMPLE_COUNT);
    var newSamples = computeSamples(newHorizon, SAMPLE_COUNT);
    if(forecastAnimFrame) cancelAnimationFrame(forecastAnimFrame);
    var duration = 420;
    var start = null;
    function step(ts){
      if(start === null) start = ts;
      var p = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - p, 3);
      var blended = [];
      for(var i=0;i<SAMPLE_COUNT;i++){
        blended.push({ t: i/(SAMPLE_COUNT-1), balance: oldSamples[i].balance + (newSamples[i].balance - oldSamples[i].balance) * eased });
      }
      var blendedDays = oldHorizon + (newHorizon - oldHorizon) * eased;
      drawForecastChart(blended, today, addDays(today, Math.round(blendedDays)));
      if(p < 1){
        forecastAnimFrame = requestAnimationFrame(step);
      } else {
        forecastAnimFrame = null;
        currentHorizon = newHorizon;
        renderDashboard();
      }
    }
    forecastAnimFrame = requestAnimationFrame(step);
  }

  /* ---------- Rendering ---------- */
  var currentHorizon = 30;

  function iconEdit(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5.5 16.5 4 20z"/></svg>'; }

  function escapeHTML(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });

  /* ---------- Small animation helpers ---------- */
  // Plays a one-off entrance animation on an element, restarting cleanly
  // even if the same animation is already mid-flight, and always cleaning
  // up the inline style afterward so nothing is left with a lingering
  // transform (which would otherwise create a stray containing block).
  function playEntrance(el, animName, durationMs){
    if(!el) return;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = animName + ' ' + durationMs + 'ms cubic-bezier(.22,.61,.36,1) both';
    var cleanup = function(){ el.style.animation = ''; el.removeEventListener('animationend', cleanup); };
    el.addEventListener('animationend', cleanup);
    setTimeout(cleanup, durationMs + 80);
  }

  // Collapses a row (measuring its real height first so max-height has a
  // concrete number to transition from) then runs `callback` once the
  // collapse finishes, so state is only mutated after the row is gone.
  function playRowExit(el, callback){
    if(!el){ callback(); return; }
    var rect = el.getBoundingClientRect();
    el.style.maxHeight = rect.height + 'px';
    void el.offsetWidth;
    el.classList.add('row-exiting');
    el.style.maxHeight = '0px';
    var done = false;
    function finish(){ if(done) return; done = true; el.removeEventListener('transitionend', finish); callback(); }
    el.addEventListener('transitionend', finish);
    setTimeout(finish, 420);
  }

  // Tracks the id of a row that was just added, so the next render of its
  // list can play an entrance animation on that one row only.
  var pendingEnterId = null;
  function applyPendingEnter(){
    if(!pendingEnterId) return;
    var id = pendingEnterId; pendingEnterId = null;
    var el = document.querySelector('[data-id="' + id + '"]');
    if(el) playEntrance(el, 'rowFadeSlideIn', 340);
  }

  // Progress bars render at width:0 so this can animate them up to their
  // real value, rather than appearing already full.
  function animateProgressBars(containerEl){
    var bars = containerEl.querySelectorAll('.progress-fill[data-target]');
    bars.forEach(function(bar){
      var target = bar.getAttribute('data-target');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ bar.style.width = target + '%'; });
      });
    });
  }

  function spawnCoinFlourish(buttonEl){
    if(!buttonEl) return;
    var rect = buttonEl.getBoundingClientRect();
    var coin = document.createElement('div');
    coin.className = 'coin-flourish';
    coin.style.left = (rect.left + rect.width/2 - 8) + 'px';
    coin.style.top = (rect.top + rect.height/2 - 8) + 'px';
    coin.style.setProperty('--fx', '-6px');
    coin.style.setProperty('--fy', '44px');
    document.body.appendChild(coin);
    var removed = false;
    function remove(){ if(removed) return; removed = true; if(coin.parentNode) coin.parentNode.removeChild(coin); }
    coin.addEventListener('animationend', remove);
    setTimeout(remove, 800);
  }

  function pulseBar(rowId){
    var bar = document.querySelector('[data-id="' + rowId + '"] .progress-fill');
    if(!bar) return;
    bar.classList.add('bar-pulse');
    var cleanup = function(){ bar.classList.remove('bar-pulse'); bar.removeEventListener('animationend', cleanup); };
    bar.addEventListener('animationend', cleanup);
    setTimeout(cleanup, 700);
  }

  /* ---------- Tab navigation ---------- */
  var views = ['dashboard','plan','add','budgets','goals'];

  function updateTabPill(){
    var pill = document.getElementById('tab-pill');
    var active = document.querySelector('.tab-btn.active');
    if(!pill || !active) return;
    pill.style.width = active.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  }

  function showView(name){
    var newIndex = views.indexOf(name);
    var direction = newIndex > currentViewIndex ? 1 : (newIndex < currentViewIndex ? -1 : 0);
    views.forEach(function(v){
      document.getElementById('view-' + v).classList.toggle('active', v === name);
    });
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-view') === name);
    });
    document.getElementById('view-settings').classList.remove('active');
    updateTabPill();
    if(!firstShow && newIndex !== -1){
      var el = document.getElementById('view-' + name);
      playEntrance(el, direction >= 0 ? 'viewSlideInRight' : 'viewSlideInLeft', 260);
    }
    firstShow = false;
    if(newIndex !== -1) currentViewIndex = newIndex;
    if(name === 'dashboard') renderDashboard();
    if(name === 'add'){ populateQuickAddCategories(); renderRecent(); }
  }
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ showView(btn.getAttribute('data-view')); });
  });
  document.getElementById('open-settings').addEventListener('click', function(){
    views.forEach(function(v){ document.getElementById('view-' + v).classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });

  /* ---------- Modal helpers ---------- */
  var overlay = document.getElementById('overlay');
  var modalEl = document.getElementById('modal');
  var modalTitle = document.getElementById('modal-title');
  var modalBody = document.getElementById('modal-body');
  var lastModalTrigger = null;

  // Positions the modal so it visually "grows" out of whichever button
  // opened it, rather than sliding up as an unrelated sheet.
  function modalOpenTransform(triggerEl){
    if(!triggerEl) return null;
    var t = triggerEl.getBoundingClientRect();
    var m = modalEl.getBoundingClientRect();
    var tx = (t.left + t.width/2) - (m.left + m.width/2);
    var ty = (t.top + t.height/2) - (m.top + m.height*0.85);
    return 'translate(' + tx + 'px,' + ty + 'px) scale(0.15)';
  }

  function openModal(title, html, triggerEl){
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    overlay.classList.remove('hidden');
    lastModalTrigger = triggerEl || null;
    modalEl.style.transition = 'none';
    modalEl.style.opacity = '0';
    var fromTransform = modalOpenTransform(triggerEl);
    modalEl.style.transform = fromTransform || 'translateY(24px) scale(0.96)';
    void modalEl.offsetWidth;
    modalEl.style.transition = '';
    modalEl.style.transform = 'translate(0,0) scale(1)';
    modalEl.style.opacity = '1';
  }
  function closeModal(){
    var toTransform = modalOpenTransform(lastModalTrigger);
    modalEl.style.transform = toTransform || 'translateY(24px) scale(0.96)';
    modalEl.style.opacity = '0';
    var done = false;
    function finish(){
      if(done) return; done = true;
      modalEl.removeEventListener('transitionend', finish);
      overlay.classList.add('hidden');
      modalBody.innerHTML = '';
      modalEl.style.transform = '';
      modalEl.style.opacity = '';
    }
    modalEl.addEventListener('transitionend', finish);
    setTimeout(finish, 420);
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });

      }
      expandedBillGroups[data.category || '__none__'] = true;
      saveState(); closeModal(); renderPlan(); renderDashboard(); renderBudgets();
    });
    if(isEdit){
      document.getElementById('bill-delete').addEventListener('click', function(){
        if(confirm('Delete this bill?')){
          state.bills = state.bills.filter(function(b){ return b.id !== existing.id; });
          saveState(); closeModal(); renderPlan(); renderDashboard();
        }
      });
    }
  }
  document.getElementById('add-bill').addEventListener('click', function(e){ openBillForm(null, e.currentTarget); });

  /* ---------- Category form ---------- */
  function openCategoryForm(existing, triggerEl){
    var isEdit = !!existing;
    var html =
      '<form id="category-form">' +
      '<div class="field"><label for="cat-name">Name</label><input type="text" id="cat-name" required value="' + (existing?escapeHTML(existing.name):'') + '"></div>' +
      '<div class="field"><label for="cat-budget">Monthly budget</label><input type="number" id="cat-budget" inputmode="decimal" step="0.01" min="0" value="' + (existing?existing.budget:'') + '"></div>' +
      '<button type="submit" class="btn btn-primary btn-block">' + (isEdit?'Save changes':'Add category') + '</button>' +
      (isEdit?'<button type="button" class="btn btn-danger btn-block" style="margin-top:10px;" id="category-delete">Delete</button>':'') +
      '</form>';
    openModal(isEdit?'Edit category':'Add category', html, triggerEl);
    document.getElementById('category-form').addEventListener('submit', function(e){
      e.preventDefault();
      var data = {
        id: existing ? existing.id : uid(),
        name: document.getElementById('cat-name').value.trim() || 'Category',
        budget: parseFloat(document.getElementById('cat-budget').value) || 0
      };
      if(existing){
        var idx = state.categories.findIndex(function(c){ return c.id === existing.id; });
        state.categories[idx] = data;
      } else {
        state.categories.push(data);
        pendingEnterId = data.id;
      }
      saveState(); closeModal(); renderBudgets(); populateQuickAddCategories();
    });
    if(isEdit){
      document.getElementById('category-delete').addEventListener('click', function(){
        if(confirm('Delete this category? Existing transactions will keep their category name.')){
          state.categories = state.categories.filter(function(c){ return c.id !== existing.id; });
          saveState(); closeModal(); renderBudgets(); populateQuickAddCategories();
        }
      });
    }
  }
  document.getElementById('add-category').addEventListener('click', function(e){ openCategoryForm(null, e.currentTarget); });

  /* ---------- Goal form ---------- */
  function openGoalForm(existing, triggerEl){
    var isEdit = !!existing;
    var html =
      '<form id="goal-form">' +
      '<div class="field"><label for="goal-name">Name</label><input type="text" id="goal-name" required value="' + (existing?escapeHTML(existing.name):'') + '"></div>' +
      '<div class="field-row">' +
      '<div class="field"><label for="goal-target">Target amount</label><input type="number" id="goal-target" inputmode="decimal" step="0.01" min="0" required value="' + (existing?existing.targetAmount:'') + '"></div>' +
      '<div class="field"><label for="goal-date">Target date</label><input type="date" id="goal-date" required value="' + (existing?existing.targetDate:'') + '"></div>' +
      '</div>' +
      '<div class="field"><label for="goal-saved">Already saved</label><input type="number" id="goal-saved" inputmode="decimal" step="0.01" min="0" value="' + (existing?(existing.currentSaved||0):0) + '"></div>' +
      '<button type="submit" class="btn btn-primary btn-block">' + (isEdit?'Save changes':'Add goal') + '</button>' +
      (isEdit?'<button type="button" class="btn btn-danger btn-block" style="margin-top:10px;" id="goal-delete">Delete</button>':'') +
      '</form>';
    openModal(isEdit?'Edit goal':'Add goal', html, triggerEl);
    document.getElementById('goal-form').addEventListener('submit', function(e){
      e.preventDefault();
      var data = {
        id: existing ? existing.id : uid(),
        name: document.getElementById('goal-name').value.trim() || 'Goal',
        targetAmount: parseFloat(document.getElementById('goal-target').value) || 0,
        targetDate: document.getElementById('goal-date').value,
        currentSaved: parseFloat(document.getElementById('goal-saved').value) || 0
      };
      if(existing){
        var idx = state.goals.findIndex(function(g){ return g.id === existing.id; });
        state.goals[idx] = data;
      } else {
        state.goals.push(data);
        pendingEnterId = data.id;
      }
      saveState(); closeModal(); renderGoals();
    });
    if(isEdit){
      document.getElementById('goal-delete').addEventListener('click', function(){
        if(confirm('Delete this savings goal?')){
          state.goals = state.goals.filter(function(g){ return g.id !== existing.id; });
          saveState(); closeModal(); renderGoals();
        }
      });
    }
  }
  document.getElementById('add-goal').addEventListener('click', function(e){ openGoalForm(null, e.currentTarget); });

  /* ---------- Bill category groups ---------- */
  function toggleBillGroup(buttonEl, key){
    var body = buttonEl.nextElementSibling;
    var chevron = buttonEl.querySelector('.bill-group-chevron');
    var isOpen = !!expandedBillGroups[key];
    if(!isOpen){
      expandedBillGroups[key] = true;
      body.classList.add('open');
      body.style.maxHeight = body.scrollHeight + 'px';
      var done1 = false;
      function openFinish(){ if(done1) return; done1 = true; body.style.maxHeight = 'none'; body.removeEventListener('transitionend', openFinish); }
      body.addEventListener('transitionend', openFinish);
      setTimeout(openFinish, 400);
    } else {
      expandedBillGroups[key] = false;
      body.style.maxHeight = body.scrollHeight + 'px';
      void body.offsetWidth;
      body.style.maxHeight = '0px';
      body.classList.remove('open');
    }
    if(chevron) chevron.classList.toggle('open', !isOpen);
    buttonEl.setAttribute('aria-expanded', String(!isOpen));
  }

  /* ---------- List action delegation (edit/delete/save-to-goal) ---------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('button');
    if(!t) return;
    var groupKey = t.getAttribute('data-toggle-group');
    if(groupKey !== null){ toggleBillGroup(t, groupKey); return; }
    var id;
    if((id = t.getAttribute('data-edit-income'))) openIncomeForm(state.incomes.find(function(i){return i.id===id;}), t);
    else if((id = t.getAttribute('data-del-income'))){
      if(confirm('Delete this income source?')){
        playRowExit(t.closest('.row'), function(){
          state.incomes = state.incomes.filter(function(i){return i.id!==id;}); saveState(); renderPlan(); renderDashboard();
        });
      }
    }
    else if((id = t.getAttribute('data-edit-bill'))) openBillForm(state.bills.find(function(b){return b.id===id;}), t);
    else if((id = t.getAttribute('data-del-bill'))){
      if(confirm('Delete this bill?')){
        playRowExit(t.closest('.row'), function(){
          state.bills = state.bills.filter(function(b){return b.id!==id;}); saveState(); renderPlan(); renderDashboard();
        });
      }
    }
    else if((id = t.getAttribute('data-edit-category'))) openCategoryForm(state.categories.find(function(c){return c.id===id;}), t);
    else if((id = t.getAttribute('data-del-category'))){
      if(confirm('Delete this category?')){
        playRowExit(t.closest('.row'), function(){
          state.categories = state.categories.filter(function(c){return c.id!==id;}); saveState(); renderBudgets(); populateQuickAddCategories();
        });
      }
    }
    else if((id = t.getAttribute('data-edit-goal'))) openGoalForm(state.goals.find(function(g){return g.id===id;}), t);
    else if((id = t.getAttribute('data-del-goal'))){
      if(confirm('Delete this savings goal?')){
        playRowExit(t.closest('.row'), function(){
          state.goals = state.goals.filter(function(g){return g.id!==id;}); saveState(); renderGoals();
        });
      }
    }
    else if((id = t.getAttribute('data-save-goal'))){
      var g = state.goals.find(function(g){return g.id===id;});
      var amt = prompt('Add how much to "' + g.name + '"?');
      if(amt !== null){
        var n = parseFloat(amt);
        if(!isNaN(n)){
          spawnCoinFlourish(t);
          g.currentSaved = (g.currentSaved||0) + n;
          saveState();
          renderGoals();
          pulseBar(id);
        }
      }
    }
    else if((id = t.getAttribute('data-del-transaction'))){
      if(confirm('Delete this entry?')){
        playRowExit(t.closest('.row'), function(){
          state.transactions = state.transactions.filter(function(x){return x.id!==id;}); saveState(); renderRecent(); renderBudgets(); renderDashboard();
        });
      }
    }
  });

  /* ---------- Horizon tabs ---------- */
  function updateHorizonPill(){
    var pill = document.getElementById('horizon-pill');
    var active = document.querySelector('.horizon-tabs button.active');
    if(!pill || !active) return;
    pill.style.width = active.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + (active.offsetLeft - 4) + 'px)';
  }
  document.querySelectorAll('.horizon-tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.horizon-tabs button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      updateHorizonPill();
      animateForecastTo(parseInt(btn.getAttribute('data-horizon'), 10));
    });
  });

  /* ---------- Quick add ---------- */
  var quickAddType = 'expense';
  function updateSegmentPill(){
    var pill = document.getElementById('segment-pill');
    var active = document.querySelector('#quickadd-type button.active');
    if(!pill || !active) return;
    pill.style.width = active.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + (active.offsetLeft - 4) + 'px)';
  }
  document.querySelectorAll('#quickadd-type button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#quickadd-type button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      updateSegmentPill();
      quickAddType = btn.getAttribute('data-type');
      document.getElementById('qa-category-field').style.display = quickAddType === 'expense' ? 'block' : 'none';
    });
  });
  document.getElementById('qa-date').value = toISODate(new Date());
  document.getElementById('quickadd-form').addEventListener('submit', function(e){
    e.preventDefault();
    var amountRaw = parseFloat(document.getElementById('qa-amount').value) || 0;
    var amount = quickAddType === 'expense' ? -Math.abs(amountRaw) : Math.abs(amountRaw);
    var t = {
      id: uid(),
      name: document.getElementById('qa-name').value.trim() || (quickAddType==='expense'?'Expense':'Income'),
      amount: amount,
      category: quickAddType === 'expense' ? document.getElementById('qa-category').value : '',
      date: document.getElementById('qa-date').value || toISODate(new Date())
    };
    state.transactions.push(t);
    pendingEnterId = t.id;
    saveState();
    document.getElementById('quickadd-form').reset();
    document.getElementById('qa-date').value = toISODate(new Date());
    document.querySelectorAll('#quickadd-type button').forEach(function(b){ b.classList.remove('active'); });
    document.querySelector('#quickadd-type button[data-type="expense"]').classList.add('active');
    updateSegmentPill();
    quickAddType = 'expense';
    document.getElementById('qa-category-field').style.display = 'block';
    renderRecent(); renderBudgets(); renderDashboard();
  });


  /* ---------- Settings ---------- */
  document.getElementById('balance-empty-cta').addEventListener('click', function(){
    document.getElementById('open-settings').click();
    document.getElementById('settings-balance').focus();
  });
  document.getElementById('save-balance').addEventListener('click', function(){
    var v = document.getElementById('settings-balance').value;
    state.settings.startingBalance = v === '' ? null : parseFloat(v);
    saveState();
    renderDashboard();
    alert('Balance saved.');
  });
  document.getElementById('settings-dark-toggle').addEventListener('change', function(){
    state.settings.darkMode = this.checked;
    saveState();
    applyTheme();
    renderDashboard();
  });
  document.getElementById('theme-toggle').addEventListener('click', function(){
    state.settings.darkMode = !state.settings.darkMode;
    saveState();
    applyTheme();
    document.getElementById('settings-dark-toggle').checked = state.settings.darkMode;
    renderDashboard();
  });
  document.getElementById('export-btn').addEventListener('click', exportCSV);
  document.getElementById('import-btn').addEventListener('click', function(){
    document.getElementById('import-input').click();
  });
  document.getElementById('import-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(!confirm('Importing will replace all current data on this device. Continue?')) { this.value=''; return; }
    var reader = new FileReader();
    reader.onload = function(){
      try {
        importCSVText(reader.result);
        alert('Backup imported.');
      } catch(err){
        alert('Could not import that file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('reset-btn').addEventListener('click', function(){
    if(confirm('This will erase all data on this device permanently. Export a backup first if you want to keep it. Continue?')){
      if(confirm('Are you absolutely sure? This cannot be undone.')){
        state = defaultState();
        saveState();
        applyTheme();
        renderAll();
        showView('dashboard');
        alert('All data has been erased.');
      }
    }
  });

  /* ---------- Init ---------- */
  function runSplash(){
    var splash = document.getElementById('splash');
    if(!splash) return;
    setTimeout(function(){
      splash.style.transition = 'opacity .35s ease';
      splash.style.opacity = '0';
      var done = false;
      function finish(){ if(done) return; done = true; splash.style.display = 'none'; splash.removeEventListener('transitionend', finish); }
      splash.addEventListener('transitionend', finish);
      setTimeout(finish, 450);
    }, 1150);
  }
  window.addEventListener('resize', function(){
    if(document.getElementById('view-dashboard').classList.contains('active')) renderDashboard();
    updateTabPill();
    updateHorizonPill();
    updateSegmentPill();
  });
  renderAll();
  updateTabPill();
  updateHorizonPill();
  updateSegmentPill();
  runSplash();

})();
</script>
</body>
</html>
