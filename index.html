<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Send Log"/>
<title>Send Log — Training Tracker</title>
<style>
  html,body{margin:0;padding:0;background:#F5F2ED;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  * { box-sizing: border-box; -webkit-user-select:none; user-select:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  #root{min-height:100vh;}
  #boot-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#F5F2ED;font-family:-apple-system,sans-serif;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideInLeft{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideOutLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-60px)}}
  @keyframes slideOutRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}
  @keyframes expandSet{from{opacity:0;max-height:0;margin-top:0;padding:0}to{opacity:1;max-height:60px;margin-top:6px}}
  @keyframes checkDraw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
  @keyframes circleDraw{from{stroke-dashoffset:190}to{stroke-dashoffset:0}}
  @keyframes bounceIn{0%{opacity:0;transform:scale(0.3)}50%{opacity:1;transform:scale(1.08)}70%{transform:scale(0.95)}100%{transform:scale(1)}}
  @keyframes chalkFloat{0%{opacity:0.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(0.3)}}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(212,102,58,0)}50%{box-shadow:0 0 0 6px rgba(212,102,58,0.15)}}
  @keyframes flagWave{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes carabinerClip{0%{transform:rotate(0deg)}25%{transform:rotate(15deg)}50%{transform:rotate(0deg)}75%{transform:rotate(-10deg)}100%{transform:rotate(0deg)}}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>

// A sector tracks completion by grade only if EVERY current climb has one entered;
// otherwise it falls back to tracking completion by color, since a mix can't be grouped cleanly by grade.
function sectorUsesGradeMode(problems) {
  if (!problems || problems.length === 0) return false;
  return problems.every(p => p.grade && p.grade.trim() !== "");
}

// Sorts grade strings the way a climber would expect (V1, V2, ... V10), falling back to plain
// alphabetical for anything that doesn't match the usual "V" + number pattern.
function sortGrades(grades) {
  return [...grades].sort((a, b) => {
    const na = a.match(/^V?(\d+)/i),
      nb = b.match(/^V?(\d+)/i);
    if (na && nb) return Number(na[1]) - Number(nb[1]);
    return a.localeCompare(b);
  });
}

// Returns the ordered list of group keys (grade strings, or color names) that a sector's
// completion badges and "Mark Complete" controls should operate on.
function sectorGroupKeys(problems, gradeMode) {
  if (gradeMode) {
    return sortGrades([...new Set(problems.map(p => p.grade.trim()))]);
  }
  const present = new Set(problems.map(p => p.color));
  return HOLD_COLORS.map(c => c.name).filter(name => present.has(name));
}

// ─── Analytics helpers ────────────────────────────────
// Everything here is a pure function over a flat list of logged climbs, so it works the same
// whether a climb is still active or sitting in an old archived reset — nothing here mutates or
// depends on component state.

// Flattens every climb ever logged (current + every archived reset, across every sector) into
// one plain array, each carrying its own logged date — the full history to analyze.
function allLoggedProblems(data) {
  const all = [];
  Object.entries(data.sectorLogs || {}).forEach(([sectorName, log]) => {
    (log.currentProblems || []).forEach(p => all.push({
      ...p,
      sector: sectorName
    }));
    (log.archivedResets || []).forEach(reset => {
      (reset.problems || []).forEach(p => all.push({
        ...p,
        sector: sectorName
      }));
    });
  });
  return all;
}
