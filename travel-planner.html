<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waypoint">
<meta name="theme-color" content="#F2994A">
<link rel="apple-touch-icon" href="icons/waypoint/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/waypoint/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/waypoint/apple-touch-icon-167.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/waypoint/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/waypoint/favicon-16.png">
<title>Waypoint — Trip Planner</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF3EF;
    --panel:#FFFDF8;
    --ink:#1E3A3A;
    --body:#3E5252;
    --muted:#7C948E;
    --line:#DCEAE4;
    --sun:#F2994A;
    --sun-bg:#FDF0E1;
    --coral:#E8735C;
    --meal:#C9862F;
    --meal-bg:#FBF1E3;
    --activity:#2E8B57;
    --activity-bg:#E7F5EC;
    --travel:#5A55C9;
    --travel-bg:#ECEBFA;
    --flight:#2F6FCC;
    --flight-bg:#E8EFFC;
    --accom:#8B3FA0;
    --accom-bg:#F3E9F7;
    --mode-driving:#5A55C9;
    --mode-driving-bg:#ECEBFA;
    --mode-walking:#7C8A1E;
    --mode-walking-bg:#F4F5DE;
    --mode-transit:#1B8A8A;
    --mode-transit-bg:#E1F4F4;
    --mode-bicycling:#C23B82;
    --mode-bicycling-bg:#FBE8F1;
    --danger:#D9583F;
    --danger-bg:#FCE9E4;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--body);
    font-family:'Nunito Sans',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
    min-height:100vh;
  }
  .num{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;}
  header.app-header{
    background:linear-gradient(135deg, var(--sun) 0%, var(--coral) 100%);
    color:#fff;
    padding:20px 20px 22px;
    position:sticky;top:0;z-index:20;
    border-radius:0 0 26px 26px;
    overflow:hidden;
  }
  header.app-header::before{
    content:'';
    position:absolute;top:-10px;right:-30px;width:140px;height:140px;
    border:2px dashed rgba(255,255,255,.35);border-radius:50%;
    pointer-events:none;
  }
  header.app-header .back-row, header.app-header .title, header.app-header .sub{position:relative;z-index:1;}
  header.app-header .title{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:800;font-size:20px;letter-spacing:.2px;}
  header.app-header .sub{font-size:13px;color:rgba(255,255,255,.88);margin-top:2px;}
  .back-row{display:flex;align-items:center;gap:10px;}
  .back-btn{background:none;border:none;color:#fff;font-size:15px;padding:0;cursor:pointer;font-family:inherit;}

  main{padding:16px;max-width:640px;margin:0 auto;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .trip-card{
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(30,58,58,.08);border-color:transparent;
  }
  .trip-card .name{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;font-size:17px;color:var(--ink);}
  .trip-card .dates{font-size:13px;color:var(--muted);margin-top:3px;}
  .trip-card .chev{color:var(--coral);font-size:20px;}

  .empty{
    text-align:center;padding:48px 20px;color:var(--muted);
  }
  .empty .big{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;color:var(--ink);font-size:17px;margin-bottom:6px;}

  .fab{
    position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(135deg, var(--sun), var(--coral));color:#fff;border:none;border-radius:50%;
    width:56px;height:56px;font-size:26px;line-height:56px;text-align:center;
    box-shadow:0 6px 18px rgba(232,115,92,.45);cursor:pointer;z-index:15;
    transition:transform .22s ease, opacity .22s ease;
  }
  .fab.fab-hidden{ transform:scale(.3); opacity:0; pointer-events:none; }

  nav.tabbar{
    position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:20px;
    display:flex;padding:7px;gap:2px;
    box-shadow:0 8px 22px rgba(30,58,58,.14);
    z-index:20;
  }
  .tab-pill{
    position:absolute;top:7px;bottom:7px;left:0;width:0;
    background:var(--sun-bg);border-radius:14px;z-index:0;
  }
  nav.tabbar button{
    position:relative;z-index:1;
    flex:1;background:none;border:none;font-family:'Nunito Sans',-apple-system,sans-serif;font-size:11.5px;
    color:var(--muted);padding:8px 2px;cursor:pointer;font-weight:600;border-radius:14px;
  }
  nav.tabbar button.active{color:var(--coral);}

  .timetable-sticky-bar{
    position:sticky; top:var(--header-h, 100px); z-index:15;
    background:var(--bg); padding-top:2px; margin-top:-2px;
  }
  .daychips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;-webkit-overflow-scrolling:touch;position:relative;}
  .day-pill{
    position:absolute;top:2px;left:0;width:0;height:36px;
    background:linear-gradient(135deg, var(--sun), var(--coral));border-radius:20px;z-index:0;
  }
  .daychip{
    position:relative;z-index:1;
    flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:7px 14px;font-size:13px;color:var(--body);cursor:pointer;white-space:nowrap;
  }
  .daychip.active{color:#fff;border-color:transparent;background:none;}

  .cal-toggle{display:flex;gap:6px;margin-bottom:14px;position:relative;}
  .toggle-pill{
    position:absolute;top:0;left:0;width:0;height:100%;
    background:linear-gradient(135deg, var(--sun), var(--coral));border-radius:12px;z-index:0;
  }
  .cal-toggle button{
    position:relative;z-index:1;
    flex:1;background:none;border:1px solid var(--line);border-radius:12px;
    padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;
  }
  .cal-toggle button.active{color:#fff;border-color:transparent;}

  .cal-wrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:24px;overflow:hidden;}
  .cal-gutter-line{position:absolute;top:0;bottom:0;width:1px;background:var(--line);}
  .cal-hour-row{position:absolute;left:0;right:0;border-top:1px solid var(--line);}
  .cal-hour-row:first-child{border-top:none;}
  .cal-hour-label{
    position:absolute;top:-7px;left:6px;width:38px;font-size:10.5px;color:var(--muted);
    background:var(--panel);padding-right:2px;font-family:'Nunito Sans',-apple-system,sans-serif;
  }
  .cal-event{
    position:absolute;border-radius:6px;padding:4px 7px;overflow:hidden;box-sizing:border-box;
    border-left:3px solid; cursor:pointer;
  }
  .cal-event.meal{background:var(--meal-bg);border-color:var(--meal);}
  .cal-event.activity{background:var(--activity-bg);border-color:var(--activity);}
  .cal-event.travel{background:var(--travel-bg);border-color:var(--travel);}
  .cal-event.travel.mode-driving{background:var(--mode-driving-bg);border-color:var(--mode-driving);}
  .cal-event.travel.mode-walking{background:var(--mode-walking-bg);border-color:var(--mode-walking);}
  .cal-event.travel.mode-transit{background:var(--mode-transit-bg);border-color:var(--mode-transit);}
  .cal-event.travel.mode-bicycling{background:var(--mode-bicycling-bg);border-color:var(--mode-bicycling);}
  .cal-event.flight{background:var(--flight-bg);border-color:var(--flight);}
  .cal-event.stay{background:var(--accom-bg);border-color:var(--accom);cursor:default;}
  .cal-event-time{font-size:10px;font-weight:700;color:var(--ink);line-height:1.2;font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;}
  .cal-event-name{font-size:11.5px;color:var(--body);line-height:1.25;font-weight:500;}

  .item{
    display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:10px;
  }
  .item .time{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;font-size:14px;color:var(--ink);min-width:52px;padding-top:1px;}
  .item .bar{width:3px;border-radius:2px;flex:0 0 3px;}
  .item.meal .bar{background:var(--meal);} .item.activity .bar{background:var(--activity);}
  .item.travel .bar{background:var(--travel);} .item.stay .bar{background:var(--accom);}
  .item.flight .bar{background:var(--flight);}
  .item.travel.mode-driving .bar{background:var(--mode-driving);}
  .item.travel.mode-walking .bar{background:var(--mode-walking);}
  .item.travel.mode-transit .bar{background:var(--mode-transit);}
  .item.travel.mode-bicycling .bar{background:var(--mode-bicycling);}
  .item .body{flex:1;min-width:0;}
  .item .kicker{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1px;
    padding:2px 9px;border-radius:999px;margin-bottom:3px;
  }
  .item.meal .kicker{color:var(--meal);background:var(--meal-bg);}
  .item.activity .kicker{color:var(--activity);background:var(--activity-bg);}
  .item.travel .kicker{color:var(--travel);background:var(--travel-bg);}
  .item.stay .kicker{color:var(--accom);background:var(--accom-bg);}
  .item.flight .kicker{color:var(--flight);background:var(--flight-bg);}
  .item.travel.mode-driving .kicker{color:var(--mode-driving);background:var(--mode-driving-bg);}
  .item.travel.mode-walking .kicker{color:var(--mode-walking);background:var(--mode-walking-bg);}
  .item.travel.mode-transit .kicker{color:var(--mode-transit);background:var(--mode-transit-bg);}
  .item.travel.mode-bicycling .kicker{color:var(--mode-bicycling);background:var(--mode-bicycling-bg);}
  .item .iname{font-weight:700;color:var(--ink);font-size:15px;margin-top:2px;}
  .item .iloc{font-size:13px;color:var(--muted);margin-top:2px;}
  .item .inotes{font-size:13px;color:var(--body);margin-top:4px;}
  .item .actions{display:flex;gap:10px;margin-top:8px;}
  .item .actions a, .item .actions button{
    font-size:12.5px;color:var(--travel);background:none;border:none;padding:0;
    cursor:pointer;font-family:inherit;text-decoration:none;font-weight:700;
  }
  .item .actions .del{color:var(--danger);}

  .section-title{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;color:var(--ink);font-size:15px;margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}

  .pack-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .pack-row:last-child{border-bottom:none;}
  .pack-row input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;accent-color:var(--activity);}
  .pack-row .pname{flex:1;min-width:0;font-size:15px;}
  .pack-row.done .pname{text-decoration:line-through;color:var(--muted);}
  .pack-row .edit{background:none;border:none;color:var(--travel);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:4px 2px;}
  .pack-row .del{background:none;border:none;color:var(--danger);font-size:13px;cursor:pointer;padding:4px 2px;}

  /* ---- Packing categories: collapsible groups ---- */
  .pack-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 12px;}
  .pack-toolbar .pack-summary{font-size:13px;color:var(--muted);font-weight:600;}
  .pack-toolbar .tool-btns{display:flex;gap:14px;}
  .text-btn{background:none;border:none;padding:4px 0;font-family:inherit;font-size:13px;font-weight:700;color:var(--coral);cursor:pointer;}
  .pack-cat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .pack-cat-head{display:flex;align-items:center;}
  .pack-cat-toggle{
    flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;
    background:none;border:none;padding:13px 6px 13px 16px;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .pack-cat-toggle .chev{
    flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--sun-bg);color:var(--coral);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
    transition:transform .2s ease;
  }
  .pack-cat.collapsed .pack-cat-toggle .chev{transform:rotate(-90deg);}
  .pack-cat-name{flex:1;min-width:0;font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pack-cat-count{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 9px;}
  .pack-cat-count.complete{color:var(--activity);background:var(--activity-bg);}
  .pack-cat-edit{flex:0 0 auto;background:none;border:none;padding:13px 16px 13px 8px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--travel);cursor:pointer;}
  .pack-cat-body{padding:0 16px 6px;border-top:1px solid var(--line);}
  .pack-cat.collapsed .pack-cat-body{display:none;}
  .pack-cat-empty{font-size:13px;color:var(--muted);padding:12px 0 6px;}
  .pack-add-in{
    display:block;width:100%;text-align:left;background:none;border:none;border-top:1px dashed var(--line);
    padding:11px 0 8px;margin-top:2px;font-family:inherit;font-size:13px;font-weight:700;color:var(--coral);cursor:pointer;
  }
  .pack-cat-body .pack-row:last-of-type{border-bottom:none;}
  .pack-end-spacer{height:72px;}
  .btn:disabled{opacity:.45;cursor:default;}

  /* ---- Google Drive backup (same behaviour as Jarful and Send Log) ---- */
  .backup-reminder{display:flex;align-items:center;gap:10px;margin:0 2px 12px;font-size:12.5px;font-weight:700;color:var(--coral);}
  .backup-reminder[hidden]{display:none;}
  .backup-reminder span{flex:1;}
  .backup-reminder.ok{color:var(--activity);}
  .backup-reminder.bad{color:var(--danger);}
  .backup-reminder button{
    flex-shrink:0;border:none;border-radius:20px;padding:6px 14px;font:inherit;font-size:12px;font-weight:800;
    background:var(--sun-bg);color:var(--ink);cursor:pointer;
  }
  .drive-panel .drive-status{font-weight:700;color:var(--ink);font-size:14.5px;}
  .drive-panel .waiting{color:var(--coral);}
  .drive-panel .drive-note{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45;}
  .drive-panel .drive-btns{display:flex;gap:8px;margin-top:12px;}
  .drive-panel .drive-btns .btn{flex:1;margin-top:0;}
  .drive-msg{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700;}
  .drive-msg[hidden]{display:none;}
  .drive-msg.ok{background:var(--activity-bg);color:var(--activity);}
  .drive-msg.bad{background:var(--danger-bg);color:var(--danger);}
  .drive-list{margin-top:10px;}
  .drive-list[hidden]{display:none;}
  .drive-file{padding:10px 2px;border-top:1px dashed var(--line);}
  .drive-file:first-child{border-top:none;}
  .drive-file-row{display:flex;align-items:center;gap:10px;}
  .drive-file-row span{flex:1;font-size:13px;font-weight:700;color:var(--ink);}
  .drive-file-row small{color:var(--muted);font-weight:600;}
  .drive-file .btn{width:auto;margin-top:0;padding:7px 12px;font-size:12.5px;}
  .drive-confirm{margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:600;}
  .drive-confirm .drive-btns{margin-top:8px;}
  .sheet .btn.danger-outline{background:#fff;color:var(--danger);border:1px solid var(--line);box-shadow:none;margin-top:10px;}
  .sheet .field-note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4;}

  .row{display:flex;gap:8px;}
  .row > *{flex:1;}

  form label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px;}
  form label:first-child{margin-top:0;}
  input[type=text], input[type=date], input[type=time], input[type=url], textarea, select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:12px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--body);
  }
  textarea{resize:vertical;min-height:56px;}
  .btn{
    display:inline-block;background:linear-gradient(135deg, var(--sun), var(--coral));color:#fff;border:none;border-radius:14px;
    padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    width:100%;margin-top:16px;box-shadow:0 4px 14px rgba(232,115,92,.3);
  }
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.danger{background:var(--danger);box-shadow:none;}
  .type-pick{display:flex;gap:8px;margin-bottom:4px;}
  .type-pick button{
    flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;
  }
  .type-pick button.sel{color:#fff;border-color:transparent;}
  .type-pick button.sel[data-type=meal]{background:var(--meal);}
  .type-pick button.sel[data-type=activity]{background:var(--activity);}
  .type-pick button.sel[data-type=travel]{background:var(--travel);}
  .type-pick button.sel[data-type=flight]{background:var(--flight);}

  .traveller-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .traveller-row .trav-name{flex:1.3;}
  .traveller-row .trav-seat{flex:1;}
  .traveller-row .trav-remove{
    flex:0 0 auto;background:none;border:none;color:var(--danger);font-size:15px;
    cursor:pointer;padding:6px 4px;font-family:inherit;
  }

  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(30,58,58,.45);z-index:30;
    display:flex;align-items:flex-end;
    animation:backdropIn .22s ease both;
  }
  .sheet-backdrop.closing{ animation:backdropOut .22s ease both; }
  @keyframes backdropIn{from{opacity:0;}to{opacity:1;}}
  @keyframes backdropOut{from{opacity:1;}to{opacity:0;}}
  .sheet{
    background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;
    border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));
    transform-origin:calc(100% - 40px) 100%;
    animation:sheetPop .32s cubic-bezier(.24,.86,.34,1.12) both;
  }
  .sheet.closing{ animation:sheetUnpop .2s ease both; }
  @keyframes sheetPop{from{transform:scale(.15);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes sheetUnpop{from{transform:scale(1);opacity:1;}to{transform:scale(.15);opacity:0;}}
  .sheet h3{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;color:var(--ink);margin:0 0 4px;font-size:19px;}
  .sheet .close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;}
  .sheet-wrap{position:relative;}

  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.4;}
  .filerow{display:flex;gap:8px;}
  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;
    z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  /* ---- App-open splash: pin drops with a bounce, then fades to reveal the app ----
     opacity:1 is explicit and no transition is wired up here at all — that's
     added via JS only at the exact moment we hide the splash, so there is no
     window at load where it could be caught mid-transition and read as a
     fade-in (it must be instantly, fully opaque from first paint). */
  #splash{
    position:fixed;inset:0;z-index:9999;
    background:linear-gradient(135deg, var(--sun), var(--coral));
    display:flex;align-items:center;justify-content:center;
    opacity:1;
  }
  #splash.splash-hide{opacity:0;pointer-events:none;}
  .splash-pin{ animation: pinDrop 900ms cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pinDrop{
    0%{ transform:translateY(-170px) scale(.7); opacity:0; }
    55%{ transform:translateY(10px) scale(1.08); opacity:1; }
    75%{ transform:translateY(-6px) scale(.96); }
    100%{ transform:translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .splash-pin{ animation:none; }
  }

  /* ---- Content / navigation transitions ---- */
  @keyframes contentFadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  @keyframes slideInFromRight{ from{opacity:0;transform:translateX(26px);} to{opacity:1;transform:translateX(0);} }
  @keyframes slideInFromLeft{ from{opacity:0;transform:translateX(-26px);} to{opacity:1;transform:translateX(0);} }
  @keyframes navSlideInForward{ from{opacity:0;transform:translateX(38px);} to{opacity:1;transform:translateX(0);} }
  @keyframes navSlideInBack{ from{opacity:0;transform:translateX(-38px);} to{opacity:1;transform:translateX(0);} }
  @keyframes itemEnter{ from{opacity:0;transform:translateY(10px) scale(.97);} to{opacity:1;transform:translateY(0) scale(1);} }
  @keyframes itemExit{
    from{opacity:1;transform:scale(1);max-height:240px;}
    to{opacity:0;transform:scale(.92);max-height:0;margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0;}
  }
  .item-exit{ overflow:hidden;animation:itemExit 240ms ease forwards; }
  @keyframes packPop{ 0%{transform:scale(1);} 45%{transform:scale(1.035);} 100%{transform:scale(1);} }
  .pack-row.just-toggled{ animation:packPop 260ms ease; }
  @media (prefers-reduced-motion: reduce){
    main, .item, .card, .pack-row{ animation:none !important; }
    .sheet, .sheet-backdrop, .fab{ animation:none !important; transition:none !important; }
    .pack-cat-toggle .chev{ transition:none; }
  }

  /* ---- Drag to reorder (timetable list) ---- */
  .tt-list{position:relative;}
  .item[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .item.press{transition:transform .38s ease, box-shadow .38s ease;transform:scale(.985);}
  .item.drag-source{background:transparent;border:2px dashed #BFD6CD;box-shadow:none;}
  .item.drag-source > *{visibility:hidden;}
  .drag-ghost{
    position:fixed;z-index:60;margin:0 !important;pointer-events:none;will-change:transform;
    box-shadow:0 16px 34px rgba(30,58,58,.22), 0 3px 8px rgba(30,58,58,.12);
    animation:dragLift .16s ease-out both;
  }
  .drag-ghost > *{transform:scale(1.02);transform-origin:center;}
  .drag-ghost.dropping{transition:transform .18s cubic-bezier(.22,.61,.36,1), box-shadow .18s ease;box-shadow:0 2px 6px rgba(30,58,58,.08);}
  @keyframes dragLift{from{box-shadow:0 0 0 rgba(30,58,58,0);}to{box-shadow:0 16px 34px rgba(30,58,58,.22), 0 3px 8px rgba(30,58,58,.12);}}
  body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing;}
  @keyframes itemSettle{0%{transform:scale(1.025);}60%{transform:scale(.995);}100%{transform:scale(1);}}
  .item .time{align-self:flex-start;}
  .item.retimed .time{animation:timeFlash 1.2s ease;border-radius:6px;}
  @keyframes timeFlash{0%,35%{background:var(--sun-bg);color:var(--sun);box-shadow:0 0 0 5px var(--sun-bg);}100%{background:transparent;box-shadow:0 0 0 5px transparent;}}
  .drag-hint{margin:0 2px 10px;}
  .undo-toast{
    position:fixed;top:14px;left:50%;transform:translate(-50%,-8px);
    display:flex;align-items:center;gap:14px;
    background:var(--ink);color:#fff;padding:9px 10px 9px 16px;border-radius:12px;font-size:13.5px;
    z-index:51;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    box-shadow:0 8px 22px rgba(30,58,58,.25);white-space:nowrap;
  }
  .undo-toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
  .undo-toast button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;}
  @media (prefers-reduced-motion: reduce){
    .item.press{transition:none;transform:none;}
    .drag-ghost{animation:none;}
    .item.retimed .time{animation:none;}
    .undo-toast{transition:none;}
  }

  /* ---- Budget ---- */
  .bud-cat-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .bud-cat-titles .pack-cat-name{flex:none;}
  .bud-cat-sub{font-size:12px;color:var(--muted);font-weight:600;}
  .bud-cat-total{flex:0 0 auto;font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;font-size:15.5px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .bud-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .pack-cat-body .bud-row:last-of-type{border-bottom:none;}
  .bud-name{flex:1;min-width:0;background:none;border:none;padding:4px 0;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;}
  .bud-label{display:block;font-size:15px;line-height:1.3;}
  .bud-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .bud-diff{font-weight:700;}
  .bud-diff.over{color:var(--danger);}
  .bud-diff.under, .bud-diff.even{color:var(--activity);}
  .bud-amt{flex:0 0 auto;display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 8px;cursor:text;}
  .bud-amt span{color:var(--muted);font-weight:700;font-size:15px;}
  .bud-amt input{width:84px;border:none;background:transparent;padding:8px 0;margin:0;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;outline:none;box-shadow:none;}
  .bud-amt:focus-within{border-color:var(--sun);background:var(--panel);box-shadow:0 0 0 3px var(--sun-bg);}
  .bud-amt input.invalid{color:var(--danger);}
  .bud-fill{margin:-4px 2px 12px;font-size:13px;}
  .bud-fill-note{color:var(--muted);}
  .pack-toolbar .text-btn{white-space:nowrap;}
  .bud-amt input::placeholder{color:#A9BDB6;font-weight:600;}
  .bud-total-card{
    background:linear-gradient(135deg, var(--sun), var(--coral));color:#fff;border-radius:var(--radius);
    padding:16px 18px;margin-top:4px;box-shadow:0 8px 20px rgba(232,115,92,.28);
  }
  .bud-total-label{font-size:13px;font-weight:700;opacity:.92;}
  .bud-total-amt{font-family:'Baloo 2',ui-rounded,-apple-system,sans-serif;font-weight:700;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums;}
  .bud-total-note{font-size:13px;margin-top:4px;opacity:.95;}
  .bud-total-card .bud-diff{background:rgba(255,255,255,.92);border-radius:999px;padding:1px 8px;}
</style>
</head>
<body>

<div id="splash" aria-hidden="true">
  <svg class="splash-pin" viewBox="0 0 200 200" width="120" height="120">
    <circle cx="100" cy="80" r="46" fill="#FFFDF8"/>
    <path d="M 64 92 L 100 164 L 136 92 Z" fill="#FFFDF8"/>
    <circle cx="100" cy="160" r="4.3" fill="#FFFDF8"/>
    <circle cx="100" cy="80" r="18.5" fill="#E8735C"/>
  </svg>
</div>
<div id="app"></div>
<div id="sheetHost"></div>
<div class="toast" id="toast"></div>
<div class="undo-toast" id="undoToast" role="status"><span></span><button type="button">Undo</button></div>

<script>
/* ---------- storage ---------- */
const STORE_KEY = 'waypointData';
function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {trips:[]}; }
  catch(e){ return {trips:[]}; }
}
function save(data){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
  if(window.__driveReady) scheduleAutoBackup();
}
let DATA = load();
let STATE = { view:'home', tripId:null, tab:'timetable', day:null, calView:false };

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function getTrip(id){ return DATA.trips.find(t=>t.id===id); }

/* ---------- packing categories ----------
   Each trip keeps an ordered list of packing categories ({id, name}); each
   packing item points at one through p.cat ('' means no category, shown as
   "Other"). Items saved before categories existed have no p.cat at all. They
   are migrated once: a name written as "Category: item" (the style of the
   CSV-built Tasmania list) is split into that category plus the item name.
   The prefix must start with a letter and be followed by ": " so names such
   as "Taxi at 4:05am" are never split. */
const PACK_PREFIX_RE = /^([A-Za-z][A-Za-z &'\/-]{0,23}):\s+(\S.*)$/;
function findPackCatByName(t, name){
  const n = (name||'').trim().toLowerCase();
  return (t.packingCategories||[]).find(c => c.name.trim().toLowerCase() === n);
}
/* Returns the id of the category with this name, creating it if needed. */
function ensurePackCat(t, name){
  name = (name||'').trim();
  if(!name) return '';
  if(!Array.isArray(t.packingCategories)) t.packingCategories = [];
  const found = findPackCatByName(t, name);
  if(found) return found.id;
  const c = { id:uid(), name };
  t.packingCategories.push(c);
  return c.id;
}
/* Brings a trip's packing data up to the current shape. Returns true if
   anything changed, so the caller knows to save. */
function ensurePackingModel(t){
  let changed = false;
  if(!Array.isArray(t.packingCategories)){ t.packingCategories = []; changed = true; }
  if(!Array.isArray(t.packing)){ t.packing = []; changed = true; }
  t.packing.forEach(p => {
    if(p.cat === undefined){
      const m = (p.name||'').match(PACK_PREFIX_RE);
      if(m){ p.cat = ensurePackCat(t, m[1]); p.name = m[2].trim(); }
      else p.cat = '';
      changed = true;
    } else if(p.cat && !t.packingCategories.some(c => c.id === p.cat)){
      p.cat = ''; changed = true; // category no longer exists
    }
  });
  return changed;
}
(function migratePacking(){
  let changed = false;
  DATA.trips.forEach(t => { if(ensurePackingModel(t)) changed = true; });
  if(changed) save(DATA);
})();

/* Which category groups are collapsed: a per-device convenience, so it lives
   in its own localStorage key (never in the trip data or CSV) and every read
   or write is guarded in case storage is unavailable. */
const PACK_COLLAPSE_KEY = 'waypointPackCollapsed';
let PACK_COLLAPSED = (function(){
  try{ return JSON.parse(localStorage.getItem(PACK_COLLAPSE_KEY)) || {}; }
  catch(e){ return {}; }
})();
function savePackCollapsed(){
  try{ localStorage.setItem(PACK_COLLAPSE_KEY, JSON.stringify(PACK_COLLAPSED)); }catch(e){}
}
function isPackCollapsed(tripId, key){ return !!PACK_COLLAPSED[tripId+'|'+key]; }
function setPackCollapsed(tripId, key, collapsed){
  const k = tripId+'|'+key;
  if(collapsed) PACK_COLLAPSED[k] = true; else delete PACK_COLLAPSED[k];
  savePackCollapsed();
}

/* ---------- date helpers ---------- */
function fmtDate(d){ // d = 'YYYY-MM-DD'
  const [y,m,day] = d.split('-').map(Number);
  const dt = new Date(y, m-1, day);
  return dt.toLocaleDateString('en-AU',{weekday:'short', day:'numeric', month:'short'});
}
function fmtRange(a,b){
  if(!a||!b) return '';
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}
function daysBetween(start,end){
  const days=[];
  let [y,m,d]=start.split('-').map(Number);
  let cur=new Date(y,m-1,d);
  const [ey,em,ed]=end.split('-').map(Number);
  const last=new Date(ey,em-1,ed);
  while(cur<=last){
    const yyyy=cur.getFullYear(), mm=String(cur.getMonth()+1).padStart(2,'0'), dd=String(cur.getDate()).padStart(2,'0');
    days.push(`${yyyy}-${mm}-${dd}`);
    cur.setDate(cur.getDate()+1);
  }
  return days;
}
function fmtTime(t){
  if(!t) return '';
  const parts = t.split(':');
  if(parts.length<2) return t;
  let h = parseInt(parts[0],10);
  const m = parts[1];
  if(isNaN(h)) return t;
  const period = h>=12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12===0) h12=12;
  return `${h12}:${m} ${period}`;
}
function timeToMinutes(t){
  if(!t) return null;
  const parts=t.split(':');
  const h=parseInt(parts[0],10), m=parseInt(parts[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
/* Best-effort parse of the free-text travel "duration" field (e.g. "40 min",
   "1h 30m", "1:30", "90") into minutes, for sizing the calendar-view block.
   Falls back to null (caller applies a default) if it can't be read. */
function parseDurationToMinutes(str){
  if(!str) return null;
  const s=str.toLowerCase().trim();
  let m=s.match(/^(\d+):(\d{2})$/);
  if(m) return parseInt(m[1],10)*60+parseInt(m[2],10);
  let hours=0, mins=0, found=false;
  const hm=s.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/);
  if(hm){ hours=parseFloat(hm[1]); found=true; }
  const mm=s.match(/(\d+)\s*(?:m|min|mins|minute|minutes)\b/);
  if(mm){ mins=parseInt(mm[1],10); found=true; }
  if(found) return Math.round(hours*60+mins);
  const plain=s.match(/^(\d+)$/);
  if(plain) return parseInt(plain[1],10);
  return null;
}
function timeSort(a,b){ return (a.time||'99:99').localeCompare(b.time||'99:99'); }

/* ---------- render root ---------- */
let _pillRects = {};       // FLIP bookkeeping for sliding pill backgrounds (cleared in place, never reassigned, so any stored reference stays valid)
let _justAddedId = null;   // id of the item most recently added, for its entrance animation
function resetPillRects(){ for(const k in _pillRects) delete _pillRects[k]; }

/* Animates a pill-shaped background sliding to sit behind whichever button
   currently has the given active-class, using the FLIP technique: capture
   where it used to be, snap the (possibly brand-new) pill element there
   instantly, then transition it to its real position. Works even though the
   whole container is torn down and rebuilt on every render(). */
function animatePill(containerSel, pillSel, activeSel, key){
  const container = document.querySelector(containerSel);
  if(!container) return;
  const pill = container.querySelector(pillSel);
  const active = container.querySelector(activeSel);
  if(!pill || !active) return;
  const left = active.offsetLeft, width = active.offsetWidth;
  const prev = _pillRects[key];
  if(prev){
    pill.style.transition = 'none';
    pill.style.transform = `translateX(${prev.left}px)`;
    pill.style.width = prev.width + 'px';
    void pill.offsetWidth; // force reflow so the "from" state is committed
    pill.style.transition = 'transform .28s cubic-bezier(.32,.72,.35,1.15), width .28s cubic-bezier(.32,.72,.35,1.15)';
  } else {
    pill.style.transition = 'none';
  }
  pill.style.transform = `translateX(${left}px)`;
  pill.style.width = width + 'px';
  _pillRects[key] = { left, width };
}
/* Plays a one-off entrance animation on an element (restarting cleanly even
   if the same animation is already mid-flight, e.g. rapid day taps), then
   clears the inline animation once it finishes. This matters beyond tidiness:
   our keyframes use fill-mode "both", so without cleanup the element would be
   left with a permanent (if inert) `transform` — and a `transform` on any
   element is enough to break `position:fixed` children elsewhere in the tree,
   since it creates a new containing block for them. Clearing it afterward
   guarantees that never lingers. */
function playEntrance(el, animName, durationMs){
  if(!el) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = `${animName} ${durationMs}ms cubic-bezier(.22,.61,.36,1) both`;
  const cleanup = () => { el.style.animation = ''; el.removeEventListener('animationend', cleanup); };
  el.addEventListener('animationend', cleanup);
  setTimeout(cleanup, durationMs + 80); // fallback in case animationend doesn't fire
}
/* Runs fn() only after playing an exit animation on the element matched by
   selector (so a delete reads as the row collapsing away, not vanishing).
   Falls back to running fn() immediately if the element isn't found, and to
   a timeout if animationend never fires. */
function animateThenRun(selector, fn){
  const el = document.querySelector(selector);
  if(!el){ fn(); return; }
  el.classList.add('item-exit');
  let done = false;
  const finish = () => { if(done) return; done = true; fn(); };
  el.addEventListener('animationend', finish, { once:true });
  setTimeout(finish, 260);
}

function render(){
  const app=document.getElementById('app');
  if(STATE.view==='home') app.innerHTML = renderHome();
  else app.innerHTML = renderTrip(getTrip(STATE.tripId));
  attachHomeHandlers();
  // keep the sticky day/view bar positioned right below the header, whatever
  // height the header happens to be (trip name length, back-row, etc.)
  const headerEl = document.querySelector('header.app-header');
  if(headerEl){ document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight+'px'); }
  // sliding pill backgrounds — only the containers that exist in this render do anything
  animatePill('nav.tabbar', '.tab-pill', 'button.active', 'tabbar');
  animatePill('.cal-toggle', '.toggle-pill', 'button.active', 'caltoggle');
  animatePill('.daychips', '.day-pill', '.daychip.active', 'daychip');
  // entrance animation for whichever item was just added, if it's on screen
  if(_justAddedId){
    const justAdded = document.querySelector(
      `[data-item-id="${_justAddedId}"], [data-stay-id="${_justAddedId}"], [data-pack-id="${_justAddedId}"], [data-budget-id="${_justAddedId}"]`
    );
    if(justAdded) playEntrance(justAdded, 'itemEnter', 260);
    _justAddedId = null;
  }
  if(window.__driveReady) renderBackupUI();
}

/* ---------- HOME ---------- */
function renderHome(){
  let body;
  if(DATA.trips.length===0){
    body = `<div class="empty"><div class="big">No trips yet</div>Tap + to plan your first one, or restore your trips from Drive or a CSV below.</div>`;
  } else {
    body = DATA.trips.slice().sort((a,b)=>a.startDate.localeCompare(b.startDate))
      .map(t=>`
        <div class="card trip-card" onclick="openTrip('${t.id}')">
          <div>
            <div class="name">${esc(t.name)}</div>
            <div class="dates">${fmtRange(t.startDate,t.endDate)}</div>
          </div>
          <div class="chev">›</div>
        </div>`).join('');
  }
  return `
    <div class="nav-page">
      <header class="app-header">
        <div class="title">Waypoint</div>
        <div class="sub">Your trips</div>
      </header>
      <main>
        ${reminderHtml()}
        ${body}
        <div class="section-title">Backup</div>
        ${drivePanelHtml()}
        <label class="btn secondary" style="display:block;text-align:center;cursor:pointer;margin-top:0;">
          Restore a trip from CSV
          <input type="file" accept=".csv" style="display:none" onchange="importNewTripFromFile(this)">
        </label>
        <div class="pack-end-spacer" aria-hidden="true"></div>
      </main>
    </div>
    <button class="fab" onclick="openSheet('addTrip')">+</button>
  `;
}

/* Extracts the "# trip:NAME start:YYYY-MM-DD end:YYYY-MM-DD" comment line
   written at the top of every export, if present. */
function parseTripMeta(text){
  const firstLine = (text.split(/\r?\n/)[0] || '');
  const m = firstLine.match(/^#\s*trip:(.*?)\s+start:(\d{4}-\d{2}-\d{2})\s+end:(\d{4}-\d{2}-\d{2})\s*$/);
  if(!m) return {};
  let name = m[1].trim();
  if(name.length > 1 && name[0] === '"' && name[name.length-1] === '"') name = name.slice(1,-1).replace(/""/g,'"');
  return { name, start:m[2], end:m[3] };
}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Expands (never shrinks) a trip's date range to cover every date actually
   referenced by its data — protects against a trip being too narrow to show
   all its own items. Only looks at real data dates, not the trip's current
   start/end, so a missing/placeholder date never poisons the calculation. */
function widenTripRangeToData(t){
  const dataDates=[];
  (t.accommodations||[]).forEach(a=>{ if(a.checkIn) dataDates.push(a.checkIn); if(a.checkOut) dataDates.push(a.checkOut); });
  (t.agenda||[]).forEach(a=>{
    if(a.date) dataDates.push(a.date);
    if(a.depDate) dataDates.push(a.depDate);
    if(a.arrDate) dataDates.push(a.arrDate);
  });
  if(!dataDates.length) return;
  dataDates.sort();
  const dataMin=dataDates[0], dataMax=dataDates[dataDates.length-1];
  if(!t.startDate || dataMin < t.startDate) t.startDate = dataMin;
  if(!t.endDate || dataMax > t.endDate) t.endDate = dataMax;
}
function importNewTripFromFile(inputEl){
  const f=inputEl.files[0];
  if(!f){ return; }
  const reader=new FileReader();
  reader.onerror=()=>toast('Could not read that file — please try again.');
  reader.onload = e=>{
    try{
      const trips = tripsFromCSVText(e.target.result);
      if(!trips.length) throw new Error('That file has no trips in it.');
      trips.forEach(t => DATA.trips.push(t));
      save(DATA);
      if(trips.length === 1){ toast('Trip imported'); openTrip(trips[0].id); }
      else { toast(trips.length + ' trips imported'); render(); }
    } catch(err){
      toast(err.message || 'Could not import that file.');
    }
  };
  reader.readAsText(f);
}

function openTrip(id){
  resetPillRects(); // fresh trip screen — pills should appear in place, not animate in from a stale position
  STATE.view='trip'; STATE.tripId=id; STATE.tab='timetable';
  const t=getTrip(id); STATE.day = t.startDate; render();
  playEntrance(document.querySelector('#app .nav-page'), 'navSlideInForward', 260);
}
function goHome(){
  resetPillRects();
  STATE.view='home'; render();
  playEntrance(document.querySelector('#app .nav-page'), 'navSlideInBack', 260);
}

/* ---------- TRIP VIEW ---------- */
function renderTrip(t){
  if(!t){ STATE.view='home'; return renderHome(); }
  let tabContent;
  if(STATE.tab==='timetable') tabContent = renderTimetable(t);
  else if(STATE.tab==='stay') tabContent = renderAccommodation(t);
  else if(STATE.tab==='pack') tabContent = renderPacking(t);
  else if(STATE.tab==='budget') tabContent = renderBudget(t);
  else if(STATE.tab==='data') tabContent = renderData(t);

  return `
    <div class="nav-page">
      <header class="app-header">
        <div class="back-row"><button class="back-btn" onclick="goHome()">‹ Trips</button></div>
        <div class="title" style="margin-top:6px;">${esc(t.name)}</div>

/* ---- Timetable ---- */
/* Gathers every row that belongs on a given day: normal agenda items, plus
   accommodation check-in/out and flight departure/arrival pseudo-rows. Shared
   by both the list view and the calendar view so they never drift apart. */
function getDayRows(t, day){
  let rows = (t.agenda||[]).filter(a=>a.date===day).map(a=>({...a}));
  (t.accommodations||[]).forEach(a=>{
    if(a.checkIn===day) rows.push({id:a.id+'-in',type:'stay',time:a.checkInTime||'15:00',name:a.name+' — check in',location:a.address,notes:a.notes,readonly:true,stayId:a.id});
    if(a.checkOut===day) rows.push({id:a.id+'-out',type:'stay',time:a.checkOutTime||'10:00',name:a.name+' — check out',location:a.address,notes:'',readonly:true,stayId:a.id});
  });
  (t.agenda||[]).filter(a=>a.type==='flight').forEach(f=>{
    const route = `${f.depAirport||'?'} → ${f.arrAirport||'?'}`;
    if(f.depDate===f.arrDate){
      // same-day flight: one card, not a separate "Departs"/"Arrives" pair
      if(f.depDate===day) rows.push({id:f.id,type:'flight',leg:'full',time:f.depTime,name:f.name||'Flight',location:route,notes:f.notes,_flight:f,_calEnd:f.arrTime});
    } else {
      if(f.depDate===day) rows.push({id:f.id,type:'flight',leg:'depart',time:f.depTime,name:f.name||'Flight',location:route,notes:f.notes,_flight:f});
      if(f.arrDate===day) rows.push({id:f.id,type:'flight',leg:'arrive',time:f.arrTime,name:f.name||'Flight',location:route,notes:f.notes,_flight:f});
    }
  });
  // Same start time: fixed bookings (check-in/out, flights) come first, then
  // agenda items in their saved order — which is what a drag-reorder sets, so
  // an item dropped right after a 10:00 check-out stays below it.
  rows.sort((a,b)=> timeSort(a,b) || (isAnchorRow(b)?1:0) - (isAnchorRow(a)?1:0));
  return rows;
}
/* Rows whose time comes from a booking and so can't be dragged or retimed. */
function isAnchorRow(r){ return !!(r.readonly || r.type==='flight'); }

function renderTimetable(t){
  const days = daysBetween(t.startDate,t.endDate);
  if(!STATE.day || !days.includes(STATE.day)) STATE.day = days[0];
  const chips = `<div class="day-pill"></div>` + days.map((d,i)=>`<div class="daychip ${d===STATE.day?'active':''}" onclick="setDay('${d}')">Day ${i+1} · ${fmtDate(d)}</div>`).join('');
  const toggle = `<div class="cal-toggle">
    <div class="toggle-pill"></div>
    <button class="${STATE.calView?'':'active'}" onclick="setCalView(false)">List</button>
    <button class="${STATE.calView?'active':''}" onclick="setCalView(true)">Calendar</button>
  </div>`;

  const rows = getDayRows(t, STATE.day);
  const movable = rows.filter(r=>!isAnchorRow(r)).length;
  const dragHint = (movable && rows.length > 1 && !dragHintSeen())
    ? `<div class="hint drag-hint">Tip: press and hold an item, then drag it to reorder. Times after it shift to fit.</div>` : '';
  const body = STATE.calView ? renderCalendarView(rows, t.id) :
    (rows.length ? `${dragHint}<div class="tt-list" data-trip-id="${t.id}" data-day="${STATE.day}">${rows.map(r=>renderItem(r,t.id,true)).join('')}</div>` :
      `<div class="empty" style="padding:32px 10px;">Nothing planned yet for this day.</div>`);

  return `<div class="timetable-sticky-bar"><div class="daychips">${chips}</div>${toggle}</div>${body}`;
}
/* Scrolls back to the top of the content whenever the person switches day or
   view, so they're never left scrolled halfway down looking at what's now a
   different day/view than they think they're on. */
function scrollTimetableToTop(){
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function setDay(d){
  const t = getTrip(STATE.tripId);
  const days = t ? daysBetween(t.startDate, t.endDate) : [];
  const oldIdx = days.indexOf(STATE.day), newIdx = days.indexOf(d);
  STATE.day=d; render(); scrollTimetableToTop();
  const main = document.querySelector('#app main');
  if(newIdx > oldIdx) playEntrance(main, 'slideInFromRight', 220);
  else if(newIdx < oldIdx) playEntrance(main, 'slideInFromLeft', 220);
}
function setCalView(on){
  STATE.calView=on; render(); scrollTimetableToTop();
  playEntrance(document.querySelector('#app main'), 'contentFadeIn', 220);
}

/* Assigns a side-by-side column (and the column count for its cluster) to
   each event whose time overlaps another's, so the calendar view never
   stacks unreadable text on top of itself. Standard interval-clustering +
   greedy-column approach used by most calendar UIs. */
function computeEventLayout(events){
  events.sort((a,b)=> a.startMin-b.startMin || a.endMin-b.endMin);
  let clusters=[], current=[], currentEnd=-1;
  events.forEach(e=>{
    if(current.length===0 || e.startMin < currentEnd){
      current.push(e); currentEnd=Math.max(currentEnd, e.endMin);
    } else {
      clusters.push(current); current=[e]; currentEnd=e.endMin;
    }
  });
  if(current.length) clusters.push(current);
  clusters.forEach(cluster=>{
    const colEnds=[];
    cluster.forEach(e=>{
      let col=-1;
      for(let i=0;i<colEnds.length;i++){ if(colEnds[i]<=e.startMin){ col=i; break; } }
      if(col===-1){ col=colEnds.length; colEnds.push(e.endMin); } else { colEnds[col]=e.endMin; }
      e._col=col;
    });
    cluster.forEach(e=>{ e._colCount=colEnds.length; });
  });
  return events;
}

const CAL_PX_PER_MIN = 2; // 120px per hour — zoomed in so short blocks fit their text
const CAL_MIN_BLOCK_MIN = 22; // shortest VISUAL block height (minutes-equivalent); never used for overlap detection
const CAL_GAP_PX = 6; // smallest visually-guaranteed gap before a following item, so a real gap is never fully swallowed by the minimum-height padding
const CAL_DEFAULT_DURATIONS = { meal:60, activity:60, travel:30, flight:30, stay:30 };

function renderCalendarView(rows, tripId){
  // Same-day flights already arrive here as a single 'full'-leg row (with
  // _calEnd set) from getDayRows; overnight flights arrive as separate
  // 'depart'/'arrive' rows on their respective days, clipped to midnight
  // below so together they read as one bar "cut" at the day boundary.
  const events = rows.map(r=>{
    const startMin = r.leg==='arrive' ? 0 : timeToMinutes(r.time);
    if(startMin===null) return null;
    let endMin; // the TRUE end time — used for overlap/column layout, never padded
    if(r.type==='flight'){
      if(r.leg==='full') endMin = timeToMinutes(r._calEnd);
      else if(r.leg==='depart') endMin = 1440; // overnight: runs to midnight, continues on the arrival day
      else endMin = timeToMinutes(r.time); // 'arrive' leg: runs from midnight to arrival time
    } else if((r.type==='activity' || r.type==='meal') && r.endTime){
      const e = timeToMinutes(r.endTime);
      endMin = (e!==null && e>startMin) ? e : startMin + CAL_DEFAULT_DURATIONS[r.type];
    } else if(r.type==='travel'){
      const parsed = parseDurationToMinutes(r.duration);
      endMin = startMin + (parsed && parsed>0 ? parsed : CAL_DEFAULT_DURATIONS.travel);
    } else {
      endMin = startMin + (CAL_DEFAULT_DURATIONS[r.type] || 45);
    }
    if(endMin===null || isNaN(endMin)) endMin = startMin + CAL_DEFAULT_DURATIONS.flight;
    if(endMin > 1440) endMin = 1440;
    return {...r, startMin, endMin};
  }).filter(Boolean);

  const untimed = rows.filter(r=>r.type!=='flight' && timeToMinutes(r.time)===null);

  // Layout uses the TRUE end times above, so a block that ends exactly when
  // the next one starts (e.g. an 18-minute drive followed immediately by an
  // activity) is correctly seen as back-to-back, not overlapping — it stacks
  // full-width instead of being split into side-by-side columns.
  computeEventLayout(events);

  const hourLabels = Array.from({length:24}, (_,h)=>{
    const period = h>=12 ? 'PM':'AM';
    let h12 = h%12; if(h12===0) h12=12;
    return `<div class="cal-hour-row" style="top:${h*60*CAL_PX_PER_MIN}px"><span class="cal-hour-label">${h12} ${period}</span></div>`;
  }).join('');

  const gutter = 46; // px reserved for hour labels
  const gapBufferMin = CAL_GAP_PX / CAL_PX_PER_MIN;
  const blocks = events.map((e, i) => {
    const top = e.startMin*CAL_PX_PER_MIN;
    // Visual-only minimum height so a very short block still fits its text —
    // this never feeds back into layout/overlap detection above. But when
    // there's a genuine gap before the next item, that padding must never eat
    // into it enough to imply the block ran right up to (or past) the next
    // item's start — a small real gap always stays visible as a real gap.
    let visualEndMin = Math.max(e.endMin, e.startMin + CAL_MIN_BLOCK_MIN);
    const next = events[i+1];
    if(next){
      const trueGap = next.startMin - e.endMin;
      if(trueGap > 0){
        const maxAllowedEnd = Math.max(e.endMin, next.startMin - Math.min(gapBufferMin, trueGap));
        if(visualEndMin > maxAllowedEnd) visualEndMin = maxAllowedEnd;
      }
    }
    const height = (visualEndMin - e.startMin) * CAL_PX_PER_MIN;
    const widthPct = 100/e._colCount;
    const leftPct = e._col*widthPct;
    const modeClass = e.type==='travel' ? ` mode-${e.mode||'driving'}` : '';
    const tapHandler = e.readonly ? '' : ` onclick="openSheet('editItem','${tripId}','${e.id}')"`;
    let displayTime;
    if(e.type==='flight'){
      const startStr = e.leg==='arrive' ? '12:00 AM' : fmtTime(e.time);
      const endStr = e.leg==='depart' ? '12:00 AM' : fmtTime(e.leg==='full' ? e._calEnd : e.time);
      displayTime = `${startStr} – ${endStr}`;
    } else if((e.type==='activity' || e.type==='meal') && e.endTime){
      displayTime = `${fmtTime(e.time)} – ${fmtTime(e.endTime)}`;
    } else {
      displayTime = fmtTime(e.time);
    }
    return `<div class="cal-event ${e.type}${modeClass}" style="top:${top}px;height:${height}px;left:calc(${gutter}px + ${leftPct}%);width:calc(${widthPct}% - 6px);"${tapHandler}>
      <div class="cal-event-time">${displayTime}</div>
      <div class="cal-event-name">${esc(e.name||'')}</div>
    </div>`;
  }).join('');

  const untimedList = untimed.length ? `<div class="hint" style="margin:0 0 10px;">No time set: ${untimed.map(r=>esc(r.name||'')).join(', ')} — edit from List view to add a time.</div>` : '';

  return `${untimedList}<div class="cal-wrap" style="height:${1440*CAL_PX_PER_MIN}px;">
    <div class="cal-gutter-line" style="left:${gutter}px;"></div>
    ${hourLabels}
    ${blocks}
  </div>`;
}

/* Builds the secondary meta line for a flight, tailored to which leg is being
   shown: departure-side details (check-in, boarding, departure terminal/gate)
   on the depart leg, arrival-side details on the arrive leg, and both
   (labelled) on a merged same-day 'full' block. */
function flightMeta(f, leg){
  const parts=[];
  const showDep = leg==='depart' || leg==='full';
  const showArr = leg==='arrive' || leg==='full';
  const tag = leg==='full' ? {dep:' (dep)', arr:' (arr)'} : {dep:'', arr:''};
  if(showDep){
    if(f.checkInTime) parts.push('Check-in '+fmtTime(f.checkInTime));
    if(f.boardingTime) parts.push('Boarding '+fmtTime(f.boardingTime));
    if(f.depTerminal) parts.push('Term '+f.depTerminal+tag.dep);
    if(f.depGate) parts.push('Gate '+f.depGate+tag.dep);
  }
  if(showArr){
    if(f.arrTerminal) parts.push('Term '+f.arrTerminal+tag.arr);
    if(f.arrGate) parts.push('Gate '+f.arrGate+tag.arr);
  }
  if(f.travellers && f.travellers.length){
    const travStr = f.travellers.map(tr => tr.name && tr.seat ? `${tr.name} ${tr.seat}` : (tr.name||tr.seat)).filter(Boolean).join(', ');
    if(travStr) parts.push(travStr);
  }
  if(f.confirmation) parts.push('Conf '+f.confirmation);
  return parts.join(' · ');
}

const MODE_LABELS = { driving:'driving', walking:'walking', transit:'transit', bicycling:'cycling' };

function renderItem(a,tripId,draggable){
  const kicker = a.type==='meal' ? (a.mealSlot||'meal')
    : a.type==='travel' ? (MODE_LABELS[a.mode] || 'travel')
    : a.type==='stay' ? 'accommodation'
    : a.type==='flight' ? (a.leg==='full' ? 'flight' : ('flight · '+(a.leg==='arrive'?'arrives':'departs')))
    : 'activity';
  let loc = '', extraActions='', meta = a.meta;
  const modeClass = a.type==='travel' ? ` mode-${a.mode||'driving'}` : '';
  if(a.type==='travel'){
    loc = `${esc(a.origin||'')} → ${esc(a.destination||'')}`;
    if(a.origin && a.destination){
      const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(a.origin)}&destination=${encodeURIComponent(a.destination)}&travelmode=${a.mode||'driving'}`;
      extraActions = `<a href="${url}" target="_blank" rel="noopener">Open in Maps</a>`;
    }
    if(a.duration) loc += ` · ${esc(a.duration)}`;
  } else if(a.type==='flight'){
    loc = esc(a.location||'');
    if(a.leg==='full' && a._flight && a._flight.arrTime) loc += ` · lands ${fmtTime(a._flight.arrTime)}`;
    if(a._flight) meta = flightMeta(a._flight, a.leg);
    if(a._flight && a._flight.bookingLink){
      extraActions = `<a href="${attr(a._flight.bookingLink)}" target="_blank" rel="noopener">Open booking</a>`;
    }
  } else {
    loc = esc(a.location||'');
    if((a.type==='meal' || a.type==='activity') && a.endTime){
      const untilStr = `until ${fmtTime(a.endTime)}`;
      loc = loc ? `${loc} · ${untilStr}` : untilStr;
    }
  }
  const editBtn = a.readonly ? '' : `<button onclick="openSheet('editItem','${tripId}','${a.id}')">Edit</button>`;
  const delBtn = a.readonly ? '' : `<button class="del" onclick="deleteItem('${tripId}','${a.id}')">Delete</button>`;
  return `
    <div class="item ${a.type}${modeClass}" data-item-id="${a.id}"${draggable && !isAnchorRow(a) ? ' data-drag="1"' : ''}>
      <div class="bar"></div>
      <div class="time num">${fmtTime(a.time)||'--:--'}</div>
      <div class="body">
        <div class="kicker">${esc(kicker)}</div>
        <div class="iname">${esc(a.name||'')}</div>
        ${loc?`<div class="iloc">${loc}</div>`:''}
        ${meta?`<div class="iloc">${esc(meta)}</div>`:''}
        ${a.notes?`<div class="inotes">${esc(a.notes)}</div>`:''}
        <div class="actions">${extraActions}${editBtn}${delBtn}</div>
      </div>
    </div>`;
}
function deleteItem(tripId,itemId){
  animateThenRun(`[data-item-id="${itemId}"]`, ()=>{
    const t=getTrip(tripId); t.agenda = (t.agenda||[]).filter(a=>a.id!==itemId);
    save(DATA); render();
  });
}

/* ---- Reorder: press and hold an item in the list view, then drag ----
   Moving an item means retiming the day, because both views sort by time.
   "Ripple" rule: the moved item starts the moment the item above it ends
   (or takes the day's first start time if dropped at the top), and every
   item keeps its own length and the gap that sat before it. The gap that sat
   before the moved item stays where it was, so items beyond the affected
   stretch keep their times. Check-in/out and flights never move; items after
   one are laid out from its time, so a booking acts as a fixed wall. */
function minutesToTime(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function itemDurationMin(r){
  if((r.type==='activity'||r.type==='meal') && r.endTime){
    const s=timeToMinutes(r.time), e=timeToMinutes(r.endTime);
    if(s!==null && e!==null && e>s) return e-s;
  }
  if(r.type==='travel'){ const p=parseDurationToMinutes(r.duration); if(p && p>0) return p; }
  return CAL_DEFAULT_DURATIONS[r.type] || 45;
}
/* {start,end} in minutes for a day row, or null when it has no time. */
function rowSpan(r){
  const s = timeToMinutes(r.time);
  if(s===null) return null;
  if(r.type==='stay') return {start:s, end:s};
  if(r.type==='flight'){
    if(r.leg==='arrive') return {start:s, end:s};
    if(r.leg==='depart') return {start:s, end:1440};
    const e = timeToMinutes(r._calEnd);
    return {start:s, end:(e!==null && e>=s) ? e : s};
  }
  return {start:s, end:s+itemDurationMin(r)};
}
/* Works out the new times for dropping item itemId at position newIndex
   (its index in the day's rows once it has been taken out). Pure: returns
   {ok, unchanged?, reason?, changes:[{id,time,endTime?}], order:[ids]} and
   doesn't touch the trip, so it can be tested on its own. */
function planReorder(t, day, itemId, newIndex){
  const rows = getDayRows(t, day);
  const oldIndex = rows.findIndex(r=>r.id===itemId && !isAnchorRow(r));
  if(oldIndex<0) return {ok:false, reason:"That item can't be moved."};
  const moved = rows[oldIndex];
  const rest = rows.slice(); rest.splice(oldIndex,1);
  newIndex = Math.max(0, Math.min(rest.length, newIndex));
  if(newIndex===oldIndex) return {ok:true, unchanged:true, changes:[], order:rows.map(r=>r.id)};
  const newOrder = rest.slice(); newOrder.splice(newIndex,0,moved);

  // Original timeline: each timed row's span and the gap before it.
  const timed = rows.filter(r=>rowSpan(r));
  const info = new Map();
  let prevEnd = null;
  timed.forEach((r,i)=>{
    const sp = rowSpan(r);
    info.set(r, {span:sp, gap: i===0 ? 0 : sp.start-prevEnd});
    prevEnd = sp.end;
  });
  if(!timed.length) return {ok:true, unchanged:true, changes:[], order:newOrder.map(r=>r.id)};
  const base = rowSpan(timed[0]).start;
  // The gap before the moved item stays behind with the item that followed it.
  if(info.has(moved)){
    const ti = timed.indexOf(moved), follower = timed[ti+1];
    if(follower) info.get(follower).gap += info.get(moved).gap;
  }

  // Lay the day out again in the new order; untimed items (other than the
  // moved one) stay untimed and out of the way at the bottom.
  const seq = newOrder.filter(r=>r===moved || info.has(r));
  const placed = new Map();
  prevEnd = null;
  seq.forEach((r,i)=>{
    if(isAnchorRow(r)){ const sp=rowSpan(r); placed.set(r,sp); prevEnd=sp.end; return; }
    const dur = r===moved ? itemDurationMin(r) : (info.get(r).span.end - info.get(r).span.start);
    let start;
    if(r===moved){
      if(i===0){
        const next = seq[1];
        // Dropped above a booking at the top of the day: finish as it starts.
        start = (next && isAnchorRow(next)) ? Math.max(0, rowSpan(next).start - dur) : base;
      } else start = prevEnd;
    } else {
      start = i===0 ? base : prevEnd + info.get(r).gap;
    }
    start = Math.max(0, start);
    placed.set(r, {start, end:start+dur});
    prevEnd = start + dur;
  });

  const changes = [];
  for(const r of seq){
    if(isAnchorRow(r)) continue;
    const sp = placed.get(r), orig = info.get(r);
    const hasEnd = (r.type==='activity'||r.type==='meal') && r.endTime && orig &&
      timeToMinutes(r.endTime)===orig.span.end;
    if(sp.start > 1439 || (hasEnd && sp.end > 1439)){
      return {ok:false, reason:"There isn't room left in the day for that — it would run past midnight."};
    }
    if(orig && orig.span.start===sp.start) continue;
    const ch = {id:r.id, time:minutesToTime(sp.start)};
    if(hasEnd) ch.endTime = minutesToTime(sp.end);
    changes.push(ch);
  }
  return {ok:true, changes, order:newOrder.map(r=>r.id)};
}
/* Applies planReorder to the trip: new times, plus the moved item's place in
   the agenda array (which breaks ties between equal start times). Returns the
   plan, with a snapshot of the agenda for Undo. */
function reorderDayItem(tripId, day, itemId, newIndex){
  const t = getTrip(tripId);
  if(!t) return {ok:false, reason:'Trip not found.'};
  const plan = planReorder(t, day, itemId, newIndex);
  if(!plan.ok || plan.unchanged) return plan;
  plan.snapshot = JSON.parse(JSON.stringify(t.agenda||[]));
  const byId = {}; (t.agenda||[]).forEach(a=>{ byId[a.id]=a; });
  plan.changes.forEach(ch=>{
    const a = byId[ch.id]; if(!a) return;
    a.time = ch.time;
    if(ch.endTime) a.endTime = ch.endTime;
  });
  // Put the moved item just before the next movable item in the new order.
  const pos = plan.order.indexOf(itemId);
  const nextId = plan.order.slice(pos+1).find(id=>byId[id] && byId[id].type!=='flight');
  const movedObj = byId[itemId];
  t.agenda = t.agenda.filter(a=>a!==movedObj);
  const at = nextId ? t.agenda.indexOf(byId[nextId]) : -1;
  if(at>=0) t.agenda.splice(at,0,movedObj); else t.agenda.push(movedObj);
  return plan;
}

function dragHintSeen(){ try{ return localStorage.getItem('waypointDragHintSeen')==='1'; }catch(e){ return false; } }
function markDragHintSeen(){ try{ localStorage.setItem('waypointDragHintSeen','1'); }catch(e){} }

let _undoTimer = null;
function showUndo(msg, onUndo){
  const el = document.getElementById('undoToast');
  if(!el) return;
  el.querySelector('span').textContent = msg;
  const btn = el.querySelector('button');
  btn.onclick = ()=>{ hideUndo(); onUndo(); };
  el.classList.add('show');
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(hideUndo, 6000);
}
function hideUndo(){
  const el = document.getElementById('undoToast');
  if(el) el.classList.remove('show');
  clearTimeout(_undoTimer);
}

const DRAG_HOLD_MS = 380;   // how long to hold before the item lifts
const DRAG_SLOP_PX = 8;     // movement allowed while holding before it counts as a scroll
let _drag = null;
function reducedMotion(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

function dragPointerDown(target, x, y, isTouch){
  if(_drag) return;
  if(STATE.calView) return;
  const el = target && target.closest && target.closest('.tt-list .item[data-drag]');
  if(!el || target.closest('a, button, input, select, textarea')) return;
  const list = el.parentElement;
  _drag = { el, list, tripId:list.dataset.tripId, day:list.dataset.day, itemId:el.dataset.itemId,
            startX:x, startY:y, lastY:y, active:false, isTouch };
  el.classList.add('press');
  _drag.timer = setTimeout(liftDrag, DRAG_HOLD_MS);
}
function dragPointerMove(x, y, ev){
  if(!_drag) return;
  if(!_drag.active){
    if(Math.abs(x-_drag.startX) > DRAG_SLOP_PX || Math.abs(y-_drag.startY) > DRAG_SLOP_PX) cancelPendingDrag();
    return;
  }
  if(ev && ev.cancelable) ev.preventDefault();
  _drag.lastY = y;
  positionGhost();
  placeDragSlot();
}
function dragPointerUp(ev){
  if(!_drag) return;
  if(!_drag.active){ cancelPendingDrag(); return; }
  if(ev && ev.cancelable) ev.preventDefault();
  finishDrag();
}
function cancelPendingDrag(){
  if(!_drag) return;
  clearTimeout(_drag.timer);
  _drag.el.classList.remove('press');
  _drag = null;
}

function liftDrag(){
  const d = _drag; if(!d) return;
  const el = d.el;
  el.classList.remove('press');
  const rect = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.removeAttribute('data-item-id');
  ghost.classList.add('drag-ghost');
  Object.assign(ghost.style, { left:rect.left+'px', top:rect.top+'px', width:rect.width+'px', height:rect.height+'px' });
  document.body.appendChild(ghost);
  el.classList.add('drag-source');
  d.ghost = ghost; d.ghostTop = rect.top; d.height = rect.height;
  d.grabOffset = d.startY - rect.top;
  d.active = true;
  document.body.classList.add('is-dragging');
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
  positionGhost();
  d.raf = requestAnimationFrame(dragAutoScroll);
}
function positionGhost(){
  const d=_drag; if(!d || !d.ghost) return;
  d.ghost.style.transform = `translateY(${d.lastY - d.startY}px)`;
}
/* Moves the dashed slot to wherever the dragged card's middle now sits,
   sliding the cards it passes out of the way (FLIP). Uses offsetTop, which
   ignores the in-flight transforms, so mid-slide cards measure correctly. */
function placeDragSlot(){
  const d=_drag; if(!d) return;
  const list=d.list, el=d.el;
  const sibs = Array.from(list.children).filter(c=>c.classList.contains('item') && c!==el);
  const listTop = list.getBoundingClientRect().top;
  const centre = d.lastY - d.grabOffset + d.height/2 - listTop;
  let before = null;
  for(const s of sibs){ if(centre < s.offsetTop + s.offsetHeight/2){ before = s; break; } }
  const currentNext = (()=>{ let n=el.nextElementSibling; while(n && !n.classList.contains('item')) n=n.nextElementSibling; return n; })();
  if(before===currentNext) return;
  const oldTops = new Map(sibs.map(s=>[s, s.offsetTop]));
  if(before) list.insertBefore(el, before);
  else list.insertBefore(el, sibs[sibs.length-1].nextSibling);
  if(reducedMotion()) return;
  sibs.forEach(s=>{
    const delta = oldTops.get(s) - s.offsetTop;
    if(!delta) return;
    s.style.transition='none';
    s.style.transform=`translateY(${delta}px)`;
    void s.offsetWidth;
    s.style.transition='transform .2s cubic-bezier(.22,.61,.36,1)';
    s.style.transform='';
  });
}
/* Scrolls the page while the finger is held near the top (under the day bar)
   or bottom (above the tab bar), so an item can travel the whole day. */
function dragAutoScroll(){
  const d=_drag; if(!d || !d.active) return;
  const bar = document.querySelector('.timetable-sticky-bar');
  const tabs = document.querySelector('nav.tabbar');
  const topEdge = bar ? bar.getBoundingClientRect().bottom : 0;
  const bottomEdge = tabs ? tabs.getBoundingClientRect().top : window.innerHeight;
  const zone = 60;
  let speed = 0;
  if(d.lastY < topEdge + zone) speed = -Math.min(16, Math.ceil((topEdge + zone - d.lastY)/4));
  else if(d.lastY > bottomEdge - zone) speed = Math.min(16, Math.ceil((d.lastY - (bottomEdge - zone))/4));
  if(speed){
    const before = window.scrollY;
    window.scrollBy(0, speed);
    if(window.scrollY !== before) placeDragSlot();
  }
  d.raf = requestAnimationFrame(dragAutoScroll);
}
let _suppressClickUntil = 0;
function finishDrag(){
  const d=_drag; if(!d) return;
  cancelAnimationFrame(d.raf);
  _suppressClickUntil = Date.now() + 350;
  const items = Array.from(d.list.children).filter(c=>c.classList.contains('item'));
  const newIndex = items.indexOf(d.el);
  const settle = ()=>{
    if(d.ghost) d.ghost.remove();
    document.body.classList.remove('is-dragging');
    _drag = null;
    const res = reorderDayItem(d.tripId, d.day, d.itemId, newIndex);
    if(!res.ok){ render(); toast(res.reason || "Couldn't move that."); return; }
    if(res.unchanged){ render(); return; }
    markDragHintSeen();
    save(DATA); render();
    flashReordered(d.itemId, res.changes);
    const n = res.changes.length;
    showUndo(n ? `Moved · ${n} time${n===1?'':'s'} updated` : 'Moved', ()=>{
      const t=getTrip(d.tripId); if(!t) return;
      t.agenda = res.snapshot; save(DATA); render();
    });
  };
  // Glide the lifted card down into its slot, then rebuild with new times.
  if(d.ghost && !reducedMotion()){
    const slotTop = d.el.getBoundingClientRect().top;
    d.ghost.classList.add('dropping');
    d.ghost.style.transform = `translateY(${slotTop - d.ghostTop}px)`;
    setTimeout(settle, 190);
  } else settle();
}
function flashReordered(movedId, changes){
  const moved = document.querySelector(`.tt-list [data-item-id="${movedId}"]`);
  if(moved) playEntrance(moved, 'itemSettle', 320);
  changes.forEach(ch=>{
    const el = document.querySelector(`.tt-list [data-item-id="${ch.id}"]`);
    if(!el) return;
    el.classList.add('retimed');
    setTimeout(()=>el.classList.remove('retimed'), 1300);
  });
}

document.addEventListener('touchstart', e=>{
  if(e.touches.length!==1){ if(_drag && !_drag.active) cancelPendingDrag(); return; }
  const tch=e.touches[0]; dragPointerDown(e.target, tch.clientX, tch.clientY, true);
}, {passive:true});
document.addEventListener('touchmove', e=>{
  if(!_drag || !_drag.isTouch) return;
  const tch=e.touches[0]; if(tch) dragPointerMove(tch.clientX, tch.clientY, e);
}, {passive:false});
document.addEventListener('touchend', e=>{ if(_drag && _drag.isTouch) dragPointerUp(e); }, {passive:false});
document.addEventListener('touchcancel', ()=>{ if(_drag && _drag.isTouch){ if(_drag.active) finishDrag(); else cancelPendingDrag(); } });
document.addEventListener('mousedown', e=>{ if(e.button===0) dragPointerDown(e.target, e.clientX, e.clientY, false); });
document.addEventListener('mousemove', e=>{ if(_drag && !_drag.isTouch) dragPointerMove(e.clientX, e.clientY, e); });
document.addEventListener('mouseup', e=>{ if(_drag && !_drag.isTouch) dragPointerUp(e); });
// A tap that turned into a drag shouldn't also open whatever was under it.
document.addEventListener('click', e=>{ if((Date.now() < _suppressClickUntil || (_drag && _drag.active)) && !(e.target.closest && e.target.closest('#undoToast'))){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e=>{ if(_drag) e.preventDefault(); });
window.addEventListener('scroll', ()=>{ if(_drag && !_drag.active) cancelPendingDrag(); }, {passive:true});

/* ---- Accommodation ---- */
function renderAccommodation(t){
