/* ---- Packing ---- */
/* Groups a trip's packing items by category, in the category order the
   person set, with uncategorised items last under "Other". Every category is
   included even when empty, so a newly created one shows up straight away. */
function packGroups(t){
  const groups = (t.packingCategories||[]).map(c => ({ key:c.id, id:c.id, name:c.name, items:[] }));
  const byId = {};
  groups.forEach(g => { byId[g.id] = g; });
  const other = { key:'_none', id:'', name:'Other', items:[] };
  (t.packing||[]).forEach(p => { ((p.cat && byId[p.cat]) || other).items.push(p); });
  if(other.items.length) groups.push(other);
  return groups;
}
function packRowHtml(t, p){
  return `
    <div class="pack-row ${p.packed?'done':''}" data-pack-id="${p.id}">
      <input type="checkbox" ${p.packed?'checked':''} onchange="togglePack('${t.id}','${p.id}')" aria-label="Packed: ${attr(p.name)}">
      <div class="pname">${esc(p.name)}</div>
      <button class="edit" onclick="openSheet('editPack','${t.id}','${p.id}')">Edit</button>
      <button class="del" onclick="deletePack('${t.id}','${p.id}')" aria-label="Delete ${attr(p.name)}">✕</button>
    </div>`;
}
function packCountHtml(items){
  const done = items.filter(p => p.packed).length;
  const complete = items.length > 0 && done === items.length;
  return `<span class="pack-cat-count${complete?' complete':''}">${done}/${items.length}</span>`;
}
function renderPacking(t){
  ensurePackingModel(t);
  const list = t.packing;
  const hasCats = t.packingCategories.length > 0;
  if(!list.length && !hasCats){
    return `<div class="empty"><div class="big">Packing list is empty</div>Tap + to add items, or start with a category.
      <div style="margin-top:14px;"><button class="text-btn" onclick="openSheet('addPackCat','${t.id}')">New category</button></div></div>`;
  }
  const groups = packGroups(t);
  const packed = list.filter(p => p.packed).length;
  const allCollapsed = hasCats && groups.every(g => isPackCollapsed(t.id, g.key));
  const toolbar = `
    <div class="pack-toolbar">
      <span class="pack-summary">${packed} of ${list.length} packed</span>
      <div class="tool-btns">
        ${hasCats ? `<button class="text-btn" onclick="setAllPackCollapsed('${t.id}', ${allCollapsed?'false':'true'})">${allCollapsed?'Expand all':'Collapse all'}</button>` : ''}
        <button class="text-btn" onclick="openSheet('addPackCat','${t.id}')">New category</button>
      </div>
    </div>`;
  // No categories yet: keep the simple single list.
  if(!hasCats) return toolbar + `<div class="card">${list.map(p => packRowHtml(t,p)).join('')}</div><div class="pack-end-spacer" aria-hidden="true"></div>`;
  return toolbar + groupsHtml(t, groups) + `<div class="pack-end-spacer" aria-hidden="true"></div>`;
}
function groupsHtml(t, groups){
  return groups.map(g => {
    const collapsed = isPackCollapsed(t.id, g.key);
    return `
    <section class="pack-cat${collapsed?' collapsed':''}" data-cat-key="${g.key}">
      <div class="pack-cat-head">
        <button class="pack-cat-toggle" aria-expanded="${collapsed?'false':'true'}" onclick="togglePackCat('${t.id}','${g.key}')">
          <span class="chev" aria-hidden="true">▾</span>
          <span class="pack-cat-name">${esc(g.name)}</span>
          ${packCountHtml(g.items)}
        </button>
        ${g.id ? `<button class="pack-cat-edit" onclick="openSheet('editPackCat','${t.id}','${g.id}')" aria-label="Edit category ${attr(g.name)}">Edit</button>` : ''}
      </div>
      <div class="pack-cat-body">
        ${g.items.length ? g.items.map(p => packRowHtml(t,p)).join('') : `<div class="pack-cat-empty">Nothing in here yet.</div>`}
        <button class="pack-add-in" onclick="openSheet('addPack','${t.id}','${g.id}')">+ Add to ${esc(g.name)}</button>
      </div>
    </section>`;
  }).join('');
}
/* Collapsing a group toggles it in place rather than re-rendering, so the
   page doesn't jump or lose its scroll position. */
function togglePackCat(tripId, key){
  const now = !isPackCollapsed(tripId, key);
  setPackCollapsed(tripId, key, now);
  const sec = document.querySelector(`.pack-cat[data-cat-key="${key}"]`);
  if(sec){
    sec.classList.toggle('collapsed', now);
    const btn = sec.querySelector('.pack-cat-toggle');
    if(btn) btn.setAttribute('aria-expanded', now ? 'false' : 'true');
  }
  refreshPackToolbar(tripId);
}
function setAllPackCollapsed(tripId, collapsed){
  const t = getTrip(tripId);
  packGroups(t).forEach(g => setPackCollapsed(tripId, g.key, collapsed));
  render();
}
/* Keeps the "x of y packed", per-category counts and Collapse/Expand label
   in step after an in-place change. */
function refreshPackToolbar(tripId){
  const t = getTrip(tripId);
  if(!t) return;
  const summary = document.querySelector('.pack-toolbar .pack-summary');
  if(summary) summary.textContent = `${t.packing.filter(p=>p.packed).length} of ${t.packing.length} packed`;
  packGroups(t).forEach(g => {
    const count = document.querySelector(`.pack-cat[data-cat-key="${g.key}"] .pack-cat-count`);
    if(count) count.outerHTML = packCountHtml(g.items);
  });
  const allBtn = [...document.querySelectorAll('.pack-toolbar .text-btn')].find(b => /all$/.test(b.textContent));
  if(allBtn){
    const all = packGroups(t).every(g => isPackCollapsed(tripId, g.key));
    allBtn.textContent = all ? 'Expand all' : 'Collapse all';
    allBtn.setAttribute('onclick', `setAllPackCollapsed('${tripId}', ${all?'false':'true'})`);
  }
}
/* Toggling packed state updates the DOM directly (no full render()) so the
   pop animation isn't cut short by an immediate DOM rebuild. */
function togglePack(tripId,id){
  const t=getTrip(tripId); const p=t.packing.find(x=>x.id===id);
  p.packed=!p.packed; save(DATA);
  const row = document.querySelector(`[data-pack-id="${id}"]`);
  if(row){
    row.classList.toggle('done', p.packed);
    const cb = row.querySelector('input[type=checkbox]');
    if(cb) cb.checked = p.packed;
    row.classList.remove('just-toggled');
    void row.offsetWidth;
    row.classList.add('just-toggled');
  }
  refreshPackToolbar(tripId);
}
function submitPackCat(e, tripId, catId){
  e.preventDefault();
  const t = getTrip(tripId);
  ensurePackingModel(t);
  const name = document.getElementById('f_catname').value.trim();
  if(!name) return false;
  const clash = findPackCatByName(t, name);
  if(catId){
    const c = t.packingCategories.find(x => x.id === catId);
    if(!c) return false;
    if(clash && clash.id !== catId){ toast(`There's already a category called ${clash.name}`); return false; }
    c.name = name;
  } else {
    if(clash){ toast(`There's already a category called ${clash.name}`); return false; }
    const newId = ensurePackCat(t, name);
    setPackCollapsed(tripId, newId, false);
    STATE.lastPackCat = newId;
  }
  save(DATA); closeSheet(); render();
  return false;
}
/* Deleting a category never deletes its items: they move to "Other". */
function deletePackCat(tripId, catId){
  const t = getTrip(tripId);
  const c = t.packingCategories.find(x => x.id === catId);
  if(!c) return;
  const n = t.packing.filter(p => p.cat === catId).length;
  if(n && !confirm(`Delete "${c.name}"? Its ${n} item${n===1?'':'s'} will move to Other.`)) return;
  t.packing.forEach(p => { if(p.cat === catId) p.cat = ''; });
  t.packingCategories = t.packingCategories.filter(x => x.id !== catId);
  if(STATE.lastPackCat === catId) STATE.lastPackCat = '';
  setPackCollapsed(tripId, catId, false);
  save(DATA); closeSheet(); render();
}
function movePackCat(tripId, catId, dir){
  const t = getTrip(tripId);
  const i = t.packingCategories.findIndex(x => x.id === catId);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= t.packingCategories.length) return;
  const cats = t.packingCategories;
  [cats[i], cats[j]] = [cats[j], cats[i]];
  save(DATA); render();
  // Keep the sheet open for further moves: refresh its contents in place
  // (re-opening it would replay the pop animation on every tap).
  document.querySelectorAll('.fab').forEach(f => f.classList.add('fab-hidden'));
  const sheet = document.querySelector('#sheetHost .sheet');
  if(sheet) sheet.innerHTML = `<button class="close" onclick="closeSheet()">✕</button>${sheetBody('editPackCat', tripId, catId)}`;
}
function onPackCatSelect(sel){
  const wrap = document.getElementById('newCatWrap');
  if(!wrap) return;
  const isNew = sel.value === '__new';
  wrap.style.display = isNew ? 'block' : 'none';
  if(isNew){ const inp = document.getElementById('f_newcat'); if(inp) inp.focus(); }
}
function deletePack(tripId,id){
  animateThenRun(`[data-pack-id="${id}"]`, ()=>{
    const t=getTrip(tripId); t.packing=t.packing.filter(p=>p.id!==id);
    save(DATA); render();
  });
}

/* ---- Budget ----
   Built like Packing: an ordered list of categories ({id, name}) and cost
   lines ({id, name, cat, planned, actual}). Amounts are stored as whole
   cents (or null when blank) so totals never pick up floating-point
   rounding. One list, two amounts per line: "Planned" before the trip,
   "Actual" after it, with the difference worked out per line, per category
   and for the whole trip. */
const BUDGET_SUGGESTED = ['Flights','Accommodation','Car rental','Food & drink','Activities','Other spending'];
function ensureBudgetModel(t){
  if(!Array.isArray(t.budgetCategories)) t.budgetCategories = [];
  if(!Array.isArray(t.budget)) t.budget = [];
  t.budget.forEach(b => { if(b.cat && !t.budgetCategories.some(c => c.id === b.cat)) b.cat = ''; });
}
function findBudgetCatByName(t, name){
  const n = (name||'').trim().toLowerCase();
  return (t.budgetCategories||[]).find(c => c.name.trim().toLowerCase() === n);
}
function ensureBudgetCat(t, name){
  name = (name||'').trim();
  if(!name) return '';
  if(!Array.isArray(t.budgetCategories)) t.budgetCategories = [];
  const found = findBudgetCatByName(t, name);
  if(found) return found.id;
  const c = { id:uid(), name };
  t.budgetCategories.push(c);
  return c.id;
}
/* "$1,234.50", "1234.5", "  80 " → cents; blank → null; nonsense → NaN. */
function parseMoney(str){
  const s = String(str==null?'':str).replace(/[$,\s]/g,'').replace(/^AUD/i,'');
  if(s==='') return null;
  if(!/^-?(\d+\.?\d{0,2}|\.\d{1,2})$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100);
}
function fmtMoney(cents){
  if(cents==null || isNaN(cents)) return '';
  const neg = cents < 0, v = Math.abs(cents)/100;
  return (neg?'−':'') + '$' + v.toLocaleString('en-AU', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function moneyInputValue(cents){ return cents==null ? '' : (cents/100).toFixed(2); }
function budgetMode(t){
  if(STATE.budgetMode) return STATE.budgetMode;
  // Once the trip is over, open on Actual — that's when the receipts come out.
  return (t.endDate && todayStr() > t.endDate) ? 'actual' : 'planned';
}
function setBudgetMode(mode){
  STATE.budgetMode = mode; render();
  playEntrance(document.querySelector('#app main'), 'contentFadeIn', 220);
}
function budgetGroups(t){
  const groups = (t.budgetCategories||[]).map(c => ({ key:'b:'+c.id, id:c.id, name:c.name, items:[] }));
  const byId = {}; groups.forEach(g => { byId[g.id] = g; });
  const other = { key:'b:_none', id:'', name:'Other', items:[] };
  (t.budget||[]).forEach(b => { ((b.cat && byId[b.cat]) || other).items.push(b); });
  if(other.items.length) groups.push(other);
  return groups;
}
/* Totals for a set of lines. actualEntered counts lines with an actual
   amount, so a half-filled-in Actual view can say so instead of reading as
   wildly under budget. */
function budgetTotals(items){
  let planned = 0, actual = 0, entered = 0, plannedOfEntered = 0;
  items.forEach(b => {
    planned += b.planned || 0;
    if(b.actual != null){ actual += b.actual; entered++; plannedOfEntered += b.planned || 0; }
  });
  return { planned, actual, entered, count:items.length, plannedOfEntered };
}
/* "$12.00 over" / "$5.00 under" / "On budget", with a class for colour. */
function diffHtml(actual, planned, cls, suffix){
  const d = actual - planned, sfx = suffix ? ' ' + suffix : '';
  if(d === 0) return `<span class="${cls} even">On budget${sfx}</span>`;
  return `<span class="${cls} ${d>0?'over':'under'}">${fmtMoney(Math.abs(d))} ${d>0?'over':'under'}${sfx}</span>`;
}
function budgetRowHtml(t, b, mode){
  const field = mode==='actual' ? 'actual' : 'planned';
  const val = b[field];
  let sub = '';
  if(mode==='actual'){
    const plannedStr = b.planned!=null ? `Planned ${fmtMoney(b.planned)}` : 'Not planned';
    sub = `<div class="bud-sub">${plannedStr}${b.actual!=null && b.planned!=null ? ' · ' + diffHtml(b.actual, b.planned, 'bud-diff') : ''}</div>`;
  }
  return `
    <div class="bud-row" data-budget-id="${b.id}">
      <button class="bud-name" onclick="openSheet('editBudget','${t.id}','${b.id}')" aria-label="Edit ${attr(b.name)}">
        <span class="bud-label">${esc(b.name)}</span>${sub}
      </button>
      <label class="bud-amt">

/* CSV columns shared across row types.
   endDate is only used by accommodation rows (check-out date) so it never
   collides with endTime (an activity's end time or a stay's check-out time).
   travellers is a serialized "Name:Seat|Name:Seat" list (see (de)serializeTravellers). */
const CSV_COLS = ['type','date','time','endDate','endTime','mealSlot','name','location','origin','destination','duration','mode','confirmation','notes','packed','airline','flightNumber','depAirport','arrAirport','checkInTime','boardingTime','depTerminal','arrTerminal','depGate','arrGate','travellers','bookingLink','category','planned','actual'];
function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
/* Travellers round-trip through a single CSV cell as "Name:Seat|Name:Seat".
   Colons/pipes inside a name or seat are stripped rather than escaped —
   simpler, and those characters are never legitimate in either field. */
function serializeTravellers(travellers){
  if(!travellers || !travellers.length) return '';
  return travellers.map(t => `${(t.name||'').replace(/[:|]/g,' ')}:${(t.seat||'').replace(/[:|]/g,' ')}`).join('|');
}
function parseTravellers(str){
  if(!str) return [];
  return str.split('|').map(chunk=>{
    const i = chunk.indexOf(':');
    if(i===-1) return {name:'', seat:chunk.trim()};
    return {name:chunk.slice(0,i).trim(), seat:chunk.slice(i+1).trim()};
  }).filter(t=>t.name||t.seat);
}
/* Builds one CSV row from a partial object, filling every column in CSV_COLS
   order (blank where not applicable) — safer than positional arrays now that
   there are several row shapes sharing one column set. */
function csvRow(obj){
  return CSV_COLS.map(c => csvEscape(obj[c] !== undefined ? obj[c] : '')).join(',');
}
/* One trip as CSV text: the "# trip:" line, the header, then its rows. */
function buildTripCSV(t){
  const rows=[CSV_COLS.join(',')];
  (t.accommodations||[]).forEach(a=>{
    rows.push(csvRow({ type:'accommodation', date:a.checkIn, time:a.checkInTime||'', endDate:a.checkOut, endTime:a.checkOutTime||'',
      name:a.name, location:a.address, confirmation:a.confirmation||'', notes:a.notes||'' }));
  });
  (t.agenda||[]).forEach(a=>{
    if(a.type==='flight'){
      rows.push(csvRow({ type:'flight', date:a.depDate, time:a.depTime||'', endDate:a.arrDate, endTime:a.arrTime||'',
        name:a.name||'', confirmation:a.confirmation||'', notes:a.notes||'', airline:a.airline||'', flightNumber:a.flightNumber||'',
        depAirport:a.depAirport||'', arrAirport:a.arrAirport||'', checkInTime:a.checkInTime||'', boardingTime:a.boardingTime||'',
        depTerminal:a.depTerminal||'', arrTerminal:a.arrTerminal||'', depGate:a.depGate||'', arrGate:a.arrGate||'',
        travellers:serializeTravellers(a.travellers), bookingLink:a.bookingLink||'' }));
    } else {
      rows.push(csvRow({ type:a.type, date:a.date, time:a.time||'', endTime:a.endTime||'', mealSlot:a.mealSlot||'',
        name:a.name||'', location:a.location||'', origin:a.origin||'', destination:a.destination||'', duration:a.duration||'',
        mode:a.mode||'', notes:a.notes||'' }));
    }
  });
  // Categories go first, in order, so empty ones and the person's ordering
  // survive a round trip; each item then names its category.
  ensurePackingModel(t);
  const catName = {};
  (t.packingCategories||[]).forEach(c=>{
    catName[c.id] = c.name;
    rows.push(csvRow({ type:'packcat', name:c.name }));
  });
  (t.packing||[]).forEach(p=>{
    rows.push(csvRow({ type:'packing', name:p.name, packed:p.packed?'true':'false', category:catName[p.cat]||'' }));
  });
  // Budget: categories first (so order and empty ones survive), then costs.
  ensureBudgetModel(t);
  const budCatName = {};
  t.budgetCategories.forEach(c=>{
    budCatName[c.id] = c.name;
    rows.push(csvRow({ type:'budgetcat', name:c.name }));
  });
  t.budget.forEach(b=>{
    rows.push(csvRow({ type:'budget', name:b.name, category:budCatName[b.cat]||'',
      planned:moneyInputValue(b.planned), actual:moneyInputValue(b.actual) }));
  });
  const meta = `# trip:${csvEscape(t.name)} start:${t.startDate} end:${t.endDate}\n`;
  return meta + rows.join('\n');
}
/* Every trip in one file: each trip's own CSV, one after another. Each block
   starts with its "# trip:" line, so the file splits back into trips cleanly,
   and any single block still works as an ordinary one-trip import. */
function buildAllTripsCSV(){
  return DATA.trips.map(buildTripCSV).join('\n\n');
}
/* Splits a file into one CSV text per trip, at each "# trip:" line. A file
   with no such line is treated as a single trip. */
function splitTripsCSV(text){
  const lines = String(text||'').split(/\r?\n/);
  const chunks = [];
  let cur = [];
  lines.forEach(l => {
    if(/^#\s*trip:/.test(l) && cur.some(x => x.trim() !== '')){ chunks.push(cur.join('\n')); cur = []; }
    cur.push(l);
  });
  if(cur.some(x => x.trim() !== '')) chunks.push(cur.join('\n'));
  return chunks;
}
/* Builds trip objects from a one- or many-trip CSV (throws on bad input). */
function tripsFromCSVText(text){
  return splitTripsCSV(text).map(chunk => {
    const meta = parseTripMeta(chunk);
    const trip = { id:uid(), name:meta.name||'Imported trip', startDate:meta.start||null,
      endDate:meta.end||meta.start||null, accommodations:[], agenda:[], packing:[] };
    applyCSVToTrip(trip, chunk);
    widenTripRangeToData(trip);
    if(!trip.startDate) trip.startDate = todayStr();
    if(!trip.endDate) trip.endDate = trip.startDate;
    return trip;
  });
}
function exportCSV(tripId){
  const t=getTrip(tripId);
  const blob = new Blob([buildTripCSV(t)], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download = `${t.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV exported');
}
/* Parses a full CSV file (not line-by-line) so quoted fields containing
   embedded newlines — e.g. multi-line notes — are handled correctly. */
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQ=false;
      } else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip; \r\n handled via the \n branch */ }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
/* Parses CSV text and loads it into an existing trip object (wiping that
   trip's current accommodations/agenda/packing first). Throws a readable
   Error on malformed input instead of failing silently. Shared by both
   "import into this trip" and "restore as a new trip". */
function applyCSVToTrip(t, text){
  const allRows=parseCSV(text).filter(r=>!(r.length===1 && r[0].startsWith('#')) && r.some(c=>c!==''));
  if(!allRows.length) throw new Error('That file has no data in it.');
  const header=allRows[0];
  if(header.indexOf('type')===-1) throw new Error("That doesn't look like a Waypoint CSV export (no \"type\" column found).");
  const idx=c=>header.indexOf(c);
  const hasCatCol = idx('category') >= 0;
  t.accommodations=[]; t.agenda=[]; t.packing=[]; t.packingCategories=[];
  t.budget=[]; t.budgetCategories=[];
  for(let i=1;i<allRows.length;i++){
    const cols=allRows[i];
    const get=c=> idx(c)>=0 ? (cols[idx(c)]||'') : '';
    const type=get('type');
    if(type==='accommodation'){
      t.accommodations.push({ id:uid(), name:get('name'), address:get('location'),
        checkIn:get('date'), checkInTime:get('time'), checkOut:get('endDate'), checkOutTime:get('endTime'),
        confirmation:get('confirmation'), notes:get('notes') });
    } else if(type==='budgetcat'){
      ensureBudgetCat(t, get('name'));
    } else if(type==='budget'){
      const pl = parseMoney(get('planned')), ac = parseMoney(get('actual'));
      t.budget.push({ id:uid(), name:get('name'), cat:ensureBudgetCat(t, get('category')),
        planned: Number.isNaN(pl) ? null : pl, actual: Number.isNaN(ac) ? null : ac });
    } else if(type==='packcat'){
      ensurePackCat(t, get('name'));
    } else if(type==='packing'){
      // With a category column, an empty cell means "no category". Without
      // one (a CSV from before categories), leave cat unset so the
      // "Category: item" name migration in ensurePackingModel can apply.
      const item = { id:uid(), name:get('name'), packed:get('packed')==='true' };
      if(hasCatCol) item.cat = ensurePackCat(t, get('category'));
      t.packing.push(item);
    } else if(type==='flight'){
      // depTerminal/depGate fall back to the old single terminal/gate columns,
      // and travellers falls back to the old single seat column, so a CSV
      // exported before these fields existed still imports cleanly.
      const travellers = get('travellers') ? parseTravellers(get('travellers'))
        : (get('seat') ? [{name:'', seat:get('seat')}] : []);
      t.agenda.push({ id:uid(), type:'flight', name:get('name'), depDate:get('date'), depTime:get('time'),
        arrDate:get('endDate'), arrTime:get('endTime'), airline:get('airline'), flightNumber:get('flightNumber'),
        depAirport:get('depAirport'), arrAirport:get('arrAirport'),
        checkInTime:get('checkInTime'), boardingTime:get('boardingTime'),
        depTerminal:get('depTerminal')||get('terminal'), arrTerminal:get('arrTerminal'),
        depGate:get('depGate')||get('gate'), arrGate:get('arrGate'),
        travellers, bookingLink:get('bookingLink'),
        confirmation:get('confirmation'), notes:get('notes') });
    } else if(['meal','activity','travel'].includes(type)){
      t.agenda.push({ id:uid(), type, date:get('date'), time:get('time'), endTime:get('endTime'),
        mealSlot:get('mealSlot'), name:get('name'), location:get('location'), origin:get('origin'),
        destination:get('destination'), duration:get('duration'), mode:get('mode')||(type==='travel'?'driving':''), notes:get('notes') });
    }
  }
  ensurePackingModel(t); // migrate "Category: item" names from older CSVs
}
function importCSV(tripId){
  const f=document.getElementById('importFile').files[0];
  if(!f){ toast('Choose a CSV file first'); return; }
  const reader=new FileReader();
  reader.onerror=()=>toast('Could not read that file — please try again.');
  reader.onload = e=>{
    try{
      const n = splitTripsCSV(e.target.result).length;
      if(n > 1){ toast(`That file has ${n} trips. Use "Restore a trip from CSV" on the home screen instead.`); return; }
      const t=getTrip(tripId);
      applyCSVToTrip(t, e.target.result);
      widenTripRangeToData(t);
      save(DATA); toast('Trip restored from CSV'); render();
    } catch(err){
      toast(err.message || 'Could not import that file.');
    }
  };
  reader.readAsText(f);
}

/* ---------- SHEETS (forms) ---------- */
function closeSheet(){
  const host = document.getElementById('sheetHost');
  const sheet = host.querySelector('.sheet');
  const backdrop = host.querySelector('.sheet-backdrop');
  document.querySelectorAll('.fab').forEach(f => f.classList.remove('fab-hidden'));
  if(!sheet){ host.innerHTML=''; return; }
  sheet.classList.add('closing');
  if(backdrop) backdrop.classList.add('closing');
  setTimeout(()=>{ host.innerHTML=''; }, 200);
}
function openSheet(kind, tripId, itemId){
  document.querySelectorAll('.fab').forEach(f => f.classList.add('fab-hidden'));
  const host=document.getElementById('sheetHost');
  host.innerHTML = `<div class="sheet-backdrop" onclick="if(event.target===this) closeSheet()">
    <div class="sheet sheet-wrap"><button class="close" onclick="closeSheet()">✕</button>${sheetBody(kind,tripId,itemId)}</div>
  </div>`;
}

function attr(v){ return v ? String(v).replace(/"/g,'&quot;') : ''; }
/* One traveller name+seat row for the flight form. Used both for the initial
   render (from saved data, or migrated from the old single-seat field) and
   for rows added dynamically via "+ Add another traveller". */
function travellerRowHtml(name, seat){
  return `<div class="traveller-row">
    <input type="text" class="trav-name" placeholder="Traveller name" value="${attr(name)}">
    <input type="text" class="trav-seat" placeholder="Seat e.g. 14A" value="${attr(seat)}">
    <button type="button" class="trav-remove" onclick="this.parentElement.remove()">✕</button>
  </div>`;
}
function travellerRowsHtml(a){
  if(a.travellers && a.travellers.length) return a.travellers.map(t=>travellerRowHtml(t.name,t.seat)).join('');
  if(a.seat) return travellerRowHtml('', a.seat); // migrating an older single-seat flight
  return travellerRowHtml('','');
}
function addTravellerRow(){
  document.getElementById('travellerRows').insertAdjacentHTML('beforeend', travellerRowHtml('',''));
}
function pickType(type){
  document.getElementById('f_type').value=type;
  document.querySelectorAll('#typePick button').forEach(b=>b.classList.toggle('sel', b.dataset.type===type));
  document.getElementById('mealFields').style.display = type==='meal'?'block':'none';
  document.getElementById('activityFields').style.display = type==='activity'?'block':'none';
  document.getElementById('travelFields').style.display = type==='travel'?'block':'none';
  document.getElementById('flightFields').style.display = type==='flight'?'block':'none';
  document.getElementById('dayFieldWrap').style.display = type==='flight'?'none':'block';

function submitTrip(e){
  e.preventDefault();
  const name=document.getElementById('f_name').value.trim();
  const start=document.getElementById('f_start').value;
  const end=document.getElementById('f_end').value;
  if(!name||!start||!end) return false;
  if(end<start){ toast('End date is before start date'); return false; }
  const trip={ id:uid(), name, startDate:start, endDate:end, accommodations:[], agenda:[], packing:[] };
  DATA.trips.push(trip); save(DATA); closeSheet();
  openTrip(trip.id);
  return false;
}

function submitStay(e,tripId,itemId){
  e.preventDefault();
  const t=getTrip(tripId);
  const data={
    name:document.getElementById('f_name').value.trim(),
    address:document.getElementById('f_address').value.trim(),
    checkIn:document.getElementById('f_in').value,
    checkInTime:document.getElementById('f_intime').value,
    checkOut:document.getElementById('f_out').value,
    checkOutTime:document.getElementById('f_outtime').value,
    confirmation:document.getElementById('f_conf').value.trim(),
    notes:document.getElementById('f_notes').value.trim(),
  };
  let newId = null;
  if(itemId){
    Object.assign(t.accommodations.find(a=>a.id===itemId), data);
  } else {
    newId = uid();
    t.accommodations.push({id:newId, ...data});
  }
  save(DATA); closeSheet();
  _justAddedId = newId;
  render();
  return false;
}

function submitPack(e,tripId,itemId){
  e.preventDefault();
  const name=document.getElementById('f_name').value.trim();
  if(!name) return false;
  const t=getTrip(tripId);
  ensurePackingModel(t);
  const sel = document.getElementById('f_cat');
  let cat = sel ? sel.value : (STATE.lastPackCat || '');
  if(cat === '__new'){
    const newName = document.getElementById('f_newcat').value.trim();
    if(!newName){ toast('Give the new category a name first'); return false; }
    cat = ensurePackCat(t, newName);
  }
  if(cat && !t.packingCategories.some(c => c.id === cat)) cat = '';
  STATE.lastPackCat = cat;
  setPackCollapsed(tripId, cat || '_none', false); // make sure the item is visible after saving
  if(itemId){
    const p = t.packing.find(x => x.id === itemId);
    if(p){ p.name = name; p.cat = cat; }
  } else {
    const newId = uid();
    t.packing.push({id:newId, name, packed:false, cat});
    _justAddedId = newId;
  }
  save(DATA); closeSheet();
  render();
  return false;
}

function submitItem(e,tripId,itemId){
  e.preventDefault();
  const type=document.getElementById('f_type').value;
  const date=document.getElementById('f_date').value;
  const t=getTrip(tripId);
  let data={type};
  if(type!=='flight') data.date=date;
  if(type==='meal'){
    data.mealSlot=document.getElementById('f_mealslot').value;
    data.time=document.getElementById('f_mealtime').value;
    data.endTime=document.getElementById('f_mealendtime').value;
    data.name=document.getElementById('f_mealname').value.trim();
    data.location=document.getElementById('f_mealloc').value.trim();
    data.notes=document.getElementById('f_mealnotes').value.trim();
  } else if(type==='activity'){
    data.name=document.getElementById('f_actname').value.trim();
    data.time=document.getElementById('f_acttime').value;
    data.endTime=document.getElementById('f_actend').value;
    data.location=document.getElementById('f_actloc').value.trim();
    data.notes=document.getElementById('f_actnotes').value.trim();
  } else if(type==='travel'){
    data.time=document.getElementById('f_traveltime').value;
    data.origin=document.getElementById('f_origin').value.trim();
    data.destination=document.getElementById('f_destination').value.trim();
    data.duration=document.getElementById('f_duration').value.trim();
    data.mode=document.getElementById('f_mode').value;
    data.name = `${data.origin||'Origin'} → ${data.destination||'Destination'}`;
    data.notes=document.getElementById('f_travelnotes').value.trim();
  } else if(type==='flight'){
    data.airline=document.getElementById('f_airline').value.trim();
    data.flightNumber=document.getElementById('f_flightnum').value.trim();
    data.depAirport=document.getElementById('f_depairport').value.trim().toUpperCase();
    data.arrAirport=document.getElementById('f_arrairport').value.trim().toUpperCase();
    data.depDate=document.getElementById('f_depdate').value;
    data.depTime=document.getElementById('f_deptime').value;
    data.arrDate=document.getElementById('f_arrdate').value;
    data.arrTime=document.getElementById('f_arrtime').value;
    data.checkInTime=document.getElementById('f_checkintime').value;
    data.boardingTime=document.getElementById('f_boardingtime').value;
    data.depTerminal=document.getElementById('f_depterminal').value.trim();
    data.arrTerminal=document.getElementById('f_arrterminal').value.trim();
    data.depGate=document.getElementById('f_depgate').value.trim();
    data.arrGate=document.getElementById('f_arrgate').value.trim();
    data.travellers = [...document.querySelectorAll('#travellerRows .traveller-row')].map(row=>({
      name: row.querySelector('.trav-name').value.trim(),
      seat: row.querySelector('.trav-seat').value.trim()
    })).filter(tr=>tr.name || tr.seat);
    data.bookingLink=document.getElementById('f_bookinglink').value.trim();
    data.confirmation=document.getElementById('f_flightconf').value.trim();
    data.notes=document.getElementById('f_flightnotes').value.trim();
    data.name = `${data.airline} ${data.flightNumber}`.trim() || 'Flight';
  }
  if(itemId){
    Object.assign(t.agenda.find(a=>a.id===itemId), data);
  } else {
    const newId = uid();
    t.agenda.push({id:newId, ...data});
    _justAddedId = newId;
  }
  save(DATA); closeSheet();
  STATE.day = type==='flight' ? (data.depDate||STATE.day) : date;
  render();
  return false;
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function attachHomeHandlers(){}

/* ---------- Google Drive backup ----------
   Same approach as Jarful and the Send Log, which live on the same site:
   sign in with Google using the narrow drive.file permission (the app only
   ever sees files it made itself), save every trip as one CSV into a private
   "Waypoint Backups" folder, keep the newest 10. It backs up by itself a few
   seconds after a change and when the app is reopened, but only while a
   sign-in is still valid (about an hour), so it never pops up a Google window
   on its own. The sign-in is shared with Jarful and the Send Log: same client
   ID, same stored token.

   Waypoint-specific safeguards: it never backs up an app with no trips (so a
   new or cleared phone can't push a blank file into the 10 kept), and a
   restore keeps a copy of the phone's current trips first. */
var GOOGLE_CLIENT_ID = '865694161905-a6f6kdtp9g41r3muq9r020nihpgci0gd.apps.googleusercontent.com';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
var DRIVE_TOKEN_KEY = 'send-log-drive-token';
var BACKUP_FOLDER_NAME = 'Waypoint Backups';
var BACKUP_FOLDER_KEY = 'waypoint-backup-folder';
var BACKUP_META_KEY = 'waypoint-backup-meta';
var BEFORE_RESTORE_KEY = 'waypointData-before-restore';
var BACKUP_KEEP = 10;
var BACKUP_REMIND_DAYS = 3;
var DAY_MS = 86400000;

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

function storedDriveToken(){
  try {
    var t = JSON.parse(lsGet(DRIVE_TOKEN_KEY) || 'null');
    if(t && t.token && t.exp - 60000 > Date.now()) return t.token;
  } catch(e){}
  return null;
}
// Must run straight from a tap (nothing awaited first) or the browser blocks Google's window.
function getDriveToken(){
  var existing = storedDriveToken();
  if(existing) return Promise.resolve(existing);
  return new Promise(function(resolve, reject){
    var oauth = window.google && window.google.accounts && window.google.accounts.oauth2;
    if(!oauth){ reject(new Error("Google sign-in hasn't loaded. Check your connection and try again.")); return; }
    var client = oauth.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      include_granted_scopes: false,
      callback: function(resp){
        if(!resp || resp.error || !resp.access_token){
          reject(new Error(resp && resp.error === 'access_denied' ? "Google access wasn't allowed, so nothing was backed up." : "Google sign-in didn't finish. Try again."));
          return;
        }
        lsSet(DRIVE_TOKEN_KEY, JSON.stringify({ token: resp.access_token, exp: Date.now() + (Number(resp.expires_in) || 3600) * 1000 }));
        resolve(resp.access_token);
      },
      error_callback: function(err){
        var type = err && err.type;
        reject(new Error(type === 'popup_closed' ? 'Google sign-in was closed before it finished.'
          : type === 'popup_failed_to_open' ? "Google sign-in couldn't open. Allow pop-ups for this site and try again."
          : "Google sign-in didn't finish. Try again."));
      }
    });
    client.requestAccessToken();
  });
}

function readBackupMeta(){ try { return JSON.parse(lsGet(BACKUP_META_KEY) || 'null') || {}; } catch(e){ return {}; } }
function writeBackupMeta(m){ lsSet(BACKUP_META_KEY, JSON.stringify(m)); renderBackupUI(); }
function hashText(s){
  var h = 0x811c9dc5;
  for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + '-' + s.length;
}
// No trips means nothing worth backing up, so never "dirty".
function backupDirty(){ return DATA.trips.length > 0 && readBackupMeta().sig !== hashText(buildAllTripsCSV()); }

function backupFetch(token, url, opts, asText){
  opts = opts || {};
  var headers = { Authorization: 'Bearer ' + token };
  for(var k in (opts.headers || {})) headers[k] = opts.headers[k];
  return fetch(url, { method: opts.method || 'GET', headers: headers, body: opts.body }).then(function(res){
    if(res.status === 401){
      lsDel(DRIVE_TOKEN_KEY);
      var e = new Error('Your Google sign-in has expired. Tap Back up now to sign in again.');
      e.expired = true;
      throw e;
    }
    if(!res.ok) throw new Error('Google Drive returned an error (' + res.status + '). Try again.');
    if(res.status === 204) return null;
    return asText ? res.text() : res.json();
  });
}
function ensureBackupFolder(token){
  var id = lsGet(BACKUP_FOLDER_KEY);
  var check = id
    ? backupFetch(token, 'https://www.googleapis.com/drive/v3/files/' + id + '?fields=id,trashed')
        .then(function(f){ return (f && !f.trashed) ? id : null; }, function(e){ if(e.expired) throw e; return null; })
    : Promise.resolve(null);
  return check.then(function(ok){
    if(ok) return ok;
    var q = encodeURIComponent("name='" + BACKUP_FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    return backupFetch(token, 'https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)&spaces=drive').then(function(found){
      if(found.files && found.files.length) return found.files[0].id;
      return backupFetch(token, 'https://www.googleapis.com/drive/v3/files?fields=id', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: BACKUP_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
      }).then(function(made){ return made.id; });
    }).then(function(fid){ lsSet(BACKUP_FOLDER_KEY, fid); return fid; });
  });
}
function backupFileName(d){
  function p(n){ return String(n).padStart(2, '0'); }
  return 'Waypoint backup ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + p(d.getMinutes()) + '.csv';
}
function listBackups(token, folderId){
  return (folderId ? Promise.resolve(folderId) : ensureBackupFolder(token)).then(function(fid){
    var q = encodeURIComponent("'" + fid + "' in parents and trashed=false");
    return backupFetch(token, 'https://www.googleapis.com/drive/v3/files?q=' + q + '&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime,size)');
  }).then(function(res){ return res.files || []; });
}
function pruneBackups(token, folderId){
  return listBackups(token, folderId).then(function(files){
    return files.slice(BACKUP_KEEP).reduce(function(p, f){
      return p.then(function(){
        return backupFetch(token, 'https://www.googleapis.com/drive/v3/files/' + f.id + '?fields=id', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true })
        });
      });
    }, Promise.resolve());
  });
}
function localDay(d){ return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

// Automatic backups update one file per day, so a busy day doesn't use up
// all 10 copies. Back up now always makes a new file.
var backupInFlight = null;
function runBackup(token, force){
  if(backupInFlight) return backupInFlight;
  if(!DATA.trips.length) return Promise.reject(new Error('There are no trips to back up yet.'));
  backupInFlight = (function(){
    var csv = buildAllTripsCSV(), sig = hashText(csv);
    if(!force && readBackupMeta().sig === sig) return Promise.resolve({ skipped: true });
    var now = new Date(), meta = readBackupMeta(), folderId;
    function body(m){
      var fd = new FormData();
      fd.append('metadata', new Blob([JSON.stringify(m)], { type: 'application/json' }));
      fd.append('file', new Blob([csv], { type: 'text/csv' }));
      return fd;
    }
    return ensureBackupFolder(token).then(function(fid){
      folderId = fid;
      if(!force && meta.fileId && meta.day === localDay(now)){
        return backupFetch(token, 'https://www.googleapis.com/upload/drive/v3/files/' + meta.fileId + '?uploadType=multipart&fields=id,name,trashed', {
          method: 'PATCH', body: body({ name: backupFileName(now) })
        }).then(function(up){ return (up && !up.trashed) ? up : null; }, function(e){ if(e.expired) throw e; return null; });
      }
      return null;
    }).then(function(up){
      if(up) return up;
      return backupFetch(token, 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
        method: 'POST', body: body({ name: backupFileName(now), mimeType: 'text/csv', parents: [folderId] })
      });
    }).then(function(up){
      writeBackupMeta({ at: now.getTime(), sig: sig, name: up.name, fileId: up.id, day: localDay(now) });
      return pruneBackups(token, folderId).catch(function(){}).then(function(){ return up; });
    });
  })();
  backupInFlight.then(function(){ backupInFlight = null; }, function(){ backupInFlight = null; });
  return backupInFlight;
}

var backupTimer = null, backupDueAt = 0;
function scheduleAutoBackup(delay){
  delay = delay == null ? 8000 : delay;
  var due = Date.now() + delay;
  if(backupTimer && backupDueAt <= due) return;
  clearTimeout(backupTimer);
  backupDueAt = due;
  backupTimer = setTimeout(function(){
    backupTimer = null;
    renderBackupUI();
    var token = storedDriveToken();
    if(token && backupDirty()) runBackup(token, false).catch(function(){ renderBackupUI(); });
  }, delay);
}

function formatBackupTime(ms){
  var d = new Date(ms), h = d.getHours(), ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return d.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' }) + ' at ' + h + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + ap;
}

/* ---- Drive UI. Waypoint re-renders whole screens, so the panel and the
   reminder are drawn from this state and redrawn in place when it changes. */
var reminderFlash = null;
var driveBusy = false, driveFiles = null, driveConfirm = null, driveMessage = null, driveMsgTimer = null;

function reminderHtml(){ return '<div class="backup-reminder" id="backup-reminder" hidden></div>'; }
function drivePanelHtml(){
  return '<div class="card drive-panel" id="drive-panel">' + drivePanelInner() + '</div>';
}
function drivePanelInner(){
  var meta = readBackupMeta(), dirty = backupDirty();
  var status = esc(meta.at ? 'Last backed up ' + formatBackupTime(meta.at) : 'Not backed up to Drive yet') +
    (meta.at && dirty ? '<span class="waiting"> · newer changes waiting</span>' : '');
  var list = '';
  if(driveFiles){
    list = !driveFiles.length ? '<div class="drive-note">No backups in Drive yet.</div>'
      : driveFiles.map(function(f, i){
        var when = formatBackupTime(new Date(f.modifiedTime).getTime());
        var size = Math.max(1, Math.round(Number(f.size || 0) / 1024)) + ' KB';
        var confirming = driveConfirm === f.id;
        return '<div class="drive-file"><div class="drive-file-row"><span>' + esc(when) +
          ' <small>' + (i === 0 ? '· latest · ' : '· ') + size + '</small></span>' +
          (confirming ? '' : '<button type="button" class="btn secondary" onclick="drivePick(\'' + attr(f.id) + '\')">Restore</button>') + '</div>' +
          (confirming ? '<div class="drive-confirm">This replaces all your trips on this phone with this backup.' +
            '<div class="drive-btns"><button type="button" class="btn danger" ' + (driveBusy ? 'disabled' : '') + ' onclick="driveRestore(\'' + attr(f.id) + '\')">' + (driveBusy === 'restore' ? 'Restoring…' : 'Restore this') + '</button>' +
            '<button type="button" class="btn secondary" onclick="driveCancel()">Cancel</button></div></div>' : '') +
          '</div>';
      }).join('');
  }
  return '<div class="drive-status">' + status + '</div>' +
    '<div class="drive-note">All your trips back up to a private Waypoint Backups folder in your Google Drive by themselves while you\'re signed in, keeping the last 10. Signing in here, in Jarful or in the Send Log covers all three.</div>' +
    '<div class="drive-btns">' +
      '<button type="button" class="btn" ' + (driveBusy ? 'disabled' : '') + ' onclick="driveBackupNow()">' + (driveBusy === 'backup' ? 'Backing up…' : 'Back up now') + '</button>' +
      '<button type="button" class="btn secondary" ' + (driveBusy && driveBusy !== 'list' ? 'disabled' : '') + ' onclick="driveToggleRestore()">' + (driveBusy === 'list' ? 'Loading…' : driveFiles ? 'Close' : 'Restore from Drive') + '</button>' +
    '</div>' +
    '<div class="drive-msg' + (driveMessage ? ' ' + driveMessage.tone : '') + '" ' + (driveMessage ? '' : 'hidden') + '>' + (driveMessage ? esc(driveMessage.text) : '') + '</div>' +
    '<div class="drive-list" ' + (driveFiles ? '' : 'hidden') + '>' + list + '</div>';
}
function renderBackupUI(){
  var panel = document.getElementById('drive-panel');
  if(panel) panel.innerHTML = drivePanelInner();
  var bar = document.getElementById('backup-reminder');
  if(!bar) return;
  var meta = readBackupMeta(), dirty = backupDirty();
  var due = dirty && (!meta.at || Date.now() - meta.at > BACKUP_REMIND_DAYS * DAY_MS);
  if(!due && !reminderFlash){ bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.className = 'backup-reminder' + (reminderFlash ? ' ' + reminderFlash.tone : '');
  var days = meta.at ? Math.floor((Date.now() - meta.at) / DAY_MS) : null;
  var text = reminderFlash ? reminderFlash.text
    : days == null ? 'Not backed up to Drive yet' : 'Last Drive backup ' + days + ' days ago';
  var showBtn = !(reminderFlash && reminderFlash.tone === 'ok');
  var busy = !!(reminderFlash && reminderFlash.tone === 'busy');
  var label = busy ? 'Backing up…' : reminderFlash && reminderFlash.tone === 'bad' ? 'Try again' : 'Back up';
  bar.innerHTML = '<span>' + esc(text) + '</span>' +
    (showBtn ? '<button type="button" ' + (busy ? 'disabled' : '') + ' onclick="reminderBackup()">' + label + '</button>' : '');
}
function driveMsg(text, tone){
  clearTimeout(driveMsgTimer);
  driveMessage = text ? { text: text, tone: tone } : null;
  renderBackupUI();
}

function backupNowFromTap(){ return getDriveToken().then(function(t){ return runBackup(t, true); }); }

function reminderBackup(){
  reminderFlash = { tone: 'busy', text: 'Backing up to Drive…' }; renderBackupUI();
  backupNowFromTap().then(function(){
    reminderFlash = { tone: 'ok', text: 'Backed up to Drive ✓' }; renderBackupUI();
    setTimeout(function(){ reminderFlash = null; renderBackupUI(); }, 2500);
  }, function(e){ reminderFlash = { tone: 'bad', text: e.message }; renderBackupUI(); });
}
function driveBackupNow(){
  driveBusy = 'backup'; driveMsg(null);
  backupNowFromTap().then(function(){
    driveBusy = false; driveMsg('Backed up to Drive ✓', 'ok');
    driveMsgTimer = setTimeout(function(){ driveMsg(null); }, 3000);
  }, function(e){ driveBusy = false; driveMsg(e.message, 'bad'); });
}
function driveToggleRestore(){
  if(driveFiles){ driveFiles = null; driveConfirm = null; driveBusy = false; renderBackupUI(); return; }
  driveBusy = 'list'; driveMsg(null);
  getDriveToken().then(function(t){ return listBackups(t); }).then(function(list){
    driveFiles = list; driveBusy = false; renderBackupUI();
  }, function(e){ driveBusy = false; driveMsg(e.message, 'bad'); });
}
function drivePick(id){ if(driveBusy) return; driveConfirm = id; renderBackupUI(); }
function driveCancel(){ if(driveBusy) return; driveConfirm = null; renderBackupUI(); }
function driveRestore(id){
  if(driveBusy) return;
  var token = storedDriveToken();
  if(!token){ driveFiles = null; driveConfirm = null; driveMsg('Your Google sign-in has expired. Tap Restore from Drive again.', 'bad'); return; }
  driveBusy = 'restore'; renderBackupUI();
  backupFetch(token, 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media', {}, true).then(function(text){
    var trips = tripsFromCSVText(text);
    if(!trips.length) throw new Error("That backup doesn't have any trips in it, so nothing was changed.");
    lsSet(BEFORE_RESTORE_KEY, JSON.stringify(DATA)); // safety copy of what this phone had
    DATA.trips = trips;
    save(DATA);
    driveFiles = null; driveConfirm = null; driveBusy = false;
    driveMessage = { text: 'Restored ' + trips.length + ' trip' + (trips.length === 1 ? '' : 's') + ' ✓', tone: 'ok' };
    driveMsgTimer = setTimeout(function(){ driveMsg(null); }, 4000);
    if(STATE.view !== 'home'){ goHome(); } else { render(); }
  }).catch(function(err){ driveBusy = false; driveMsg(err.message || "That backup couldn't be read.", 'bad'); });
}

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') scheduleAutoBackup(2000);
});
window.addEventListener('storage', function(e){
  // A Google sign-in from Jarful or the Send Log in another tab is a chance to back up now.
  if(e.key === DRIVE_TOKEN_KEY) scheduleAutoBackup(1500);
});

/* App-open splash: hold on the pin until its drop-and-bounce has finished
   (900ms), then fade it out to reveal the app underneath. The fade
   transition is attached here, right before triggering it — never present
   beforehand — so the splash can't be caught mid-transition at load.

   With Reduce Motion on (iOS Settings > Accessibility > Motion), the pin
   doesn't bounce, but the splash still holds briefly and fades. It used to
   vanish instantly with no hold, which showed as a one-frame flash. */
const SPLASH_HOLD_MS = 1000;
const SPLASH_HOLD_REDUCED_MS = 700;
function runSplash(){
  const splash = document.getElementById('splash');
  if(!splash) return;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    splash.style.transition = reduced ? 'opacity .3s ease' : 'opacity .45s ease';
    splash.classList.add('splash-hide');
  }, reduced ? SPLASH_HOLD_REDUCED_MS : SPLASH_HOLD_MS);
}

render();
runSplash();
window.__driveReady = true;
renderBackupUI();          // show the backup status and reminder straight away
scheduleAutoBackup(1500);  // and back up shortly after opening, if signed in
</script>
